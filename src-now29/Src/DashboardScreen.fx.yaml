DashboardScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =Set(varMonthStart, Date(Year(Now()), Month(Now()), 1));
        Set(varKpiRejectedAll,
            CountRows(Filter(AVCentralDepositRequests, Status.Value = "Rejected")));
        Set(varKpiRejectedMonth,
            CountRows(Filter(AVCentralDepositRequests, Status.Value = "Rejected", Created >= varMonthStart)));
        Set(varKpiMyMonthTotal,
            CountRows(Filter(AVCentralDepositRequests, 'Created By'.Email = User().Email, Created >= varMonthStart)));
        Set(varKpiMyMonthSuccess,
            CountRows(Filter(AVCentralDepositRequests, 'Created By'.Email = User().Email, Created >= varMonthStart, Status.Value = "Approved")));
        Set(varKpiAllMonthTotal,
            CountRows(Filter(AVCentralDepositRequests, Created >= varMonthStart)));
        Set(varKpiAllMonthSuccess,
            CountRows(Filter(AVCentralDepositRequests, Created >= varMonthStart, Status.Value = "Approved")));
        Set(varKpiAvgPublishDays,
            With(
                {approved: Filter(AVCentralDepositRequests, Status.Value = "Approved", Not(IsBlank(PublicationDate)))},
                If(CountRows(approved) = 0,
                    Blank(),
                    Round(
                        Average(AddColumns(approved, "durHours",
                            DateDiff(Created, PublicationDate, TimeUnit.Hours)),
                            durHours) / 24,
                        1))))

