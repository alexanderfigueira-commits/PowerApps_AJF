            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =282
            Items: |-
              =Filter(
                  AVCentralDepositRequests,
                  varUserRole = "ADMINISTRATOR" Or 'Created By'.Email = User().Email,
                  varFilter = "All" Or Status.Value = varFilter,
                  varFilterDG = "All" Or IsBlank(varFilterDG) Or DG.Value = varFilterDG,
                  IsBlank(varFilterRequestName) Or varFilterRequestName = "" Or StartsWith(RequestTitle, varFilterRequestName),
