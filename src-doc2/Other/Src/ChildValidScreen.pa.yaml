            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  3.  Legal & Docs"
            Width: =180
            X: =356
            Y: =52
      - CV_Tab4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(0, 18, 107, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="4.  Validations"
            Width: =170
            X: =546
            Y: =52
      - CV_Tab4Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =3
            Width: =170
            X: =546
            Y: =99
      - CV_OverallCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: |-
              =If(CountIf(colValidations, Not(Pass)) = 0,
                  RGBA(134, 239, 172, 1),
                  RGBA(254, 202, 202, 1))
            BorderThickness: =2
            Fill: |-
              =If(CountIf(colValidations, Not(Pass)) = 0,
                  RGBA(240, 253, 244, 1),
                  RGBA(254, 242, 242, 1))
            Height: =64
            Width: =1302
            X: =32
            Y: =112
      - CV_OverallIcon:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(CountIf(colValidations, Not(Pass)) = 0, RGBA(22,128,80,1), RGBA(193,40,40,1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =64
            Size: =28
            Text: =If(CountIf(colValidations, Not(Pass)) = 0, "✓", "✗")
            Width: =60
            X: =56
            Y: =112
      - CV_OverallStatus:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(CountIf(colValidations, Not(Pass)) = 0, RGBA(22,128,80,1), RGBA(193,40,40,1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =16
            Text: |-
              =If(CountIf(colValidations, Not(Pass)) = 0,
                  "Ready — all checks passed. Press Save archive to add to your request.",
                  Text(CountIf(colValidations, Not(Pass))) & " point(s) missing — resolve before saving")
            Width: =900
            X: =116
            Y: =112
