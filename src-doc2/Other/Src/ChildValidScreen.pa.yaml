                  {Check: "Contract reference number provided", Pass: Not(IsBlank(varChildContractRef)) And varChildContractRef <> "", Note: "Enter the contract reference on the Legal & Docs tab."},
                  {Check: "Contractor / agency provided (Photo only)", Pass: varChildMediaType <> "Photo" Or (Not(IsBlank(varChildCredits)) And varChildCredits <> ""), Note: "Enter the contractor / agency on the Metadata tab."},
                  {Check: "Description provided (Photo only)", Pass: varChildMediaType <> "Photo" Or (Not(IsBlank(varChildDescription1)) And varChildDescription1 <> ""), Note: "Enter the description on the Info tab."},
