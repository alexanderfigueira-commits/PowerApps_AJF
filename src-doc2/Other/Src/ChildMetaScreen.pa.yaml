            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(ChildInfoScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  1.  Info"
            Width: =150
            X: =16
            Y: =52
      - CM_Tab2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(0, 18, 107, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="2.  Metadata"
            Width: =170
            X: =176
            Y: =52
      - CM_Tab2Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =3
            Width: =170
            X: =176
            Y: =99
      - CM_Tab3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(ChildLegalScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="3.  Legal & Docs"
            Width: =180
            X: =356
            Y: =52
      - CM_Tab4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(ChildValidScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="4.  Validations"
            Width: =170
            X: =546
            Y: =52
      - CM_Gallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DelayItemLoading: =false
            Fill: =RGBA(247, 248, 250, 1)
            Height: =610
            Items: |-
              =[{id: 1}]
            LoadingSpinner: =LoadingSpinner.None
            TemplatePadding: =0
            TemplateSize: =580 + If(varChildMediaType = "Podcast", 360, If(varChildMediaType = "Photo", 160, 0))
            Width: =1366
            Y: =102
          Children:
            - CM_Card:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(220, 224, 230, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =560 + If(varChildMediaType = "Podcast", 340, If(varChildMediaType = "Photo", 160, 0))
                  Width: =1302
                  X: =32
                  Y: =16
            - CM_TypeBadge:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =RGBA(0, 18, 107, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(230, 236, 245, 1)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =12
                  Text: =If(varChildMediaType = "Photo", "Photo/Reportage", varChildMediaType)
                  Width: =166
                  X: =56
                  Y: =36
            - CM_SectionHeader:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  Size: =18
                  Text: ="Metadata"
                  Width: =840
                  X: =56
                  Y: =80
            - CM_LblLanguage:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Language version(s) *"
                  Visible: =varChildMediaType = "Podcast"
                  Width: =295
                  X: =56
                  Y: =366
            - CM_Language:
                Control: Classic/ComboBox@2.4.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  ChevronBackground: =RGBA(56, 96, 178, 1)
                  ChevronFill: =RGBA(255, 255, 255, 1)
                  ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  ChevronHoverFill: =RGBA(255, 255, 255, 1)
                  DefaultSelectedItems: |-
                    =If(IsBlank(varChildLanguageVersions) Or varChildLanguageVersions = "", Table(), Table({Value: varChildLanguageVersions}))
                  DisplayFields: =["Value"]
                  Font: =Font.'Open Sans'
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Items: =["EN", "FR", "DE", "IT", "ES", "PT", "NL", "PL", "RO", "EL", "CS", "SV", "HU", "BG", "DA", "FI", "SK", "HR", "LT", "SL", "LV", "ET", "MT", "GA", "Other"]
                  OnChange: =Set(varChildLanguageVersions, Self.Selected.Value)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 18, 107, 1)
                  SearchFields: =["Value"]
                  SelectMultiple: =false
                  SelectionColor: =RGBA(255, 255, 255, 1)
                  SelectionFill: =RGBA(56, 96, 178, 1)
                  Visible: =varChildMediaType = "Podcast"
                  Width: =295
                  X: =56
                  Y: =392
            - CM_LblCredits:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: |-
                    =If(varChildMediaType = "Photo", "Contractor / Agency *",
                       If(varChildMediaType = "Podcast", "Director, Motion Designer, Photographer",
                          If(varChildMediaType = "Video", "Director, Motion Designer, Photographer", "Director / producer *")))
                  Width: =If(varChildMediaType = "Podcast", 390, 500)
                  X: =If(varChildMediaType = "Photo", 588, If(varChildMediaType = "Video", 56, If(varChildMediaType = "Podcast", 896, 500)))
                  Y: =If(varChildMediaType = "Photo", 530, If(varChildMediaType = "Video", 476, If(varChildMediaType = "Podcast", 526, 122)))
            - CM_Credits:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =varChildCredits1
                  Font: =Font.'Open Sans'
                  HintText: |-
                    =If(varChildMediaType = "Photo", "Contractor or agency name",
                       If(varChildMediaType = "Podcast", "precise names + function",
                          If(varChildMediaType = "Video", "precise names + function", "Director and/or producer name")))
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  OnChange: =Set(varChildCredits1, Self.Text)
                  Width: =If(varChildMediaType = "Podcast", 390, 500)
                  X: =If(varChildMediaType = "Photo", 588, If(varChildMediaType = "Video", 56, If(varChildMediaType = "Podcast", 896, 500)))
                  Y: =If(varChildMediaType = "Photo", 556, If(varChildMediaType = "Video", 502, If(varChildMediaType = "Podcast", 552, 148)))
            - CM_LblDesc:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Editorial description (max 500 characters)"
                  Visible: =varChildMediaType <> "Photo" And varChildMediaType <> "Video" And varChildMediaType <> "Podcast"
                  Width: =700
                  X: =56
                  Y: =206
            - CM_Desc:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =varChildDescription1
                  Font: =Font.'Open Sans'
                  Height: =88
                  HintText: ="Editorial description, context and keywords"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Mode: =TextMode.MultiLine
                  OnChange: =Set(varChildDescription1, Self.Text)
                  Visible: =varChildMediaType <> "Photo" And varChildMediaType <> "Video" And varChildMediaType <> "Podcast"
                  Width: =1230
                  X: =56
                  Y: =232
            - CM_AIWarning:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(254, 202, 202, 1)
                  BorderThickness: =1
                  Fill: =RGBA(254, 242, 242, 1)
                  Height: =44
                  Visible: =varChildAIVoiceover
                  Width: =900
                  X: =56
                  Y: =If(varChildMediaType = "Podcast", 832, 408)
            - CM_AIWarningText:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(193, 40, 40, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  Text: ="⛔  AI voice-over is NOT accepted. This archive will fail validation and cannot be submitted."
                  Visible: =varChildAIVoiceover
                  Width: =880
                  X: =66
                  Y: =If(varChildMediaType = "Podcast", 832, 408)
            - CM_PodcastDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Visible: =false
                  Width: =1230
                  X: =56
                  Y: =468
            - CM_LblPodcastSection:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  Size: =15
                  Text: ="Podcast episode details"
                  Visible: =false
                  Width: =600
                  X: =56
                  Y: =480
            - CM_LblEpisodeSummary:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Summary of the episode *"
                  Visible: =varChildMediaType = "Podcast"
                  Width: =900
                  X: =56
                  Y: =258
            - CM_EpisodeSummary:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =varChildEpisodeSummary1
                  Font: =Font.'Open Sans'
                  Height: =64
                  HintText: ="Brief description of this episode (max 300 characters)"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Mode: =TextMode.MultiLine
                  OnChange: =Set(varChildEpisodeSummary1, Self.Text)
                  Visible: =varChildMediaType = "Podcast"
                  Width: =1230
                  X: =56
                  Y: =284
            - CM_LblSeasonNumber:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Season nr. *"
                  Visible: =varChildMediaType = "Podcast"
                  Width: =160
                  X: =56
                  Y: =178
            - CM_SeasonNumber:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =Text(varChildSeasonNumber)
                  Font: =Font.'Open Sans'
                  HintText: ="1"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  OnChange: =Set(varChildSeasonNumber, Value(Self.Text))
                  Visible: =varChildMediaType = "Podcast"
                  Width: =160
                  X: =56
                  Y: =204
            - CM_LblEpisodeNumber:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Episode nr. *"
                  Visible: =varChildMediaType = "Podcast"
                  Width: =160
                  X: =240
                  Y: =178
            - CM_EpisodeNumber:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =Text(varChildEpisodeNumber)
                  Font: =Font.'Open Sans'
                  HintText: ="1"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  OnChange: =Set(varChildEpisodeNumber, Value(Self.Text))
                  Visible: =varChildMediaType = "Podcast"
                  Width: =160
                  X: =240
                  Y: =204
            - CM_PhotoNotice:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(186, 202, 226, 1)
                  BorderThickness: =1
                  Fill: =RGBA(230, 236, 245, 1)
                  Height: =50
                  Visible: =varChildMediaType = "Photo"
                  Width: =1230
                  X: =56
                  Y: =122
            - CM_PodcastNote:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(186, 202, 226, 1)
                  BorderThickness: =1
                  Fill: =RGBA(230, 236, 245, 1)
                  Height: =40
                  Visible: =varChildMediaType = "Podcast"
                  Width: =1230
                  X: =56
                  Y: =122
            - CM_PhotoNoticeText:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  Height: =50
                  Italic: =true
                  Size: =12
                  Text: |-
                    ="Notice: Where technically possible, the IPTC metadata fields of the TIF/JPEG file should be filled in by the photographer or producing service."
                  Visible: =varChildMediaType = "Photo"
                  Width: =1206
                  X: =68
                  Y: =122
            - CM_PodcastNoteText:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  Italic: =true
                  Size: =12
                  Text: ="This section captures the metadata for each individual episode."
                  Visible: =varChildMediaType = "Podcast"
                  Width: =1206
                  X: =68
                  Y: =122
            - CM_LblShootDate:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: =If(varChildMediaType = "Video" Or varChildMediaType = "Podcast", "Filming date *", "Shooting date *")
                  Visible: =varChildMediaType = "Photo" Or varChildMediaType = "Video" Or varChildMediaType = "Podcast"
                  Width: =295
                  X: =If(varChildMediaType = "Podcast", 367, 56)
                  Y: =If(varChildMediaType = "Video", 122, If(varChildMediaType = "Podcast", 366, 186))
            - CM_ShootDate:
                Control: Classic/DatePicker@2.6.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DefaultDate: =varChildCaptureDate
                  Font: =Font.'Open Sans'
                  IconBackground: =RGBA(56, 96, 178, 1)
                  IconFill: =RGBA(255, 255, 255, 1)
                  OnChange: =Set(varChildCaptureDate, Self.SelectedDate)
                  Visible: =varChildMediaType = "Photo" Or varChildMediaType = "Video" Or varChildMediaType = "Podcast"
                  Width: =295
                  X: =If(varChildMediaType = "Podcast", 367, 56)
                  Y: =If(varChildMediaType = "Video", 148, If(varChildMediaType = "Podcast", 392, 212))
            - CM_LblPlacePhoto:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: =If(varChildMediaType = "Video" Or varChildMediaType = "Podcast", "Production place *", "Place *")
                  Visible: =varChildMediaType = "Photo" Or varChildMediaType = "Video" Or varChildMediaType = "Podcast"
                  Width: =If(varChildMediaType = "Podcast", 400, 500)
                  X: =If(varChildMediaType = "Video", 56, If(varChildMediaType = "Podcast", 367, 388))
                  Y: =If(varChildMediaType = "Video", 202, If(varChildMediaType = "Podcast", 446, 186))
            - CM_PlacePhoto:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =varChildProductionPlace1
                  Font: =Font.'Open Sans'
                  HintText: =If(varChildMediaType = "Photo", "where the photo has been taken", "City, country or venue")
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  OnChange: =Set(varChildProductionPlace1, Self.Text)
                  Visible: =varChildMediaType = "Photo" Or varChildMediaType = "Video" Or varChildMediaType = "Podcast"
                  Width: =If(varChildMediaType = "Podcast", 400, 500)
                  X: =If(varChildMediaType = "Video", 56, If(varChildMediaType = "Podcast", 367, 388))
                  Y: =If(varChildMediaType = "Video", 228, If(varChildMediaType = "Podcast", 472, 212))
            - CM_LblCaptions:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Photo captions *   (one entry per photo file)"
                  Visible: =varChildMediaType = "Photo"
                  Width: =800
                  X: =56
                  Y: =266
            - CM_CaptionGallery:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DelayItemLoading: =false
                  Height: =180
                  Items: =colPhotoCaptions
                  LoadingSpinner: =LoadingSpinner.None
                  TemplatePadding: =4
                  TemplateSize: =84
                  Visible: =varChildMediaType = "Photo"
                  Width: =1230
                  X: =56
                  Y: =292
                Children:
                  - CM_CapName:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =ThisItem.Name
                        Font: =Font.'Open Sans'
                        HintText: ="name of the photo file"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        OnChange: |-
                          =Patch(colPhotoCaptions, ThisItem, {Name: Self.Text})
                        Width: =380
                        Y: =8
                  - CM_CapCaption:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =ThisItem.Caption
                        Font: =Font.'Open Sans'
                        Height: =72
                        HintText: |-
                          ="short description with names and functions of personalities photographed and clear identification, e.g.: 1st from left to right"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        MaxLength: =500
                        Mode: =TextMode.MultiLine
                        OnChange: |-
                          =Patch(colPhotoCaptions, ThisItem, {Caption: Self.Text})
                        Width: =720
                        X: =396
                        Y: =4
                  - CM_CapRemove:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(220, 224, 230, 1)
