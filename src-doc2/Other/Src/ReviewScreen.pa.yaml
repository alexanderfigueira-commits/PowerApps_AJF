      - RV_LblComment:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
