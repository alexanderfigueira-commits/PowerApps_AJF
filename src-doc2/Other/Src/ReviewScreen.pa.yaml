            Width: =430
            Y: =106
          Children:
            - RV_QRowBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =71
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(varReviewProject, ThisItem);
                    Set(varReviewComment, Blank())
                  Width: =430
            - RV_QRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Width: =430
                  Y: =71
            - RV_QRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
