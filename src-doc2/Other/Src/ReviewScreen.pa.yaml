      - RV_BtnApprove:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: =If(Not(IsBlank(varReviewProject)), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(22, 128, 80, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(15, 90, 55, 1)
            OnSelect: |-
              =IfError(
                  Patch(AVCentralDepositRequests,
                      LookUp(AVCentralDepositRequests, ID = varReviewProject.ID),
                      {
                          Status: {Value: "Approved"},
                          // Assignee(s) = the approver, plus any co-assignees selected in RV_Assignee.
                          DG_Agency_Contact: ForAll(
                              Ungroup(
                                  Table(
                                      {u: Table({DisplayName: User().FullName, Mail: User().Email})},
                                      {u: ShowColumns(RV_Assignee.SelectedItems, "DisplayName", "Mail")}
                                  ),
                                  "u"
                              ) As pers,
                              {
                                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                  Claims: "i:0#.f|membership|" & Lower(pers.Mail),
                                  DisplayName: pers.DisplayName,
                                  Email: pers.Mail,
                                  Department: "",
                                  JobTitle: "",
                                  Picture: ""
                              }
                          ),
                          ReviewedByContact: Table({
                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                              DisplayName: User().FullName,
                              Email: User().Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          }),
                          ReviewedDate: Now()
                      }
                  );
                  Notify("Request approved.", NotificationType.Success);
                  Set(varReviewProject, Blank());
                  Set(varReviewComment, Blank()),
                  Notify("Approve failed: " & FirstError.Message, NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="✓  Approve"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =200
            X: =460
            Y: =680
      - RV_BtnReject:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(193, 40, 40, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(186, 196, 214, 1)
            DisabledFill: =RGBA(240, 242, 246, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewComment)) And varReviewComment <> "",
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(253, 235, 235, 1)
            OnSelect: |-
              =IfError(
                  Patch(AVCentralDepositRequests,
                      LookUp(AVCentralDepositRequests, ID = varReviewProject.ID),
                      {
                          Status: {Value: "Rejected"},
                          ReviewerComments: varReviewComment,
                          ReviewedByContact: Table({
                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                              DisplayName: User().FullName,
                              Email: User().Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          }),
                          ReviewedDate: Now()
                      }
                  );
                  Notify("Request rejected. The owner will see your comment on their next visit.", NotificationType.Warning);
                  Set(varReviewProject, Blank());
                  Set(varReviewComment, Blank()),
                  Notify("Reject failed: " & FirstError.Message, NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="✕  Reject"
            Visible: =Not(IsBlank(varReviewProject))
            X: =676
            Y: =680
