                )
            Fill: =RGBA(255, 255, 255, 1)
            Height: =36
            HoverFill: =RGBA(230, 236, 245, 1)
            OnSelect: |-
                =IfError(
                    Set(varCurrentRequest,
                        Patch(AVCentralDepositRequests,
                            If(
                                IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0,
                                Defaults(AVCentralDepositRequests),
                                LookUp(AVCentralDepositRequests, ID = varCurrentRequest.ID)
                            ),
                            {
                                RequestNumber: If(IsBlank(varCurrentRequest) Or Coalesce(varCurrentRequest.ID, 0) <= 0, With({yr: Text(Year(Today()))}, yr & "-" & Right("000" & Text(Value(Right(Coalesce(First(Sort(Filter(AVCentralDepositRequests, StartsWith(RequestNumber, yr & "-")), RequestNumber, SortOrder.Descending)).RequestNumber, yr & "-0000"), 4)) + 1), 4)), varCurrentRequest.RequestNumber),
                                RequestTitle: varRequestTitle,
                                DG: {Value: varRequestDG},
                                Description: varRequestDescription,
                                DG_Agency_Contact: ForAll(RS_Owner.SelectedItems As u, {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(u.Mail), DisplayName: u.DisplayName, Email: u.Mail, Department: "", JobTitle: "", Picture: ""}),
                                Contractor_Contact: ForAll(RS_Contractor.SelectedItems As u, {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(u.Mail), DisplayName: u.DisplayName, Email: u.Mail, Department: "", JobTitle: "", Picture: ""}),
                                Status: {Value: "Draft"}
                            }
                        )
                    );
                    Notify("Draft saved as Incomplete.", NotificationType.Success),
                    Notify("Error saving draft: " & FirstError.Message, NotificationType.Error)
                )
            PressedBorderColor: =RGBA(0, 0, 0, 1)
            Size: =13
            Text: ="💾  Save draft"
            X: =967
            Y: =438
            ZIndex: =16

