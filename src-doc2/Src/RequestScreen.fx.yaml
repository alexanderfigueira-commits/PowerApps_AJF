RequestScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =Set(varShowTypeConfirm, false);
        Set(varConfirmed, false);
        Set(varCurrentChildId, "");
        Clear(colArchives);
        If(
            Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0,
            Refresh(AVCentralDepositMediaItems);
            ForAll(
                Sort(
                    Filter(AVCentralDepositMediaItems, ParentRequest = varCurrentRequest.RequestNumber),
                    Modified,
                    SortOrder.Descending
                ),
                Collect(colArchives, {
                    ArchiveId: Text(ID),
                    SPId: ID,
                    Title: CD_MediaNumber,
                    MediaType: Coalesce(First(MediaType).Value, ""),
                    Description: Coalesce(Description, ""),
                    CaptureDate: CaptureDate,
                    ProductionPlace: Coalesce(ProductionPlace, ""),
                    ProductType: Coalesce(First(ProductType).Value, ""),
                    SeriesTitle: Coalesce(SeriesTitle, ""),
                    EpisodeTitle: Coalesce(EpisodeTitle, ""),
                    EpisodeSummary: Coalesce(EpisodeSummary, ""),
                    SeasonNumber: Coalesce(SeasonNumber, 0),
                    EpisodeNumber: Coalesce(EpisodeNumber, 0),
                    ProductionEndDate: ProductionEndDate,
                    PublicationStartDate: PublicationStartDate,
                    PublicationEndDate: PublicationEndDate,
                    ReferenceLinks: Coalesce(ReferenceLinks, ""),
                    Tags: Coalesce(Tags, ""),
                    FTPPath: Coalesce(FTPPath, ""),
                    LanguageVersions: Coalesce(First(LanguageVersions).Value, ""),
                    Credits: Coalesce(First(Photographer).DisplayName, First(Director).DisplayName, First(Producer).DisplayName, ""),
                    AIVoiceover: AIVoiceover = "Yes",
                    ContractCase: Coalesce(First(ContractCase).Value, ""),
                    ContractCase1Sub: Coalesce(First(ContractCase1Sub).Value, ""),
                    ModelRelease: false,
                    ModelReleaseProvided: Coalesce(ModelReleaseProvided, false),
                    MusicUsed: Coalesce(MusicUsed, false),
                    MusicLicenceProvided: Coalesce(MusicLicenseProvided, false),
                    Preexisting: false,
                    PreexistingProvided: Coalesce(PreexistingRightsProvided, false)
                })
            )
        );
        If(CountRows(colArchives) > 0, Set(varRequestMediaType, First(colArchives).MediaType))

