        "RS_ChildrenGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
            BorderColor: =RGBA(220, 224, 230, 1)
            DelayItemLoading: =true
            Height: =180
            Items: =colArchives
            Layout: =Layout.Vertical
            LoadingSpinner: =LoadingSpinner.Data
            TemplatePadding: =0
            TemplateSize: =56
            Width: =1302
