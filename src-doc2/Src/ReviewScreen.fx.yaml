        Height: =32
        Size: =11
        Text: ="TYPE"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =140
        X: =820
        Y: =180
        ZIndex: =12

    RV_ThValid As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Height: =32
        Size: =11
        Text: ="VALIDATION"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =160
        X: =976
        Y: =180
        ZIndex: =13

    "RV_ChildrenGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Height: =168
        Items: |-
            =If(
                IsBlank(varReviewProject),
                Filter(AVCentralDepositMediaItems, 1 = 2),
                Sort(
                    Filter(AVCentralDepositMediaItems, ParentRequest = varReviewProject.RequestNumber),
                    Modified, SortOrder.Descending
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =42
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =216
        ZIndex: =14

        RV_CRowDivider As rectangle:
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =900
            Y: =41
            ZIndex: =1

        RV_CRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =42
            Size: =12
            Text: =If(IsBlank(ThisItem.CD_MediaNumber) Or ThisItem.CD_MediaNumber = "New archive", "— untitled —", ThisItem.CD_MediaNumber)
            Width: =340
            X: =24
            ZIndex: =2

        RV_CRowType As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =42
            Size: =12
            Text: =If(IsBlank(First(ThisItem.MediaType).Value), "—", If(First(ThisItem.MediaType).Value = "Photo", "Photo/Reportage", First(ThisItem.MediaType).Value))
            Width: =140
            X: =384
            ZIndex: =3

        RV_CRowValid As label:
            Color: |-
                =If(
                    Not(IsBlank(ThisItem.CD_MediaNumber)) And ThisItem.CD_MediaNumber <> "New archive"
                    And Not(IsBlank(First(ThisItem.MediaType).Value))
                    And Not(IsBlank(First(ThisItem.ContractCase).Value))
                    And Not(ThisItem.AIVoiceover = "Yes"),
                    RGBA(22, 128, 80, 1),
                    RGBA(193, 40, 40, 1)
                )
            Height: =42
            Size: =12
            Text: |-
                =If(
                    Not(IsBlank(ThisItem.CD_MediaNumber)) And ThisItem.CD_MediaNumber <> "New archive"
                    And Not(IsBlank(First(ThisItem.MediaType).Value))
                    And Not(IsBlank(First(ThisItem.ContractCase).Value))
                    And Not(ThisItem.AIVoiceover = "Yes"),
                    "✓  Ready",
                    "⚠  Incomplete"
                )
            Width: =160
            X: =540
            ZIndex: =4

    RV_DetailDivider2 As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =392
        ZIndex: =15

    RV_LblOwnerAssign As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =24
        Text: ="Assignee(s)  —  approver is added on approval; add a co-assignee if needed"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =700
        X: =460
        Y: =404
        ZIndex: =16

    RV_Assignee As combobox:
        DefaultSelectedItems: |-
            =ForAll(varReviewProject.DG_Agency_Contact As p, {DisplayName: p.DisplayName, Mail: p.Email})
        DisplayFields: =["DisplayName"]
        InputTextPlaceholder: ="Search people to add as assignee…"
        IsSearchable: =true
        Items: |-
            =Office365Users.SearchUser({searchTerm: Self.SearchText, top: 20})
        SearchFields: =["DisplayName"]
        SearchItems: |-
            =Office365Users.SearchUser({searchTerm: Self.SearchText, top: 20})
        Visible: =Not(IsBlank(varReviewProject))
        Width: =380
        X: =460
        Y: =432
        ZIndex: =17

    RV_OwnerEmail As text:
        Default: =Coalesce(First(varReviewProject.Contractor_Contact).DisplayName, "—")
        DisplayMode: =DisplayMode.View
        HintText: ="Contractor contact"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =380
        X: =860
        Y: =432
        ZIndex: =18

    RV_DetailDivider3 As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =484
        ZIndex: =19

    RV_LblComment As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =24
        Text: ="Reviewer comment  (required to reject)"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =600
        X: =460
        Y: =496
        ZIndex: =20

    RV_Comment As text:
        Default: =Coalesce(varReviewComment, "")
        Height: =100
        HintText: ="Explain what needs to be corrected before the project can be approved."
        Mode: =TextMode.MultiLine
        OnChange: =Set(varReviewComment, Self.Text)
        Visible: =Not(IsBlank(varReviewProject))
        Width: =880
        X: =460
        Y: =524
        ZIndex: =21

    RV_ExistingComment As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =28
        Size: =12
        Text: |-
            ="Previous reviewer comment: " & Coalesce(varReviewProject.ReviewerComments, "none")
        Visible: =Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewProject.ReviewerComments))
        Width: =880
        X: =460
        Y: =628
        ZIndex: =22

    RV_DetailDivider4 As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =666
        ZIndex: =23

    RV_BtnApprove As button:
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: =If(Not(IsBlank(varReviewProject)), DisplayMode.Edit, DisplayMode.Disabled)
        Fill: =RGBA(22, 128, 80, 1)
        Height: =44
        HoverFill: =RGBA(15, 90, 55, 1)
        OnSelect: |-
            =IfError(
                Patch(AVCentralDepositRequests,
                    LookUp(AVCentralDepositRequests, ID = varReviewProject.ID),
                    {
                        Status: {Value: "Approved"},
                        // Assignee(s) = the approver, plus any co-assignees selected in RV_Assignee.
                        DG_Agency_Contact: Table({
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                            Claims: "i:0#.f|membership|" & Lower(User().Email),
                            DisplayName: User().FullName,
                            Email: User().Email,
                            Department: "",
                            JobTitle: "",
                            Picture: ""
                        }),
                        ReviewedByContact: Table({
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                            Claims: "i:0#.f|membership|" & Lower(User().Email),
                            DisplayName: User().FullName,
                            Email: User().Email,
                            Department: "",
                            JobTitle: "",
                            Picture: ""
                        }),
                        ReviewedDate: Now()
                    }
                );
                Notify("Request approved.", NotificationType.Success);
                Set(varReviewProject, Blank());
                Set(varReviewComment, ""),
                Notify("Approve failed: " & FirstError.Message, NotificationType.Error)
            )
        Size: =14
        Text: ="✓  Approve"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =200
        X: =460
        Y: =680
        ZIndex: =24

    RV_BtnReject As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(193, 40, 40, 1)
        DisabledColor: =RGBA(186, 196, 214, 1)
        DisabledFill: =RGBA(240, 242, 246, 1)
        DisplayMode: |-
            =If(
                Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewComment)) And varReviewComment <> "",
                DisplayMode.Edit,
                DisplayMode.Disabled
            )
        Fill: =RGBA(255, 255, 255, 1)
        Height: =44
        HoverFill: =RGBA(253, 235, 235, 1)
        OnSelect: |-
            =IfError(
                Patch(AVCentralDepositRequests,
                    LookUp(AVCentralDepositRequests, ID = varReviewProject.ID),
                    {
                        Status: {Value: "Rejected"},
                        ReviewerComments: varReviewComment,
                        ReviewedByContact: Table({
                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                            Claims: "i:0#.f|membership|" & Lower(User().Email),
                            DisplayName: User().FullName,
                            Email: User().Email,
                            Department: "",
                            JobTitle: "",
                            Picture: ""
                        }),
                        ReviewedDate: Now()
                    }
                );
                Notify("Request rejected. The owner will see your comment on their next visit.", NotificationType.Warning);
                Set(varReviewProject, Blank());
                Set(varReviewComment, ""),
                Notify("Reject failed: " & FirstError.Message, NotificationType.Error)
            )
        Size: =14
        Text: ="✕  Reject"
        Visible: =Not(IsBlank(varReviewProject))
        X: =676
        Y: =680
        ZIndex: =25

    RV_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =56
        Width: =1366
        ZIndex: =26

    RV_RejectHint As label:
