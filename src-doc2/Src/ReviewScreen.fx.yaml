    RV_QueuePanel As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =840
        Width: =430
        Y: =52
        ZIndex: =2

    RV_QueueTitle As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =44
        Size: =14
        Text: ="Submitted requests  (" & Text(CountRows(RV_QueueGallery.AllItems)) & ")"
