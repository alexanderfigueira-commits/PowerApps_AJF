        X: =16
        Y: =60
        ZIndex: =3

    RV_QueueDivider As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Width: =430
        Y: =104
        ZIndex: =4

    "RV_QueueGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(0, 0, 0, 0)
        DelayItemLoading: =true
        Height: =786
        Items: |-
            =Sort(
                Filter(colRevReqs,
                    If(varReviewQueueMine, Status.Value = "Pending", Status.Value = "Submitted"),
                    Not(varReviewQueueMine) Or Not(IsEmpty(Filter(DG_Agency_Contact, Lower(Email) = Lower(User().Email))))
                ),
                Modified, SortOrder.Descending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =72
        Width: =430
        Y: =106
        ZIndex: =5

        RV_QRowBg As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =71
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varReviewProject, ThisItem);
                Set(varReviewComment, "")
            Width: =430
            ZIndex: =1

        RV_QRowDivider As rectangle:
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =430
            Y: =71
            ZIndex: =2

        RV_QRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            OnSelect: =Select(Parent)
            Text: =ThisItem.RequestNumber
            Width: =390
            X: =20
            Y: =10
            ZIndex: =3

        RV_QRowMeta As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =24
            OnSelect: =Select(Parent)
            Size: =12
            Text: =Coalesce(ThisItem.DG.Value, "—") & "  ·  " & Coalesce(First(ThisItem.DG_Agency_Contact).DisplayName, "—")
            Width: =390
            X: =20
            Y: =38
            ZIndex: =4

    RV_DetailPanel As rectangle:
