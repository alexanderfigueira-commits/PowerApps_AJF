      - HomeGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =330
            Items: |-
              =Filter(
                  AVCentralDepositRequests,
                  varUserRole = "ADMINISTRATOR" Or 'Created By'.Email = User().Email,
                  varFilter = "All" Or Status.Value = varFilter,
                  varFilterDG = "All" Or IsBlank(varFilterDG) Or DG.Value = varFilterDG,
                  IsBlank(varFilterRequestName) Or varFilterRequestName = "" Or StartsWith(RequestNumber, varFilterRequestName),
                  IsBlank(varFilterMediaName) Or varFilterMediaName = "" Or
                      !IsEmpty(
                          Filter(
                              AVCentralDepositMediaItems,
                              ParentRequest = RequestNumber And StartsWith(Title, varFilterMediaName)
                          )
                      ),
                  IsBlank(varFilterStartDate) Or StartRequestDate >= varFilterStartDate,
                  IsBlank(varFilterEndDate) Or EndRequestDate <= varFilterEndDate
              )
            TemplateSize: =60
            Width: =1270
            X: =46
            Y: =364
          Children:
            - HomeRowSelect:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =59
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(
                        varCurrentRequest,
                        {
                            ID:            ThisItem.ID,
                            RequestNumber: ThisItem.RequestNumber,
                            RequestTitle:  ThisItem.RequestTitle,
                            DG:            ThisItem.DG.Value,
                            Description:   ThisItem.Description,
                            OwnerContact:  ThisItem.OwnerContact,
                            OwnerEmail:    ThisItem.OwnerEmail,
                            Status:        ThisItem.Status.Value
                        }
                    );
                    Navigate(RequestScreen, ScreenTransition.Cover)
                  Width: =1270
            - HomeRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 232, 238, 1)
                  Height: =1
                  Width: =1270
                  Y: =59
            - HomeRowRequest:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Text: =If(IsBlank(ThisItem.RequestNumber), "Untitled request", ThisItem.RequestNumber)
                  Width: =92
                  X: =20
            - HomeRowDG:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =If(IsBlank(ThisItem.DG.Value), "—", ThisItem.DG.Value)
                  Width: =218
                  X: =168
            - HomeRowArchives:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Text: =Text(CountRows(Filter(AVCentralDepositMediaItems, ParentRequest exactin ThisItem.RequestNumber)))
                  Width: =120
                  X: =413
            - HomeRowBadge:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =Self.BorderColor
                  DisplayMode: =DisplayMode.View
                  Fill: |-
                    =If("Approved" in ThisItem.Status.Value, Color.DarkGreen,
                       "Pending" in ThisItem.Status.Value, Color.Orange,
                       "Draft" in ThisItem.Status.Value, Color.Gray,
                       "Rejected" in ThisItem.Status.Value, Color.Red,
                       "Published" in ThisItem.Status.Value, Color.DarkOrchid,
                       Color.Gray)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =11
                  Text: =If(IsBlank(ThisItem.Status.Value), "Draft", Text(ThisItem.Status.Value))
                  Width: =150
                  X: =714
                  Y: =10
