                        - PlaceHolder Submit Button:
                            Control: TypedDataCard@1.0.7
                            Variant: BlankCard
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =124
                              Width: =341
                              WidthFit: =true
                              X: =0
                              Y: =23
                            Children:
                              - Button3:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    DisabledFill: =RGBA(237, 237, 237, 1)
                                    DisplayMode: |-
                                      =If(
                                          IsBlank(StartDatePicker.SelectedDate) ||
                                          IsBlank(EndDatePicker.SelectedDate) ||
                                          EndDatePicker.SelectedDate < StartDatePicker.SelectedDate ||
                                           !IsEmpty(
                                              Filter(
                                                  SuspensionDates,
                                                  Active,
                                                  StartDatePicker.SelectedDate <= EndBlockedDate,
                                                  EndDatePicker.SelectedDate >= StartBlockedDate
                                              )
                                          ),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Fill: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Lighter
                                    Height: =48
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: "=// Step 1: Refresh the suspension data from SharePoint\r\nRefresh(SuspensionDates);\r\n\r\n// Get Current Date (no Time)\r\nSet(CurrentDate, Today());\r\n\r\nSet(\r\n    MinStartDate,\r\n    If(\r\n        Switch(\r\n            Weekday(CurrentDate, StartOfWeek.Monday),\r\n            1, DateAdd(CurrentDate, 2),\r\n            2, DateAdd(CurrentDate, 2),\r\n            3, DateAdd(CurrentDate, 2),\r\n            4, DateAdd(CurrentDate, 2),\r\n            5, If(TimeValue(Text(Now(), \"hh:mm:ss\")) < TimeValue(\"17:00:00\"), DateAdd(CurrentDate, 2), DateAdd(CurrentDate, 4)),\r\n            6, DateAdd(CurrentDate, 3),\r\n            7, DateAdd(CurrentDate, 2)\r\n        ) <= DateValue(\"2025-06-03\"),\r\n        DateValue(\"2025-06-04\"),\r\n        Switch(\r\n            Weekday(CurrentDate, StartOfWeek.Monday),\r\n            1, DateAdd(CurrentDate, 2),\r\n            2, DateAdd(CurrentDate, 2),\r\n            3, DateAdd(CurrentDate, 2),\r\n            4, DateAdd(CurrentDate, 2),\r\n            5, If(TimeValue(Text(Now(), \"hh:mm:ss\")) < TimeValue(\"17:00:00\"), DateAdd(CurrentDate, 2), DateAdd(CurrentDate, 4)),\r\n            6, DateAdd(CurrentDate, 3),\r\n            7, DateAdd(CurrentDate, 2)\r\n        )\r\n    )\r\n);\r\n\r\n\r\nIf\r\n  (	\r\n	StartDatePicker.SelectedDate < MinStartDate \r\n    || 'Start Date Data Card'.Update >= 'End Date Data Card'.Update,\r\n\r\n    Notify(\"Please fix the errors\", NotificationType.Error),\r\n    \r\n    If(CoverageFormRequest.Valid \r\n        && (!(\"Other\" in varEventTypes.Value) || (\"Other\" in varEventTypes.Value && !IsBlank(Trim(OtherEventTypeInput.Text))))\r\n        && (!(\"Bilateral with other VIP/s\" in varEventTypes.Value) || (\"Bilateral with other VIP/s\" in varEventTypes.Value && !IsBlank(Trim(VIPNameFunctionInput.Text)))),\r\n        \r\n        Set(\r\n            varEventTypes,\r\n            ForAll(\r\n                varEventTypes,\r\n                Switch(\r\n                    Value,\r\n                    \"Other\", {Value: \"Other: \" & Trim(OtherEventTypeInput.Text)},\r\n                    \"Bilateral with other VIP/s\", {Value: \"VIP: \" & Trim(VIPNameFunctionInput.Text)},\r\n                    {Value: Value} // Default case\r\n                )\r\n            )\r\n        );\r\n\r\n    // Step 2: After refresh, check if the button is still in Edit mode (enabled)\r\nIf(\r\n    Button3.DisplayMode = DisplayMode.Edit,\r\n    SubmitForm(CoverageFormRequest),\r\n     // Button is disabled -> block submission and notify\r\n    Notify(\r\n        \"Your request cannot be submitted. The selected dates are no longer valid, possibly due to a recently added suspension period. Please refresh the app and try again.\",\r\n        NotificationType.Error,\r\n        8000\r\n    )\r\n);\r\n\r\n        Set(varCollegeMember, Blank());\r\n        Set(varEventTitle, Blank());\r\n        Set(varStartDate, Blank());\r\n        Set(varStartHour, Blank());\r\n        Set(varStartMinute, Blank());\r\n        Set(varEndDate, Blank());\r\n        Set(varEndHour, Blank());\r\n        Set(varEndMinute, Blank());\r\n        Set(varLocation, Blank());\r\n        Set(varAddress, Blank());\r\n        Set(varEventTypes, Blank());\r\n        Set(otherEventValue, Blank());\r\n        Set(VIPEventValue, Blank());\r\n        Set(varCoverageTypes, Blank());\r\n        Set(varPublicationType, Blank());\r\n        Set(varContacts, Blank());\r\n        Set(varComments, Blank());\r\n        Set(varSocialMediaContacts, Blank());\r\n        Set(varTravelWithCommissionerContacts, Blank());\r\n\r\n        Set(checkFileds, false);\r\n        Set(VideoCoverageSelected, false);\r\n        Set(OnlyBilateralOtherVIPSelected, false);\r\n        Set(varEventCoverageType, Blank());\r\n        Set(varWebstreamed, Blank());\r\n        Set(varWebstreamedOrganizer, Blank());\r\n        Reset(CoverageTypeRadio);\r\n        Reset(WebstreamedRadio);\r\n        Reset(WebstreamedOrganizerText);\r\n\r\n        Set(TypeofEventSelected, Blank());\r\n\r\n        Set(ResetCheckboxes, true);\r\n        Set(ResetCheckboxes, false);\r\n    \r\n        , \r\n\r\n        Set(checkFileds, true);\r\n        Notify( \"Please fill in all required fields \", NotificationType.Error);\r\n        \r\n    ); \r\n); \r\n"
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    Text: ="Submit your request"
                                    Width: =242
                                    X: =(Parent.Width - Self.Width) / 2
                                    Y: =28
