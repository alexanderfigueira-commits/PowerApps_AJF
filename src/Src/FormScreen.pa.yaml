s across a suspension period\r\n        !IsBlank(rangeOverlap) && !IsBlank(StartDatePicker.SelectedDate),\r\n        Notify(\r\n            \"⚠ Your selected range (\" &\r\n            Text(StartDatePicker.SelectedDate, \"[$-en-GB]dd/mm/yyyy\") & \" to \" &\r\n            Text(EndDatePicker.SelectedDate, \"[$-en-GB]dd/mm/yyyy\") &\r\n            \") overlaps with \" & rangeOverlap.Title & \" (\" &\r\n            Text(rangeOverlap.StartBlockedDate, \"[$-en-GB]dd/mm/yyyy\") & \" to \" &\r\n            Text(rangeOverlap.EndBlockedDate, \"[$-en-GB]dd/mm/yyyy\") & \"). \" &\r\n            \"Please adjust the dates.\",\r\n            NotificationType.Warning,\r\n            8000\r\n        )\r\n    )\r\n)"
