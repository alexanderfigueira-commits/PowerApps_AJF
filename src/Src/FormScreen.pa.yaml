Screens:
  FormScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =
        // Get Current Date (no Time)
        Set(
            CurrentDate,
            Today()
        );
        Set(
            MinStartDate,
            If(
                Switch(
                    Weekday(
                        CurrentDate,
                        StartOfWeek.Monday
                    ),
                    1,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    2,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    3,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    4,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    5,
                    If(
                        TimeValue(
                            Text(
                                Now(),
                                "hh:mm:ss"
                            )
                        ) < TimeValue("17:00:00"),
                        DateAdd(
                            CurrentDate,
                            2
                        ),
                        DateAdd(
                            CurrentDate,
                            4
                        )
                    ),
                    6,
                    DateAdd(
                        CurrentDate,
                        3
                    ),
                    7,
                    DateAdd(
                        CurrentDate,
                        2
                    )
                ) <= DateValue("2025-06-03"),
                DateValue("2025-06-04"),
                Switch(
                    Weekday(
                        CurrentDate,
                        StartOfWeek.Monday
                    ),
                    1,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    2,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    3,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    4,
                    DateAdd(
                        CurrentDate,
                        2
                    ),
                    5,
                    If(
                        TimeValue(
                            Text(
                                Now(),
                                "hh:mm:ss"
                            )
                        ) < TimeValue("17:00:00"),
                        DateAdd(
                            CurrentDate,
                            2
                        ),
                        DateAdd(
                            CurrentDate,
                            4
                        )
                    ),
                    6,
                    DateAdd(
                        CurrentDate,
                        3
                    ),
                    7,
                    DateAdd(
                        CurrentDate,
                        2
                    )
                )
            )
        );

        With(
            {
                suspension: First(
                    Sort(
                        Filter(
                            SuspensionDates,
                            Active,
                            EndBlockedDate >= Today()
                        ),
                        StartBlockedDate
                    )
                )
            },
            If(
                !IsBlank(suspension),
                Notify(
                    "Due to the " & suspension.Title &
                    " the online booking form for Coverage Request Belgium has been temporarily suspended. Power Apps will not process any requests between " &
                    Text(suspension.StartBlockedDate, "[$-en-GB]dd/mm/yyyy") &
                    " and " &
                    Text(suspension.EndBlockedDate, "[$-en-GB]dd/mm/yyyy") &
                    ". Please resubmit them through the system once it is operational again on " &
                    Text(DateAdd(suspension.EndBlockedDate, 1), "[$-en-GB]dddd dd/mm/yyyy") &
                    ".",
                    NotificationType.Warning,
                    8000
                )
            )
        );
