                              - Button1:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    DisplayMode: |+
                                      =If(
                                          !IsEmpty(Filter('Coverage Request (Belgium)', 'Created By'.Email = User().Email)),
                                          DisplayMode.Edit,
                                          DisplayMode.Disabled
                                      )
                                    Fill: =RGBA(0, 18, 107, 0.82)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Lighter
                                    Height: =48
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: "=// Step 1: Filter the user's submissions\r\nSet(\r\n    lastUserSubmissions,\r\n    Filter('Coverage Request (Belgium)', 'Created By'.Email = User().Email)\r\n);\r\n\r\n// Step 2: Find the highest ID among the user's submissions\r\nSet(\r\n    highestID,\r\n    Max(lastUserSubmissions, ID)\r\n);\r\n\r\n// Step 3: Filter by the highest ID to get the last submission\r\nSet(\r\n    lastSubmission,\r\n    LookUp(lastUserSubmissions, ID = highestID)\r\n);\r\n\r\n// Now `lastSubmission` contains the data of the last submitted request by the current user\r\n\r\n\r\n// Step 4: Update the Commissioner input field with the last submission's Commissioner value\r\nIf(\r\n    !IsBlank(lastSubmission),\r\n    \r\n    Set(ResetCheckboxes, true);\r\n    Set(ResetCheckboxes, false);\r\n\r\n    Set(varEventTypes, Blank());\r\n    Set(otherEventValue, Blank());\r\n    Set(VIPEventValue, Blank());\r\n\r\n    Set(VideoCoverageSelected, false);\r\n    Set(OnlyBilateralOtherVIPSelected, false);\r\n    Set(varEventCoverageType, Blank());\r\n    Set(varWebstreamed, Blank());\r\n    Set(varWebstreamedOrganizer, Blank());\r\n    Reset(CoverageTypeRadio);\r\n    Reset(WebstreamedRadio);\r\n    Reset(WebstreamedOrganizerText);\r\n\r\n    Set(varCarbonCopyContactsString, Blank());\r\n    Set(varCarbonCopyContactsArray, Blank());\r\n    Set(varCarbonCopyContactsFormattedArray, Table());\r\n    Reset(CarbonCopyContactComboBox);\r\n\r\n    ResetForm(CoverageFormRequest);\r\n    NewForm(CoverageFormRequest);\r\n\r\n    Set(varCollegeMember, lastSubmission.'College Member');\r\n    Set(varEventTitle, lastSubmission.'Event Title');\r\n\r\n    Set(varStartDateTime, lastSubmission.'Start Date and Time');\r\n    Set(varStartDate, DateValue(Text(varStartDateTime, \"mm-dd-yyyy\"), \"en-US\"));\r\n   // Set(varStartHour, Text(If(Mod(Hour(varStartDateTime),12) = 0, 12, Mod(Hour(varStartDateTime), 12)), \"[$-en-US]00\"));\r\n   // Set(varStartAMPM, If(Hour(varStartDateTime) <12, \"[$-en-US]AM\", \"PM\"));\r\n    Set(varStartHour, Text(Hour(varStartDateTime), \"[$-en-US]00\")); \r\n    Set(varStartMinute, Text(Minute(varStartDateTime), \"00\"));\r\n\r\n    Set(varEndDateTime, lastSubmission.'End Date and Time');\r\n    Set(varEndDate, DateValue(Text(varEndDateTime, \"mm-dd-yyyy\"), \"en-US\"));\r\n   // Set(varEndHour, Text(If(Mod(Hour(varEndDateTime),12) = 0, 12, Mod(Hour(varEndDateTime), 12)), \"[$-en-US]00\"));\r\n   // Set(varEndAMPM, If(Hour(varEndDateTime) <12, \"[$-en-US]AM\", \"PM\"));\r\n    Set(varEndHour, Text(Hour(varEndDateTime), \"[$-en-US]00\")); \r\n    Set(varEndMinute, Text(Minute(varEndDateTime), \"00\"));\r\n   \r\n\r\n    Set(varLocation, lastSubmission.Location);\r\n    Set(varAddress, lastSubmission.Address);\r\n    \r\n    Set(varEventTypes, lastSubmission.'Event Type');\r\n\r\n    Set(matchingOtherItem, First(Filter(varEventTypes, StartsWith(Value, \"Other: \"))));\r\n    If(!IsBlank(matchingOtherItem),\r\n        Set(otherEventValue, Mid(matchingOtherItem.Value, Len(\"Other :\") + 1, Len(matchingOtherItem.Value))),\r\n        Set(otherEventValue, \"\")\r\n    );\r\n\r\n    Set(matchingVIPItem, First(Filter(varEventTypes, StartsWith(Value, \"VIP: \"))));\r\n    If(!IsBlank(matchingVIPItem),\r\n        Set(VIPEventValue, Mid(matchingVIPItem.Value, Len(\"VIP:\") + 1, Len(matchingVIPItem.Value))),\r\n        Set(VIPEventValue, \"\")\r\n    );\r\n    \r\n    Set(\r\n    varEventTypes,\r\n        ForAll(\r\n            varEventTypes,\r\n            Switch(\r\n                true,\r\n                StartsWith(Value, \"Other: \"), {Value: \"Other\"},\r\n                StartsWith(Value, \"VIP: \"), {Value: \"Bilateral with other VIP/s\"},\r\n                {Value: Value} // Default case\r\n            )\r\n        )\r\n    );\r\n\r\n\r\n    Set(TypeofEventSelected, EventTypeDropdown.SelectedItems.Value);\r\n\r\n    Set(varCoverageTypes, lastSubmission.'Coverage Type');\r\n    If(\"Video Coverage\" in CoverageTypeDropdown.SelectedItems.Value, Set(VideoCoverageSelected, true));\r\n    If(\"Bilateral with other VIP/s\" in varEventTypes.Value && CountRows(varEventTypes) = 1, Set(OnlyBilateralOtherVIPSelected, true));\r\n    Set(varEventCoverageType, lastSubmission.'Event Coverage Type');\r\n    Set(varWebstreamed, lastSubmission.Webstreamed);\r\n    Set(varWebstreamedOrganizer, lastSubmission.'Webstreamed Organizer');\r\n\r\n    Set(varPublicationType, lastSubmission.'Publication Type');\r\n\r\n    Set(varContacts, lastSubmission.'Accreditation Info');\r\n    Set(varSocialMediaContacts, lastSubmission.'Media Receivers');\r\n    Set(varTravelWithCommissionerContacts, lastSubmission.'Accompanying the Commissioner');\r\n    Set(varCarbonCopyContactsString, lastSubmission.'Carbon Copy Contacts');\r\n    Set(varCarbonCopyContactsArray, Split(Trim(lastSubmission.'Carbon Copy Contacts'), \";\"));\r\n\r\n    Set(\r\n        varCarbonCopyContactsFormattedArray,\r\n        ForAll(\r\n            varCarbonCopyContactsArray,\r\n            {\r\n                DisplayName: ThisRecord.Value,\r\n                Mail: TrimEnds(ThisRecord.Value)\r\n            }\r\n        )\r\n    );\r\n\r\n    Set(varComments, lastSubmission.Comments);\r\n\r\n    Notify(\"The form has been filled with your last submission data \" \r\n           & \"[ID: \" & lastSubmission.ID & \"]  [Created on: \" & Text(lastSubmission.Created, \"dd/mm/yyyy hh:mm AM/PM\", \"en-GB\") & \"]\", \r\n        NotificationType.Success)\r\n\r\n)\r\n\r\n\r\n"
                                    PressedBorderColor: =Self.Fill
