      # Model release confirmation banner
      - ModelReleaseConfirmBg:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(134, 239, 172, 1)
            BorderThickness: =1
            Fill: =RGBA(240, 253, 244, 1)
            Height: =52
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Visible: =varModelRelease
            Width: =1302
            X: =32
            Y: =690
      - ModelReleaseConfirmCBIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(22, 163, 74, 1)
            Height: =24
            Icon: =Icon.Check
            Visible: =varModelRelease
            Width: =24
            X: =60
            Y: =704
      - ModelReleaseConfirmTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(22, 101, 52, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =13
            Text: ="Model release forms required — upload on Attachments tab will be mandatory"
            Visible: =varModelRelease
            Width: =900
            X: =96
            Y: =703
      # ── Bottom action bar ─────────────────────────────────────────────────
      - BottomBar3:
          Control: Rectangle@2.3.0
