            RadiusTopLeft: =6
            RadiusTopRight: =6
            Width: =1302
            X: =32
            Y: =578
      - RightsTransferCB:
          Control: Classic/Check@2.3.5
          Properties:
            BorderColor: =RGBA(156, 163, 175, 1)
            CheckmarkFill: =RGBA(37, 99, 235, 1)
            Default: =varRightsTransfer
            Height: =24
            OnCheck: =Set(varRightsTransfer, true)
            OnUncheck: =Set(varRightsTransfer, false)
