            Fill: =RGBA(255, 255, 255, 1)
            Height: =20
            OnSelect: =Set(varContractCase, "Case2")
            Width: =20
            X: =60
            Y: =312
      - Case2RadioInner:
          Control: Circle@2.3.0
          Properties:
            Fill: =RGBA(37, 99, 235, 1)
            Height: =10
            OnSelect: =Set(varContractCase, "Case2")
            Visible: =varContractCase = "Case2"
            Width: =10
            X: =65
            Y: =317
      - Case2Title:
          Control: Label@2.5.1
          Properties:
            Color: =If(varContractCase = "Case2", RGBA(37, 99, 235, 1), RGBA(17, 24, 39, 1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            OnSelect: =Set(varContractCase, "Case2")
            Size: =13
            Text: ="Case 2 — direct service contract"
            Width: =900
            X: =94
            Y: =294
      - Case2Sub:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(37, 99, 235, 1)
            Font: =Font.'Open Sans'
            Height: =22
            OnSelect: =Set(varContractCase, "Case2")
            Size: =12
            Text: ="Contract reference number is required (see below)"
            Visible: =varContractCase = "Case2"
            Width: =900
            X: =94
            Y: =322
      # Cases 3–6 collapsed row
      - Cases36Card:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Fill: =RGBA(249, 250, 251, 1)
            Height: =48
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Width: =1302
            X: =32
            Y: =362
      - Cases36Label:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =48
            Size: =13
            Text: ="Cases 3 to 6 (collapsed — click to expand)"
            VerticalAlign: =VerticalAlign.Middle
            Width: =600
            X: =56
            Y: =362
      - Cases36Chevron:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(107, 114, 128, 1)
            Height: =24
            Icon: =Icon.ChevronDown
            Width: =24
            X: =1294
            Y: =374
      # ── Contract reference number ─────────────────────────────────────────
      - LblContractRef:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =13
            Text: ="Contract reference number *"
            Width: =480
            X: =32
            Y: =424
      - TxtContractRef:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =If(IsBlank(Self.Text) And varContractCase = "Case2", RGBA(239, 68, 68, 1), RGBA(209, 213, 219, 1))
            Default: =varContractRef
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="e.g. COMM-2026-PHOTO-0142"
            OnChange: =Set(varContractRef, Self.Text)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Width: =480
            X: =32
            Y: =452
      - LblContractRefHint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: ="Required when Case 2 is selected"
            Visible: =varContractCase = "Case2" And IsBlank(varContractRef)
            Width: =480
            X: =32
            Y: =496
      # ── Section divider ───────────────────────────────────────────────────
      - Divider3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(229, 231, 235, 1)
            Height: =1
            Width: =1302
            X: =32
            Y: =524
      # ── Rights transfer section ───────────────────────────────────────────
      - LblRightsSection:
          Control: Label@2.5.1
