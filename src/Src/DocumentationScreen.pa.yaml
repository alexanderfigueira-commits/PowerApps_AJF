            Color: =RGBA(17, 24, 39, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =32
            Size: =18
            Text: ="Rights & model release"
            Width: =800
            X: =32
            Y: =538
