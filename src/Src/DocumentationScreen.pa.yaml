          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
