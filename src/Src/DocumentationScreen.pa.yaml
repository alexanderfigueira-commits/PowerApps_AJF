Screens:
  DocumentationScreen:
    Properties:
      Fill: =RGBA(249, 250, 251, 1)
      OnVisible: |-
        =Set(varContractCase, "");
        Set(varContractRef, "");
        Set(varModelRelease, false)
    Children:
      # ── Navigation bar ───────────────────────────────────────────────────
      - NavBar3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(15, 15, 15, 1)
            Height: =48
            Width: =1366
            X: =0
            Y: =0
      - NavBack3:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(200, 200, 200, 1)
            Height: =24
            HoverColor: =RGBA(255, 255, 255, 1)
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(MediaInfoScreen)
            Width: =24
            X: =16
            Y: =12
      - NavBreadcrumb3:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Height: =48
            Size: =13
            Text: ="My requests  /  " & If(IsBlank(varProjectName), "New request", varProjectName)
            VerticalAlign: =VerticalAlign.Middle
            Width: =420
            X: =44
            Y: =0
      - NavDraftRect3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(243, 244, 246, 1)
            Height: =24
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =48
            X: =1302
            Y: =12
      - NavDraftLabel3:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(75, 85, 99, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: ="Draft"
            VerticalAlign: =VerticalAlign.Middle
            Width: =48
            X: =1302
            Y: =12
      # ── Step tabs — 1 ✓, 2 ✓, 3 active ─────────────────────────────────
      - StepTabsBg3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            Width: =1366
            X: =0
            Y: =48
      - Tab1Done3:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =48
            OnSelect: =Navigate(NewRequestScreen)
            Size: =13
            Text: ="✓  1. Info"
            VerticalAlign: =VerticalAlign.Middle
            Width: =130
            X: =16
            Y: =48
      - Tab2Done3:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =48
            OnSelect: =Navigate(MediaInfoScreen)
            Size: =13
            Text: ="✓  2. Media information"
            VerticalAlign: =VerticalAlign.Middle
            Width: =196
            X: =162
            Y: =48
      - Tab3ActiveLine3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(37, 99, 235, 1)
            Height: =3
            Width: =172
            X: =374
            Y: =93
      - Tab3Label3:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(37, 99, 235, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =48
            Size: =13
            Text: ="3. Documentation"
            VerticalAlign: =VerticalAlign.Middle
            Width: =172
            X: =374
            Y: =48
      - Tab4Label3:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =48
            Size: =13
            Text: ="4. Attachments"
            VerticalAlign: =VerticalAlign.Middle
            Width: =160
            X: =562
            Y: =48
