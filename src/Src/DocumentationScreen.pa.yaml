      - InfoBannerBg3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(147, 197, 253, 1)
            BorderThickness: =1
            Fill: =RGBA(239, 246, 255, 1)
            Height: =52
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
