            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverFill: =RGBA(243, 244, 246, 1)
            OnSelect: =Navigate(MediaInfoScreen)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =13
            Text: ="←  Previous"
            Width: =120
            X: =32
            Y: =724
      - BtnSaveDraft3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(209, 213, 219, 1)
            BorderThickness: =1
            Color: =RGBA(55, 65, 81, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverFill: =RGBA(243, 244, 246, 1)
            OnSelect: =Notify("Draft saved", NotificationType.Success)
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =13
            Text: ="Save draft"
            Width: =112
            X: =160
            Y: =724
      - BtnNextAttachments:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(37, 99, 235, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =36
