            Width: =1230
            X: =90
            Y: =112
      # ── Contract case section ─────────────────────────────────────────────
      - LblContractCaseSection:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =32
            Size: =18
            Text: ="Contract case"
            Width: =800
            X: =32
            Y: =178
      # Case 1
      - Case1Card:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =If(varContractCase = "Case1", RGBA(37, 99, 235, 1), RGBA(229, 231, 235, 1))
            BorderThickness: =If(varContractCase = "Case1", 2, 1)
            Fill: =If(varContractCase = "Case1", RGBA(239, 246, 255, 1), RGBA(255, 255, 255, 1))
            Height: =64
            OnSelect: =Set(varContractCase, "Case1")
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Width: =1302
            X: =32
            Y: =218
      - Case1RadioOuter:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =If(varContractCase = "Case1", RGBA(37, 99, 235, 1), RGBA(156, 163, 175, 1))
            BorderThickness: =2
            Fill: =RGBA(255, 255, 255, 1)
            Height: =20
            OnSelect: =Set(varContractCase, "Case1")
            Width: =20
            X: =60
            Y: =240
      - Case1RadioInner:
          Control: Circle@2.3.0
          Properties:
            Fill: =RGBA(37, 99, 235, 1)
            Height: =10
            OnSelect: =Set(varContractCase, "Case1")
            Visible: =varContractCase = "Case1"
            Width: =10
            X: =65
            Y: =245
      - Case1Title:
          Control: Label@2.5.1
          Properties:
            Color: =If(varContractCase = "Case1", RGBA(37, 99, 235, 1), RGBA(17, 24, 39, 1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =26
            OnSelect: =Set(varContractCase, "Case1")
            Size: =13
            Text: ="Case 1 — direct or framework service contract"
            Width: =900
            X: =94
            Y: =222
      - Case1Sub:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =22
            OnSelect: =Set(varContractCase, "Case1")
            Size: =12
            Text: ="Tick the relevant sub-types (framework, specific, offer)"
            Width: =900
            X: =94
            Y: =250
      # Case 2
      - Case2Card:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =If(varContractCase = "Case2", RGBA(37, 99, 235, 1), RGBA(229, 231, 235, 1))
            BorderThickness: =If(varContractCase = "Case2", 2, 1)
