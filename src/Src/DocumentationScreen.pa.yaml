            Y: =590
      - RightsTransferLabel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            Font: =Font.'Open Sans'
            Height: =48
            Size: =13
            Text: ="A rights transfer agreement or licence has been signed for this production"
            VerticalAlign: =VerticalAlign.Middle
            Width: =900
            X: =96
            Y: =578
      # Model release checkbox
      - ModelReleaseCard:
