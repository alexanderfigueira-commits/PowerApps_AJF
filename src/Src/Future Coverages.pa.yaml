Screens:
  Future Coverages:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =
        ClearCollect(
            AllRecords,
            FirstN(
                SortByColumns('Coverage Request (Belgium)', "Created", SortOrder.Descending),
                2000
            )
        );


        ClearCollect(
            FilterOptions,
            {Name: "Future Coverage", FilterFunction: "Future"},
            {Name: "Last 2 Months Submissions", FilterFunction: "Last2Months"},
            {Name: "Both", FilterFunction: "Both"},
            {Name: "none", FilterFunction: "none"}
        );

        If(
            CountRows(FutureCoveragesGallery.AllItems) > 0,
            Select(FutureCoveragesGallery,1)
        );
    Children:
      - Rectangle4:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(149, 149, 149, 1)
            BorderThickness: =2
            Fill: =RGBA(0, 0, 0, 0)
            Height: =608
            Width: =343
            X: =98
            Y: =125
      - FutureCoveragesGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(9, 33, 98, 0.65)
            BorderThickness: =2
            Fill: =RGBA(237, 237, 237, 0.78)
            Height: =605
            Items: |-
              =SortByColumns(
                  Filter(
                      AllRecords,
                      'Created By'.Email = User().Email && (DropdownFilterByStatus.Selected.Value = "All Status" || Status.Value = DropdownFilterByStatus.SelectedText.Value) &&
                       Switch(
                          LookUp(FilterOptions, Name = DropdownFilterByCoverageSubmission.Selected.Name).FilterFunction,
                          "Future", 'Start Date and Time' >= Today(),
                          "Last2Months", Created > DateAdd(Today(), -60),
                          "Both", 'Start Date and Time' >= Today() || Created > DateAdd(Today(), -60),
                          "none", true,
                          true  // Default to true to show all items if no filter is selected
                       )
                  ),
                  Text(DropdownSortOrderByDate.Selected.FilterColumn), 
                  DropdownSortOrderBy.Selected.Value
              )


              /*
              SortByColumns(
                  Filter(
                      'Coverage Request (Belgium)', 
                      'Created By'.Email = User().Email && ('Start Date and Time' >= Today() || Created > DateAdd(Today(), -60))
                  ), 
                  Text(DropdownSortOrderByDate.Selected.FilterColumn), 
