App:
  Properties:
    BackEnabled: =false
    OnStart: |-
      =// Initialize Office 365 connectivity
      Set(Office365Connected, true);

      // Check Office 365 profile access and update the Office365Connected variable
      IfError(
          Set(MyProfile, Office365Users.MyProfile()),
          Set(Office365Connected, false)
      );

      // Initialize filter and wizard state
      Set(varFilter, "All");
      Set(varCurrentStep, 1);

      // Initialize form fields
      Set(varMediaType, "");
      Set(varDGRequesting, "");
      Set(varProjectName, "");
      Set(varContractCase, "");
      Set(varContractRef, "");
      Set(varModelRelease, false);
      Set(varShowMediaWarning, false);
      Set(varSelectedRequest, Blank());

      Navigate(HomeScreen)
    Theme: =PowerAppsTheme
