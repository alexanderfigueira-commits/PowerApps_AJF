Screens:
  SuspensionScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =// Get Current Date (no Time)
        Set(CurrentDate, Today()); 

        Set(
            MinStartDate,
            If(
                Switch(
                    Weekday(CurrentDate, StartOfWeek.Monday),
                    1, DateAdd(CurrentDate, 2),
                    2, DateAdd(CurrentDate, 2),
                    3, DateAdd(CurrentDate, 2),
                    4, DateAdd(CurrentDate, 2),
                    5, If(TimeValue(Text(Now(), "hh:mm:ss")) < TimeValue("17:00:00"), DateAdd(CurrentDate, 2), DateAdd(CurrentDate, 4)),
                    6, DateAdd(CurrentDate, 3),
                    7, DateAdd(CurrentDate, 2)
                ) <= DateValue("2025-06-03"),
                DateValue("2025-06-04"),
                Switch(
                    Weekday(CurrentDate, StartOfWeek.Monday),
                    1, DateAdd(CurrentDate, 2),
                    2, DateAdd(CurrentDate, 2),
                    3, DateAdd(CurrentDate, 2),
                    4, DateAdd(CurrentDate, 2),
                    5, If(TimeValue(Text(Now(), "hh:mm:ss")) < TimeValue("17:00:00"), DateAdd(CurrentDate, 2), DateAdd(CurrentDate, 4)),
                    6, DateAdd(CurrentDate, 3),
                    7, DateAdd(CurrentDate, 2)
                )
            )
        );
    Children:
      - ScreenContainer1_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - HeaderContainer1_3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =125
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - Logo_EC_Form_3:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =125
                        Image: ='logo--en'
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
