ChildInfoScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)

    CI_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =52
        Width: =1366
        X: =0
        Y: =0
        ZIndex: =1

    CI_Back As button:
        BorderThickness: =0
        Color: =RGBA(186, 202, 226, 1)
        Fill: =RGBA(0, 18, 107, 1)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(ProjectScreen)
        Size: =13
        Text: ="←  Back to project"
        Width: =180
        X: =16
        Y: =10
        ZIndex: =2

    CI_Breadcrumb As label:
        Color: =RGBA(186, 202, 226, 1)
        Height: =52
        Size: =13
        Text: =" /  " & Coalesce(varParentTitle, "Project") & "  /  " & If(IsBlank(varChildTitle) Or varChildTitle = "", "New archive", varChildTitle)
        VerticalAlign: =VerticalAlign.Middle
        Width: =700
        X: =200
        Y: =0
        ZIndex: =3

    CI_TabsBg As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =50
        Width: =1366
        X: =0
        Y: =52
        ZIndex: =4

    CI_Tab1 As button:
        BorderThickness: =0
        Color: =RGBA(0, 18, 107, 1)
        Fill: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        HoverFill: =RGBA(255, 255, 255, 1)
        Size: =13
        Text: ="1.  Info"
        Width: =150
        X: =16
        Y: =52
        ZIndex: =5

    CI_Tab1Line As rectangle:
        Fill: =RGBA(56, 96, 178, 1)
        Height: =3
        Width: =150
        X: =16
        Y: =99
        ZIndex: =6

    CI_Tab2 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildMetaScreen)
        Size: =13
        Text: ="2.  Metadata"
        Width: =170
        X: =176
        Y: =52
        ZIndex: =7

    CI_Tab3 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildLegalScreen)
        Size: =13
        Text: ="3.  Legal & Docs"
        Width: =180
        X: =356
        Y: =52
        ZIndex: =8

    CI_Tab4 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildValidScreen)
        Size: =13
        Text: ="4.  Validations"
        Width: =170
        X: =546
        Y: =52
        ZIndex: =9

    CI_Card As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =560
        Width: =1302
        X: =32
        Y: =118
        ZIndex: =10

    CI_SectionHeader As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =18
        Text: ="Archive identification"
        Width: =840
        X: =56
        Y: =138
        ZIndex: =11

    CI_LblMediaType As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =28
        Size: =15
        Text: ="Production type *"
        Width: =840
        X: =56
        Y: =178
        ZIndex: =12

    CI_MediaHint As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =20
        Size: =12
        Text: ="Select the type of media for this archive. This drives conditional fields throughout the form."
        Width: =900
        X: =56
        Y: =206
        ZIndex: =13

    CI_CardPhoto As button:
        BorderColor: =If(varChildMediaType="Photo", RGBA(56,96,178,1), RGBA(220,224,230,1))
        BorderThickness: =If(varChildMediaType="Photo", 2, 1)
        Color: =If(varChildMediaType="Photo", RGBA(0,18,107,1), RGBA(60,66,80,1))
        Fill: =If(varChildMediaType="Photo", RGBA(230,236,245,1), RGBA(255,255,255,1))
        FontWeight: =FontWeight.Semibold
        Height: =72
        HoverFill: =RGBA(240, 242, 246, 1)
        OnSelect: =Set(varChildMediaType, "Photo")
        Size: =14
        Text: ="📷  Photo"
        Width: =200
        X: =56
        Y: =236
        ZIndex: =14

    CI_CardVideo As button:
        BorderColor: =If(varChildMediaType="Video", RGBA(56,96,178,1), RGBA(220,224,230,1))
        BorderThickness: =If(varChildMediaType="Video", 2, 1)
        Color: =If(varChildMediaType="Video", RGBA(0,18,107,1), RGBA(60,66,80,1))
        Fill: =If(varChildMediaType="Video", RGBA(230,236,245,1), RGBA(255,255,255,1))
        FontWeight: =FontWeight.Semibold
        Height: =72
        HoverFill: =RGBA(240, 242, 246, 1)
        OnSelect: =Set(varChildMediaType, "Video")
        Size: =14
        Text: ="🎬  Video"
        Width: =200
        X: =268
        Y: =236
        ZIndex: =15

    CI_CardAudio As button:
        BorderColor: =If(varChildMediaType="Audio", RGBA(56,96,178,1), RGBA(220,224,230,1))
        BorderThickness: =If(varChildMediaType="Audio", 2, 1)
        Color: =If(varChildMediaType="Audio", RGBA(0,18,107,1), RGBA(60,66,80,1))
        Fill: =If(varChildMediaType="Audio", RGBA(230,236,245,1), RGBA(255,255,255,1))
        FontWeight: =FontWeight.Semibold
        Height: =72
        HoverFill: =RGBA(240, 242, 246, 1)
        OnSelect: =Set(varChildMediaType, "Audio")
        Size: =14
        Text: ="🎙  Audio"
        Width: =200
        X: =480
        Y: =236
        ZIndex: =16

    CI_CardPodcast As button:
        BorderColor: =If(varChildMediaType="Podcast", RGBA(56,96,178,1), RGBA(220,224,230,1))
        BorderThickness: =If(varChildMediaType="Podcast", 2, 1)
        Color: =If(varChildMediaType="Podcast", RGBA(0,18,107,1), RGBA(60,66,80,1))
        Fill: =If(varChildMediaType="Podcast", RGBA(230,236,245,1), RGBA(255,255,255,1))
        FontWeight: =FontWeight.Semibold
        Height: =72
        HoverFill: =RGBA(240, 242, 246, 1)
        OnSelect: =Set(varChildMediaType, "Podcast")
        Size: =14
        Text: ="🎧  Podcast"
        Width: =200
        X: =692
        Y: =236
        ZIndex: =17

    CI_LblTitle As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =22
        Size: =13
        Text: ="Archive / production title *"
        Width: =800
        X: =56
        Y: =326
        ZIndex: =18

    CI_Title As text:
        Default: =varChildTitle
        HintText: ="Descriptive name of this specific archive item"
        Height: =40
        OnChange: =Set(varChildTitle, Self.Value)
        Width: =900
        X: =56
        Y: =352
        ZIndex: =19

    CI_LblCaptureDate As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =22
        Size: =13
        Text: ="Capture / production date *"
        Width: =300
        X: =56
        Y: =406
        ZIndex: =20

    CI_CaptureDate As datepicker:
        DefaultDate: =varChildCaptureDate
        Height: =40
        OnChange: =Set(varChildCaptureDate, Self.SelectedDate)
        Width: =300
        X: =56
        Y: =432
        ZIndex: =21

    CI_LblPlace As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =22
        Size: =13
        Text: ="Production place"
        Width: =300
        X: =388
        Y: =406
        ZIndex: =22

    CI_Place As text:
        Default: =varChildProductionPlace
        HintText: ="City, country or venue"
        Height: =40
        OnChange: =Set(varChildProductionPlace, Self.Value)
        Width: =300
        X: =388
        Y: =432
        ZIndex: =23

    CI_LblEpisode As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =22
        Size: =13
        Text: ="Episode title"
        Visible: =varChildMediaType = "Audio" Or varChildMediaType = "Podcast"
        Width: =400
        X: =56
        Y: =488
        ZIndex: =24

    CI_EpisodeTitle As text:
        Default: =varChildEpisodeTitle
        HintText: ="Episode or segment title"
        Height: =40
        OnChange: =Set(varChildEpisodeTitle, Self.Value)
        Visible: =varChildMediaType = "Audio" Or varChildMediaType = "Podcast"
        Width: =400
        X: =56
        Y: =514
        ZIndex: =25

    CI_LblEpisodeSummary As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =22
        Size: =13
        Text: ="Episode summary"
        Visible: =varChildMediaType = "Audio" Or varChildMediaType = "Podcast"
        Width: =500
        X: =480
        Y: =488
        ZIndex: =26

    CI_EpisodeSummary As text:
        Default: =varChildEpisodeSummary
        HintText: ="Short summary for this episode"
        Height: =40
        OnChange: =Set(varChildEpisodeSummary, Self.Value)
        Visible: =varChildMediaType = "Audio" Or varChildMediaType = "Podcast"
        Width: =500
        X: =480
        Y: =514
        ZIndex: =27

    CI_BottomBar As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =56
        Width: =1366
        X: =0
        Y: =712
        ZIndex: =28

    CI_BtnSave As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(60, 66, 80, 1)
        Fill: =RGBA(255, 255, 255, 1)
        Height: =40
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: |-
            =// Save Info tab fields to the child record
            Patch(CentralDepositMainList,
                LookUp(CentralDepositMainList, ID = varCurrentChild.ID),
                {
                    Project: If(IsBlank(varChildTitle) Or varChildTitle = "", "New archive", varChildTitle),
                    MediaType: {Value: varChildMediaType},
                    CaptureDate: varChildCaptureDate,
                    ProductionPlace: varChildProductionPlace,
                    EpisodeTitle: varChildEpisodeTitle,
                    EpisodeSummary: varChildEpisodeSummary
                }
            );
            Notify("Info saved.", NotificationType.Success)
        Size: =13
        Text: ="Save"
        Width: =100
        X: =32
        Y: =720
        ZIndex: =29

    CI_BtnNext As button:
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =40
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =// Auto-save before moving to next tab
            Patch(CentralDepositMainList,
                LookUp(CentralDepositMainList, ID = varCurrentChild.ID),
                {
                    Project: If(IsBlank(varChildTitle) Or varChildTitle = "", "New archive", varChildTitle),
                    MediaType: {Value: varChildMediaType},
                    CaptureDate: varChildCaptureDate,
                    ProductionPlace: varChildProductionPlace,
                    EpisodeTitle: varChildEpisodeTitle,
                    EpisodeSummary: varChildEpisodeSummary
                }
            );
            Navigate(ChildMetaScreen)
        Size: =14
        Text: ="Next: Metadata  →"
        Width: =200
        X: =1142
        Y: =720
        ZIndex: =30
