                    Project: If(IsBlank(varChildTitle) Or varChildTitle = "", "New archive", varChildTitle),
                    MediaType: {Value: varChildMediaType},
                    Description: varChildDescription,
                    CaptureDate: varChildCaptureDate,
                    ProductionPlace: varChildProductionPlace,
                    ProductType: If(varChildMediaType = "Video", varChildProductType, ""),
                    SeriesTitle: If(varChildMediaType = "Podcast", varChildSeriesTitle, ""),
                    EpisodeTitle: If(varChildMediaType = "Podcast", varChildEpisodeTitle, ""),
                    EpisodeSummary: If(varChildMediaType = "Podcast", varChildEpisodeSummary, ""),
                    SeasonNumber: If(varChildMediaType = "Podcast", varChildSeasonNumber, 0),
                    EpisodeNumber: If(varChildMediaType = "Podcast", varChildEpisodeNumber, 0),
                    PublicationEndDate: If(varChildMediaType = "Video" Or varChildMediaType = "Podcast", varChildProductionEndDate, Blank()),
