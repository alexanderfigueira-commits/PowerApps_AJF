    PS_BtnSubmitProject As button:
        Color: =RGBA(255, 255, 255, 1)
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: |-
            =If(
                Not(IsBlank(varCurrentProject)) And varCurrentProject.ID > 0
                And CountRows(PS_ChildrenGallery.AllItems) > 0,
                DisplayMode.Edit,
                DisplayMode.Disabled
            )
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =40
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =Set(varCurrentProject,
                Patch(AVCentralDepositProjects,
                    LookUp(AVCentralDepositProjects, ID = varCurrentProject.ID),
                    { Status: {Value: "Submitted"} }
                )
            );
            Notify("Project submitted successfully.", NotificationType.Success);
            Navigate(HomeScreen)
        Size: =14
        Text: ="Submit project  →"
        Width: =200
        X: =1142
        Y: =720
        ZIndex: =30
