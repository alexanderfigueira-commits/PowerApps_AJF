    "PS_ChildrenGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Height: =276
        Items: |-
            =If(
                IsBlank(varCurrentProject) Or varCurrentProject.ID = 0,
                Filter(CentralDepositMainList, 1 = 2),
                Sort(
                    Filter(CentralDepositMainList, ParentProject.Id = varCurrentProject.ID),
                    Modified, SortOrder.Descending
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =56
        Visible: =Not(IsBlank(varCurrentProject)) And varCurrentProject.ID > 0
        Width: =1302
        X: =32
        Y: =416
        ZIndex: =26

        PS_CRowSelect As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =55
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =// Load existing child data into vars then open the child form
                Set(varCurrentChild, ThisItem);
                Set(varChildTitle, If(IsBlank(ThisItem.Project) Or ThisItem.Project = "New archive", "", ThisItem.Project));
                Set(varChildMediaType, If(IsBlank(ThisItem.MediaType.Value), "Photo", ThisItem.MediaType.Value));
                Set(varChildDescription, Coalesce(ThisItem.Description, ""));
                Set(varChildCaptureDate, ThisItem.CaptureDate);
                Set(varChildProductionPlace, Coalesce(ThisItem.ProductionPlace, ""));
                Set(varChildCredits, Coalesce(ThisItem.Photographer, ThisItem.Director, ThisItem.Producer, ""));
                Set(varChildLanguageVersions, Coalesce(ThisItem.LanguageVersions.Value, ""));
                Set(varChildAIVoiceover, Coalesce(ThisItem.AIVoiceover, false));
                Set(varChildContractCase, Coalesce(ThisItem.ContractCase.Value, ""));
                Set(varChildContractRef, Coalesce(ThisItem.ContractReference, ""));
                Set(varChildModelRelease, false);
                Set(varChildModelReleaseProvided, false);
                Set(varChildMusicUsed, Coalesce(ThisItem.MusicUsed, false));
                Set(varChildMusicLicenceProvided, Coalesce(ThisItem.MusicLicenseProvided, false));
                Set(varChildPreexisting, false);
                Set(varChildPreexistingProvided, Coalesce(ThisItem.PreexistingRightsProvided, false));
                Set(varChildEpisodeTitle, Coalesce(ThisItem.EpisodeTitle, ""));
                Set(varChildEpisodeSummary, Coalesce(ThisItem.EpisodeSummary, ""));
                Navigate(ChildInfoScreen)
            Width: =1302
            ZIndex: =1

        PS_CRowDivider As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =1302
            Y: =55
            ZIndex: =2

        PS_CRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =55
            OnSelect: =Select(Parent)
            Text: =If(IsBlank(ThisItem.Project) Or ThisItem.Project = "New archive", "— untitled archive —", ThisItem.Project)
            Width: =420
            X: =24
            ZIndex: =3

        PS_CRowType As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =55
            OnSelect: =Select(Parent)
            Text: =If(IsBlank(ThisItem.MediaType.Value), "—", ThisItem.MediaType.Value)
            Width: =160
            X: =468
            ZIndex: =4

        PS_CRowValid As label:
            Color: |-
                =// Quick validation: check the three most critical fields
                If(
                    Not(IsBlank(ThisItem.Project)) And ThisItem.Project <> "New archive"
                    And Not(IsBlank(ThisItem.MediaType.Value))
                    And Not(IsBlank(ThisItem.ContractCase.Value)),
                    RGBA(22, 128, 80, 1),
                    RGBA(193, 40, 40, 1)
                )
            Height: =55
            OnSelect: =Select(Parent)
            Text: |-
                =If(
                    Not(IsBlank(ThisItem.Project)) And ThisItem.Project <> "New archive"
                    And Not(IsBlank(ThisItem.MediaType.Value))
                    And Not(IsBlank(ThisItem.ContractCase.Value)),
                    "✓  Ready",
                    "⚠  Incomplete"
                )
            Width: =200
            X: =648
            ZIndex: =5

        PS_CRowBadge As button:
            BorderThickness: =0
            Color: |-
                =Switch(ThisItem.DepositStatus.Value,
                    "Approved", RGBA(22, 128, 80, 1),
                    "Submitted", RGBA(56, 96, 178, 1),
                    "Pending Approval", RGBA(180, 95, 6, 1),
                    "New", RGBA(56, 96, 178, 1),
                    "Rejected", RGBA(193, 40, 40, 1),
                    RGBA(96, 104, 120, 1))
            DisabledBorderColor: =Self.BorderColor
            DisplayMode: =DisplayMode.View
            Fill: |-
                =Switch(ThisItem.DepositStatus.Value,
                    "Approved", RGBA(223, 245, 233, 1),
                    "Submitted", RGBA(230, 236, 245, 1),
                    "Pending Approval", RGBA(255, 247, 230, 1),
                    "New", RGBA(230, 236, 245, 1),
                    "Rejected", RGBA(253, 235, 235, 1),
                    RGBA(240, 242, 246, 1))
            Size: =11
            Text: =If(IsBlank(ThisItem.DepositStatus.Value), "New", ThisItem.DepositStatus.Value)
            Width: =140
            X: =852
            Y: =14
            ZIndex: =6

        PS_CRowDelete As button:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(193, 40, 40, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =32
            HoverFill: =RGBA(253, 235, 235, 1)
            OnSelect: |-
                =Remove(CentralDepositMainList, ThisItem);
                Refresh(CentralDepositMainList)
            Size: =11
            Text: ="Remove"
            Width: =90
            X: =1178
            Y: =12
            ZIndex: =7

