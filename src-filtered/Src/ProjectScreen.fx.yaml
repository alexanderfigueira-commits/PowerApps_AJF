    PS_BtnSaveProject As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(60, 66, 80, 1)
        DisabledColor: =RGBA(186, 196, 214, 1)
        DisabledFill: =RGBA(240, 242, 246, 1)
        DisplayMode: =If(IsBlank(varParentTitle) Or varParentTitle = "", DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =RGBA(255, 255, 255, 1)
        Height: =36
        HoverFill: =RGBA(230, 236, 245, 1)
        OnSelect: |-
            =Set(varCurrentProject,
                Patch(AVCentralDepositProjects,
                    If(
                        IsBlank(varCurrentProject) Or varCurrentProject.ID = 0,
                        Defaults(AVCentralDepositProjects),
                        LookUp(AVCentralDepositProjects, ID = varCurrentProject.ID)
                    ),
                    {
                        Title: varParentTitle,
                        DG: varParentDG,
                        OwnerContact: varParentOwnerContact,
                        OwnerEmail: varParentOwnerEmail,
                        FTPPath: varParentFTPPath,
                        Status: If(IsBlank(varCurrentProject) Or varCurrentProject.ID = 0, {Value: "Draft"}, varCurrentProject.Status)
                    }
                )
            );
            If(IsError(varCurrentProject),
                Notify("Error saving project. Please try again.", NotificationType.Error),
                Notify("Project saved.", NotificationType.Success)
            )
        Size: =13
        Text: =If(IsBlank(varCurrentProject) Or varCurrentProject.ID = 0, "Save project", "Update project")
        Width: =160
        X: =56
        Y: =280
        ZIndex: =17

    PS_ArchivesSection As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =32
        Size: =16
        Text: ="Archives  (" & If(IsBlank(varCurrentProject) Or varCurrentProject.ID = 0, "0", Text(CountRows(PS_ChildrenGallery.AllItems))) & ")"
        Width: =600
        X: =32
        Y: =330
        ZIndex: =18

    PS_BtnAddArchive As button:
        Color: =RGBA(255, 255, 255, 1)
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: =If(IsBlank(varParentTitle) Or varParentTitle = "", DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =36
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =// Step 1: ensure the parent project is saved (has a real ID)
            If(
                IsBlank(varCurrentProject) Or varCurrentProject.ID = 0,
                Set(varCurrentProject,
                    Patch(AVCentralDepositProjects, Defaults(AVCentralDepositProjects),
                        {
                            Title: varParentTitle,
                            DG: varParentDG,
                            OwnerContact: varParentOwnerContact,
                            OwnerEmail: varParentOwnerEmail,
                            FTPPath: varParentFTPPath,
                            Status: {Value: "Draft"}
                        }
                    )
                )
            );
            // Step 2: if parent save succeeded, create the child stub and navigate
            If(
                Not(IsBlank(varCurrentProject)) And varCurrentProject.ID > 0,
                // Reset child vars
                Set(varCurrentChild, Blank());
                Set(varChildTitle, ""); Set(varChildMediaType, "Photo");
                Set(varChildDescription, ""); Set(varChildCaptureDate, Blank());
                Set(varChildProductionPlace, ""); Set(varChildCredits, "");
                Set(varChildLanguageVersions, ""); Set(varChildAIVoiceover, false);
                Set(varChildContractCase, Blank()); Set(varChildContractCase1Sub, Blank());
                Set(varChildContractRef, ""); Set(varChildModelRelease, false);
                Set(varChildModelReleaseProvided, false); Set(varChildMusicUsed, false);
                Set(varChildMusicLicenceProvided, false); Set(varChildPreexisting, false);
                Set(varChildPreexistingProvided, false);
                Set(varChildEpisodeTitle, ""); Set(varChildEpisodeSummary, "");
                Set(varChildSeasonNumber, 0); Set(varChildEpisodeNumber, 0);
                // Create child stub record so it gets an ID (required for SP Attachments)
                Set(varCurrentChild,
                    Patch(CentralDepositMainList, Defaults(CentralDepositMainList),
                        {
                            Project: "New archive",
                            ParentProject: {Id: varCurrentProject.ID, Value: varCurrentProject.Title},
                            DepositStatus: {Value: "New"},
                            MediaType: {Value: "Photo"}
                        }
                    )
                );
                If(IsError(varCurrentChild),
                    Notify("Error creating archive. Please try again.", NotificationType.Error),
                    Navigate(ChildInfoScreen)
                ),
                Notify("Could not save project. Check required fields.", NotificationType.Error)
            )
        Size: =13
        Text: ="+  Add archive"
        Width: =160
        X: =1160
        Y: =330
        ZIndex: =19

