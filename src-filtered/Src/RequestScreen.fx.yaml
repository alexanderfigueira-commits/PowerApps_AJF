    RS_BtnSubmitRequest As button:
        Color: =RGBA(255, 255, 255, 1)
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: |-
            =If(
                Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
                And CountRows(colArchives) > 0
                And CountIf(colArchives,
                    IsBlank(Title) Or Title = "" Or Title = "New archive"
                    Or IsBlank(MediaType) Or MediaType = ""
                    Or IsBlank(ContractCase) Or ContractCase = ""
                    Or Coalesce(AIVoiceover, false)
                ) = 0,
                DisplayMode.Edit,
                DisplayMode.Disabled
            )
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =40
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =Set(varCurrentRequest,
                Patch(AVCentralDepositProjects,
                    LookUp(AVCentralDepositProjects, ID = varCurrentRequest.ID),
                    {
                        Title: varRequestTitle,
                        DG: varRequestDG,
                        OwnerContact: varRequestOwnerContact,
                        OwnerEmail: varRequestOwnerEmail,
                        Description: varRequestDescription,
                        Status: {Value: "Submitted"}
                    }
                )
            );
            If(IsError(varCurrentRequest),
                Notify("Error submitting request. Please try again.", NotificationType.Error),
                ForAll(colArchives,
                    If(
                        Coalesce(SPId, 0) > 0,
                        Patch(CentralDepositMainList, LookUp(CentralDepositMainList, ID = SPId),
                            {
                                Project: Title,
                                MediaType: {Value: MediaType},
                                Description: Description,
                                CaptureDate: CaptureDate,
                                ProductionPlace: ProductionPlace,
                                ProductType: If(MediaType = "Video", ProductType, ""),
                                SeriesTitle: If(MediaType = "Podcast", SeriesTitle, ""),
                                EpisodeTitle: If(MediaType = "Podcast", EpisodeTitle, ""),
                                EpisodeSummary: If(MediaType = "Podcast", EpisodeSummary, ""),
                                SeasonNumber: If(MediaType = "Podcast", SeasonNumber, 0),
                                EpisodeNumber: If(MediaType = "Podcast", EpisodeNumber, 0),
                                PublicationEndDate: If(MediaType = "Video" Or MediaType = "Podcast", ProductionEndDate, Blank()),
                                PublicationStartDate: PublicationStartDate,
                                ProductionEndDate: PublicationEndDate,
                                ReferenceLinks: ReferenceLinks,
                                Tags: Tags,
                                FTPPath: FTPPath,
                                LanguageVersions: {Value: LanguageVersions},
                                Photographer: If(MediaType = "Photo", Credits, ""),
                                Director: If(MediaType = "Video", Credits, ""),
                                Producer: If(MediaType = "Podcast", Credits, ""),
                                AIVoiceover: AIVoiceover,
                                ContractCase: {Value: ContractCase},
                                ContractReference: ContractRef,
                                MusicUsed: MusicUsed,
                                MusicLicenseProvided: MusicLicenceProvided,
                                PreexistingRightsProvided: PreexistingProvided,
                                DepositStatus: {Value: "Pending Approval"}
                            }
                        ),
                        Patch(CentralDepositMainList, Defaults(CentralDepositMainList),
                            {
                                Project: Title,
                                MediaType: {Value: MediaType},
                                Description: Description,
                                CaptureDate: CaptureDate,
                                ProductionPlace: ProductionPlace,
                                ProductType: If(MediaType = "Video", ProductType, ""),
                                SeriesTitle: If(MediaType = "Podcast", SeriesTitle, ""),
                                EpisodeTitle: If(MediaType = "Podcast", EpisodeTitle, ""),
                                EpisodeSummary: If(MediaType = "Podcast", EpisodeSummary, ""),
                                SeasonNumber: If(MediaType = "Podcast", SeasonNumber, 0),
                                EpisodeNumber: If(MediaType = "Podcast", EpisodeNumber, 0),
                                PublicationEndDate: If(MediaType = "Video" Or MediaType = "Podcast", ProductionEndDate, Blank()),
                                PublicationStartDate: PublicationStartDate,
                                ProductionEndDate: PublicationEndDate,
                                ReferenceLinks: ReferenceLinks,
                                Tags: Tags,
                                FTPPath: FTPPath,
                                LanguageVersions: {Value: LanguageVersions},
                                Photographer: If(MediaType = "Photo", Credits, ""),
                                Director: If(MediaType = "Video", Credits, ""),
                                Producer: If(MediaType = "Podcast", Credits, ""),
                                AIVoiceover: AIVoiceover,
                                ContractCase: {Value: ContractCase},
                                ContractReference: ContractRef,
                                MusicUsed: MusicUsed,
                                MusicLicenseProvided: MusicLicenceProvided,
                                PreexistingRightsProvided: PreexistingProvided,
                                DepositStatus: {Value: "Pending Approval"},
                                ParentProject: {Id: varCurrentRequest.ID, Value: varCurrentRequest.Title}
                            }
                        )
                    )
                );
                Clear(colArchives);
                Notify("Request submitted successfully.", NotificationType.Success);
                Navigate(HomeScreen)
            )
        Size: =14
        Text: ="Submit request  →"
        Visible: |-
            =Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
            And (IsBlank(varCurrentRequest.Status.Value) Or varCurrentRequest.Status.Value = "Draft")
        Width: =200
        X: =1142
        Y: =946
        ZIndex: =33

    RS_BtnResubmitRequest As button:
        Color: =RGBA(255, 255, 255, 1)
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: |-
            =If(
                CountRows(colArchives) > 0
                And CountIf(colArchives,
                    IsBlank(Title) Or Title = "" Or Title = "New archive"
                    Or IsBlank(MediaType) Or MediaType = ""
                    Or IsBlank(ContractCase) Or ContractCase = ""
                    Or Coalesce(AIVoiceover, false)
                ) = 0,
                DisplayMode.Edit,
                DisplayMode.Disabled
            )
        Fill: =RGBA(180, 95, 6, 1)
        FontWeight: =FontWeight.Semibold
        Height: =40
        HoverFill: =RGBA(120, 60, 0, 1)
        OnSelect: |-
            =Set(varCurrentRequest,
                Patch(AVCentralDepositProjects,
                    LookUp(AVCentralDepositProjects, ID = varCurrentRequest.ID),
                    {
                        Title: varRequestTitle,
                        DG: varRequestDG,
                        OwnerContact: varRequestOwnerContact,
                        OwnerEmail: varRequestOwnerEmail,
                        Description: varRequestDescription,
                        Status: {Value: "Submitted"}
                    }
                )
            );
            If(IsError(varCurrentRequest),
                Notify("Error resubmitting request. Please try again.", NotificationType.Error),
                ForAll(colArchives,
                    If(
                        Coalesce(SPId, 0) > 0,
                        Patch(CentralDepositMainList, LookUp(CentralDepositMainList, ID = SPId),
                            {
                                Project: Title,
                                MediaType: {Value: MediaType},
                                Description: Description,
                                CaptureDate: CaptureDate,
                                ProductionPlace: ProductionPlace,
                                LanguageVersions: {Value: LanguageVersions},
                                Photographer: If(MediaType = "Photo", Credits, ""),
                                Director: If(MediaType = "Video", Credits, ""),
                                Producer: If(MediaType = "Podcast", Credits, ""),
                                AIVoiceover: AIVoiceover,
                                ContractCase: {Value: ContractCase},
                                ContractReference: ContractRef,
                                MusicUsed: MusicUsed,
                                MusicLicenseProvided: MusicLicenceProvided,
                                PreexistingRightsProvided: PreexistingProvided,
                                DepositStatus: {Value: "Pending Approval"}
                            }
                        ),
                        Patch(CentralDepositMainList, Defaults(CentralDepositMainList),
                            {
                                Project: Title,
                                MediaType: {Value: MediaType},
                                Description: Description,
                                CaptureDate: CaptureDate,
                                ProductionPlace: ProductionPlace,
                                LanguageVersions: {Value: LanguageVersions},
                                Photographer: If(MediaType = "Photo", Credits, ""),
                                Director: If(MediaType = "Video", Credits, ""),
                                Producer: If(MediaType = "Podcast", Credits, ""),
                                AIVoiceover: AIVoiceover,
                                ContractCase: {Value: ContractCase},
                                ContractReference: ContractRef,
                                MusicUsed: MusicUsed,
                                MusicLicenseProvided: MusicLicenceProvided,
                                PreexistingRightsProvided: PreexistingProvided,
                                DepositStatus: {Value: "Pending Approval"},
                                ParentProject: {Id: varCurrentRequest.ID, Value: varCurrentRequest.Title}
                            }
                        )
                    )
                );
                Clear(colArchives);
                Notify("Request resubmitted for review.", NotificationType.Success);
                Navigate(HomeScreen)
            )
        Size: =14
        Text: ="Resubmit for review  →"
        Visible: |-
            =Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
            And varCurrentRequest.Status.Value = "Rejected"
        Width: =220
        X: =1122
        Y: =946
        ZIndex: =34
