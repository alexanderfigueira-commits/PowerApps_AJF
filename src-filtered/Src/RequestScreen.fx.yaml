    RS_BtnSaveRequest As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(60, 66, 80, 1)
        DisabledColor: =RGBA(186, 196, 214, 1)
        DisabledFill: =RGBA(240, 242, 246, 1)
        DisplayMode: =If(IsBlank(varRequestTitle) Or varRequestTitle = "", DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =RGBA(255, 255, 255, 1)
        Height: =36
        HoverFill: =RGBA(230, 236, 245, 1)
        OnSelect: |-
            =Set(varCurrentRequest,
                Patch(AVCentralDepositProjects,
                    If(
                        IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0,
                        Defaults(AVCentralDepositProjects),
                        LookUp(AVCentralDepositProjects, ID = varCurrentRequest.ID)
                    ),
                    {
                        Title: varRequestTitle,
                        DG: varRequestDG,
                        OwnerContact: varRequestOwnerContact,
                        OwnerEmail: varRequestOwnerEmail,
                        Description: varRequestDescription,
                        StartRequestDate: varRequestStartDate,
                        EndRequestDate: varRequestEndDate,
                        Status: If(IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0, {Value: "Draft"}, varCurrentRequest.Status)
                    }
                )
            );
            If(IsError(varCurrentRequest),
                Notify("Error saving request. Please try again.", NotificationType.Error),
                Notify("Request saved.", NotificationType.Success)
            )
        Size: =13
        Text: =If(IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0, "Save request", "Update request")
        Width: =160
        X: =56
        Y: =490
        ZIndex: =24

    RS_ArchivesSection As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =32
        Size: =16
        Text: ="Archives  (" & If(IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0, "0", Text(CountRows(RS_ChildrenGallery.AllItems))) & ")"
        Width: =600
        X: =32
        Y: =572
        ZIndex: =25

    RS_BtnAddArchive As button:
        Color: =RGBA(255, 255, 255, 1)
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: =If(IsBlank(varRequestTitle) Or varRequestTitle = "", DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =36
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =If(
                IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0,
                Set(varCurrentRequest,
                    Patch(AVCentralDepositProjects, Defaults(AVCentralDepositProjects),
                        {
                            Title: varRequestTitle,
                            DG: varRequestDG,
                            OwnerContact: varRequestOwnerContact,
                            OwnerEmail: varRequestOwnerEmail,
                            Description: varRequestDescription,
                            StartRequestDate: varRequestStartDate,
                            EndRequestDate: varRequestEndDate,
                            Status: {Value: "Draft"}
                        }
                    )
                )
            );
            If(
                Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0,
                Set(varCurrentChild, Blank());
                Set(varChildTitle, ""); Set(varChildMediaType, "Photo");
                Set(varChildDescription, ""); Set(varChildCaptureDate, Blank());
                Set(varChildProductionPlace, ""); Set(varChildCredits, "");
                Set(varChildLanguageVersions, ""); Set(varChildAIVoiceover, false);
                Set(varChildContractCase, Blank()); Set(varChildContractCase1Sub, Blank());
                Set(varChildContractRef, ""); Set(varChildModelRelease, false);
                Set(varChildModelReleaseProvided, false); Set(varChildMusicUsed, false);
                Set(varChildMusicLicenceProvided, false); Set(varChildPreexisting, false);
                Set(varChildPreexistingProvided, false);
                Set(varChildEpisodeTitle, ""); Set(varChildEpisodeSummary, "");
                Set(varChildSeasonNumber, 0); Set(varChildEpisodeNumber, 0);
                Set(varChildFTPPath, "");
                Set(varCurrentChild,
                    Patch(CentralDepositMainList, Defaults(CentralDepositMainList),
                        {
                            Project: "New archive",
                            ParentProject: {Id: varCurrentRequest.ID, Value: varCurrentRequest.Title},
                            DepositStatus: {Value: "New"},
                            MediaType: {Value: "Photo"}
                        }
                    )
                );
                If(IsError(varCurrentChild),
                    Notify("Error creating archive. Please try again.", NotificationType.Error),
                    Navigate(ChildInfoScreen)
                ),
                Notify("Could not save request. Check required fields.", NotificationType.Error)
            )
        Size: =13
        Text: ="+  Add archive"
        Width: =160
        X: =1160
        Y: =572
        ZIndex: =26

