RequestScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =If(
            Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0,
            Refresh(CentralDepositMainList)
        )

    RS_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =52
        Width: =1366
        X: =0
        Y: =0
        ZIndex: =1

    RS_Back As button:
        BorderThickness: =0
        Color: =RGBA(186, 202, 226, 1)
        Fill: =RGBA(0, 18, 107, 1)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(HomeScreen)
        Size: =13
        Text: ="←  My requests"
        Width: =160
        X: =16
        Y: =10
        ZIndex: =2

    RS_Breadcrumb As label:
        Color: =RGBA(186, 202, 226, 1)
        Height: =52
        Size: =13
        Text: =" /  " & If(IsBlank(varRequestTitle) Or varRequestTitle = "", "New request", varRequestTitle)
