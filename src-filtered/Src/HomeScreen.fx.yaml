    "HomeGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Height: =358
        Items: |-
            =// DG and Project-name both use StartsWith on text columns — fully delegable against SharePoint.
            // Status chip uses equality on a Choice field — delegable.
            // 'Created By'.Email restricts to the signed-in user's own projects — delegable.
            Filter(
                AVCentralDepositProjects,
                'Created By'.Email = User().Email,
                varFilter = "All" Or Status.Value = varFilter,
                varFilterDG = "" Or IsBlank(varFilterDG) Or StartsWith(DG, varFilterDG),
                varFilterProject = "" Or IsBlank(varFilterProject) Or StartsWith(Title, varFilterProject)
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =60
        Width: =1270
        X: =48
        Y: =340
        ZIndex: =20

        HomeRowSelect As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =59
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varCurrentProject, ThisItem);
                Set(varParentTitle, ThisItem.Title);
                Set(varParentDG, ThisItem.DG);
                Set(varParentFTPPath, ThisItem.FTPPath);
                Set(varParentOwnerContact, ThisItem.OwnerContact);
                Set(varParentOwnerEmail, ThisItem.OwnerEmail);
                Navigate(ProjectScreen)
            Width: =1270
            ZIndex: =1

        HomeRowDivider As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =1270
            Y: =59
            ZIndex: =2

        HomeRowProject As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =59
            OnSelect: =Select(Parent)
            Text: =If(IsBlank(ThisItem.Title), "Untitled project", ThisItem.Title)
            Width: =500
            X: =20
            ZIndex: =3

        HomeRowDG As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =59
            OnSelect: =Select(Parent)
            Text: =If(IsBlank(ThisItem.DG), "—", ThisItem.DG)
            Width: =200
            X: =542
            ZIndex: =4

        HomeRowArchives As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =59
            OnSelect: =Select(Parent)
            Text: =Text(CountRows(Filter(CentralDepositMainList, ParentProject.Id = ThisItem.ID)))
            Width: =140
            X: =762
            ZIndex: =5

        HomeRowBadge As button:
            BorderThickness: =0
            Color: |-
                =Switch(ThisItem.Status.Value,
                    "Approved", RGBA(22, 128, 80, 1),
                    "Submitted", RGBA(56, 96, 178, 1),
                    "In review", RGBA(180, 95, 6, 1),
                    "Draft", RGBA(96, 104, 120, 1),
                    "Returned", RGBA(193, 40, 40, 1),
                    RGBA(96, 104, 120, 1))
            DisabledBorderColor: =Self.BorderColor
            DisplayMode: =DisplayMode.View
            Fill: |-
                =Switch(ThisItem.Status.Value,
                    "Approved", RGBA(223, 245, 233, 1),
                    "Submitted", RGBA(230, 236, 245, 1),
                    "In review", RGBA(255, 247, 230, 1),
                    "Draft", RGBA(240, 242, 246, 1),
                    "Returned", RGBA(253, 235, 235, 1),
                    RGBA(240, 242, 246, 1))
            Size: =11
            Text: =If(IsBlank(ThisItem.Status.Value), "Draft", ThisItem.Status.Value)
            Width: =150
            X: =982
            Y: =16
            ZIndex: =6

