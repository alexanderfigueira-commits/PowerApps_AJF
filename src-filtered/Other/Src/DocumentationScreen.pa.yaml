Screens:
  DocumentationScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - DC_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =52
            Width: =1366
      - DC_Back:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(186, 202, 226, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: =Navigate(HomeScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="←  My requests"
            X: =16
            Y: =10
      - DC_Breadcrumb:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =52
            Text: =" /  " & If(IsBlank(varProjectName), "New request", varProjectName)
            Width: =500
            X: =184
      - DC_TabsBg:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =50
            Width: =1366
            Y: =52
      - DC_Tab1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(NewRequestScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  1.  Info"
            Width: =150
            X: =16
            Y: =52
      - DC_Tab2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(MediaInfoScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  2.  Metadata"
            Width: =170
            X: =176
            Y: =52
      - DC_Tab3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(0, 18, 107, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="3.  Legal docs"
            X: =356
            Y: =52
      - DC_Tab3Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =3
            Width: =160
            X: =356
            Y: =99
      - DC_Tab4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(AttachmentsScreen2)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="4.  Attachments"
            Width: =170
            X: =526
            Y: =52
      - DC_Banner:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(147, 197, 253, 1)
            BorderThickness: =1
            Fill: =RGBA(239, 246, 255, 1)
            Height: =48
            Width: =1286
            X: =32
            Y: =116
      - DC_BannerText:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(30, 64, 175, 1)
            Font: =Font.'Open Sans'
            Height: =48
            Text: ="Select the contract case that matches how this production was produced, then complete the mandatory legal checklist below."
            Width: =1240
            X: =56
            Y: =116
      - DC_LblCase:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =18
            Text: ="Contract case"
            Width: =600
            X: =32
            Y: =178
      - DC_Case:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: |-
              =[
                  "Case 1 - direct or framework service contract",
                  "Case 2 - direct service contract",
                  "Case 3 - co-production agreement",
                  "Case 4 - acquisition of existing material",
                  "Case 5 - internal EU production",
                  "Case 6 - donation / free licence"
              ]
            Items.Value: =Value
            OnChange: =Set(varContractCase, Self.Selected.Value)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Width: =1286
            X: =32
            Y: =212
      - DC_LblRef:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="Contract reference number *"
            Visible: =Not(IsBlank(varContractCase))
            Width: =500
            X: =32
            Y: =270
      - DC_Ref:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =varContractRef
            Font: =Font.'Open Sans'
            HintText: ="e.g. COMM-2026-PHOTO-0142"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            OnChange: =Set(varContractRef, Self.Value)
            Visible: =Not(IsBlank(varContractCase))
            Width: =500
            X: =32
            Y: =296
      - DC_Divider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =1286
            X: =32
            Y: =356
      - DC_LblRights:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =18
            Text: ="Rights & mandatory documents"
            Width: =600
            X: =32
            Y: =370
      - DC_ChkModel:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(0, 18, 107, 1)
            OnCheck: =Set(varModelRelease, true)
            OnUncheck: =Set(varModelRelease, false)
            Text: ="Recognisable persons appear — model release forms required"
            Width: =900
            X: =28
            Y: =406
      - DC_ChkMusic:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(0, 18, 107, 1)
            OnCheck: =Set(varMusicLicence, true)
            OnUncheck: =Set(varMusicLicence, false)
            Text: ="Production contains music — licensing documentation required"
            Width: =900
            X: =28
            Y: =446
      - DC_ChkPreexisting:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(0, 18, 107, 1)
            OnCheck: =Set(varPreexisting, true)
            OnUncheck: =Set(varPreexisting, false)
            Text: ="Contains pre-existing rights material — annex(es) required"
            Width: =900
            X: =28
            Y: =486
      - DC_ChecklistCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(250, 251, 252, 1)
            Height: =150
            Width: =1286
            X: =32
            Y: =534
      - DC_ChecklistTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: ="MANDATORY LEGAL DOCUMENTS CHECKLIST"
            Width: =800
            X: =56
            Y: =546
      - DC_Check1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(IsBlank(varContractCase)), "✓", "○") & "  Signed contract / agreement (" & Coalesce(varContractCase, "select a case") & ")"
            Width: =1200
            X: =56
            Y: =574
      - DC_Check2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(varModelRelease), "✓  Model release — not required", "○  Model release forms — required, upload on Attachments")
            Width: =1200
            X: =56
            Y: =602
      - DC_Check3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(varMusicLicence), "✓  Music licence — not required", "○  Music licensing document — required, upload on Attachments")
            Width: =1200
            X: =56
            Y: =630
      - DC_Check4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(varPreexisting), "✓  Pre-existing rights — none declared", "○  Pre-existing rights annex(es) — required, upload on Attachments")
            Width: =1200
            X: =56
            Y: =658
      - DC_BottomBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =56
            Width: =1366
            Y: =712
      - DC_BtnPrev:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(60, 66, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(MediaInfoScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="←  Previous"
            Width: =140
            X: =32
            Y: =720
      - DC_BtnNext:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: =Navigate(AttachmentsScreen2)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: |-
              ="Next: Attachments  →"
            Width: =200
            X: =1142
            Y: =720
      - Label12_5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(149, 149, 149, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =11
            Text: |-
              ="Audiovisual Service - DG COMM
              This site is managed by the Directorate-General for Communication"
            Width: =691
            X: =265
            Y: =717
