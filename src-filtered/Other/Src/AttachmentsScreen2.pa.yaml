Screens:
  AttachmentsScreen2:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - AT_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =52
            Width: =1366
      - AT_Back:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(186, 202, 226, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: =Navigate(HomeScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="←  My requests"
            X: =16
            Y: =10
      - AT_Breadcrumb:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =52
            Text: =" /  " & If(IsBlank(varProjectName), "New request", varProjectName)
            Width: =500
            X: =184
      - AT_TabsBg:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =50
            Width: =1366
            Y: =52
      - AT_Tab1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(NewRequestScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  1.  Info"
            Width: =150
            X: =16
            Y: =52
      - AT_Tab2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(MediaInfoScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  2.  Metadata"
            Width: =170
            X: =176
            Y: =52
      - AT_Tab3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(DocumentationScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  3.  Legal docs"
            X: =356
            Y: =52
      - AT_Tab4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(0, 18, 107, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="4.  Attachments"
            Width: =170
            X: =526
            Y: =52
      - AT_Tab4Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =3
            Width: =170
            X: =526
            Y: =99
      - AT_Title:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =30
            Size: =18
            Text: ="Attachments & annexes"
            Width: =800
            X: =32
            Y: =122
      - AT_Sub:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Text: ="Master media are delivered by FTP (recorded on the Metadata tab). Attach legal annexes and small documents here."
            Width: =1000
            X: =32
            Y: =152
      - AT_AnnexLbl:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="Legal annexes & supporting documents"
            Width: =800
            X: =32
            Y: =190
      - AT_Annex:
          Control: Attachments@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Font: =Font.'Open Sans'
            Height: =180
            HoverFill: =RGBA(186, 202, 226, 1)
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =RGBA(56, 96, 178, 1)
            ItemHoverFill: =RGBA(186, 202, 226, 1)
            Items: =[]
            MaxAttachments: =20
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            Width: =1286
            X: =32
            Y: =216
      - AT_ChecklistCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(250, 251, 252, 1)
            Height: =184
            Width: =1286
            X: =32
            Y: =410
      - AT_ChecklistTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Size: =12
            Text: ="SUBMISSION CHECKLIST"
            Width: =800
            X: =56
            Y: =422
      - AT_Chk1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(Not(IsBlank(varProjectName)), RGBA(22,128,80,1), RGBA(193,40,40,1))
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(IsBlank(varProjectName)), "✓  Project title provided", "✗  Project title missing (Info tab)")
            Width: =600
            X: =56
            Y: =450
      - AT_Chk2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(Not(IsBlank(varContact)), RGBA(22,128,80,1), RGBA(193,40,40,1))
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(IsBlank(varContact)), "✓  Point of contact provided", "✗  Point of contact missing (Info tab)")
            Width: =600
            X: =56
            Y: =478
      - AT_Chk3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(Not(IsBlank(varFTPPath)), RGBA(22,128,80,1), RGBA(193,40,40,1))
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(IsBlank(varFTPPath)), "✓  FTP delivery path provided", "✗  FTP delivery path missing (Metadata tab)")
            Width: =600
            X: =56
            Y: =506
      - AT_Chk4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(Not(IsBlank(varContractCase)), RGBA(22,128,80,1), RGBA(193,40,40,1))
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(IsBlank(varContractCase)), "✓  Contract case selected", "✗  Contract case not selected (Legal docs tab)")
            Width: =600
            X: =640
            Y: =450
      - AT_Chk5:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(Not(varModelRelease) Or CountRows(AT_Annex.Attachments) > 0, RGBA(22,128,80,1), RGBA(193,40,40,1))
            Font: =Font.'Open Sans'
            Height: =26
            Text: =If(Not(varModelRelease), "✓  Model release — not required", If(CountRows(AT_Annex.Attachments) > 0, "✓  Model release annex attached", "✗  Model release forms required (attach above)"))
            Width: =620
            X: =640
            Y: =478
      - AT_WorkflowLbl:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: |-
              ="On submit, a ticket is created and a unique reference is returned. Lifecycle: New → Pending Approval → Accepted / Rejected →  Published"
            Width: =1286
            X: =32
            Y: =608
      - AT_BottomBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =56
            Width: =1366
            Y: =712
      - AT_BtnPrev:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(60, 66, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(DocumentationScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="←  Previous"
            Width: =140
            X: =32
            Y: =720
      - AT_MissingNote:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(193, 40, 40, 1)
            Font: =Font.'Open Sans'
            Size: =12
            Text: =If((Not(IsBlank(varProjectName)) And Not(IsBlank(varContact)) And Not(IsBlank(varFTPPath)) And Not(IsBlank(varContractCase))), "", "Complete the required fields to submit")
            Width: =360
            X: =770
            Y: =720
      - AT_BtnSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: =If((Not(IsBlank(varProjectName)) And Not(IsBlank(varContact)) And Not(IsBlank(varFTPPath)) And Not(IsBlank(varContractCase))), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: |-
              =Set(varNewTicket,
                  Patch(CentralDepositMainList,
                      Defaults(CentralDepositMainList)'),
                      { Project: If(IsBlank(varProjectName), "Untitled request", varProjectName) }
                  )
              );
              // TODO: extend the Patch with the new columns once added to the SharePoint list:
              // PointOfContact: varContact, ContactEmail: varContactEmail, MediaType: {Value: varMediaType},
              // FTPPath: varFTPPath, ContractCase: {Value: varContractCase}, ContractRef: varContractRef,
              // AIVoiceover: varAIVoiceover, MusicLicence: varMusicLicence, PreexistingRights: varPreexisting
              Set(varTicketRef, "CD-" & Text(Year(Now())) & "-" & Text(varNewTicket.ID));
              Navigate(ConfirmationScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: =If((Not(IsBlank(varProjectName)) And Not(IsBlank(varContact)) And Not(IsBlank(varFTPPath)) And Not(IsBlank(varContractCase))), "Submit request", "Submit request (incomplete)")
            Width: =240
            X: =1100
            Y: =720
      - Label12_6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(149, 149, 149, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =11
            Text: |-
              ="Audiovisual Service - DG COMM
              This site is managed by the Directorate-General for Communication"
            Width: =691
            X: =265
            Y: =717
