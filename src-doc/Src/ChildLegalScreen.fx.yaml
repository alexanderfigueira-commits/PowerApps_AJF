ChildLegalScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)

    Header_CL As group:
        Height: =5
        minimumHeight: =5
        minimumWidth: =5
        Visible: =true
        Width: =5
        X: =8
        Y: =20
        ZIndex: =1

        HomeAppTitle_CL As label:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =35
            Size: =18
            Text: ="Central Deposit"
            VerticalAlign: =VerticalAlign.Bottom
            Width: =213
            X: =81
            Y: =5
            ZIndex: =10

        HomeUserName_CL As label:
            Color: =RGBA(186, 202, 226, 1)
            Height: =28
            Text: =User().FullName
            Width: =204
            X: =1103
            Y: =18
            ZIndex: =11

        Logo_EC_CL As image:
            Height: =57
            Image: ='logo--en'
            PaddingLeft: =15
            Width: =218
            X: =564
            ZIndex: =12

        CD_Logo_CL As image:
            Height: =47
            Image: =cd_badge_play
            Width: =44
            X: =25
            Y: =6
            ZIndex: =13

        HomeAppSubtitle_CL As label:
            Color: =RGBA(186, 202, 226, 1)
            Height: =25
            Size: =10
            Text: ="Ticket System"
            VerticalAlign: =VerticalAlign.Top
            Width: =149
            X: =111
            Y: =28
            ZIndex: =14

        Image1_CL As image:
            Height: =56
            Image: =User().Image
            RadiusBottomLeft: =3
            RadiusBottomRight: =3
            RadiusTopLeft: =3
            RadiusTopRight: =3
            Tooltip: |-
                =Office365Users.MyProfile().JobTitle & " " & User().FullName & Char(13) &
                Office365Users.MyProfile().MailNickname & " | " &Office365Users.MyProfile().Department
            Width: =61
            X: =1299
            ZIndex: =19

    CL_Breadcrumb As label:
        Color: =RGBA(186, 202, 226, 1)
        Height: =56
        Text: =" /  " & Coalesce(varRequestTitle, "Request") & "  /  " & If(IsBlank(varChildTitle) Or varChildTitle = "", "New archive", varChildTitle)
        Width: =700
        X: =200
        ZIndex: =2

    CL_TabsBg As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =50
        Width: =1366
        Y: =52
        ZIndex: =3

    CL_Tab1 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildInfoScreen)
        Size: =13
        Text: ="✓  1.  Info"
        Width: =150
        X: =16
        Y: =52
        ZIndex: =4

    CL_Tab2 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildMetaScreen)
        Size: =13
        Text: ="✓  2.  Metadata"
        Width: =170
        X: =176
        Y: =52
        ZIndex: =5

    CL_Tab3 As button:
        BorderThickness: =0
        Color: =RGBA(0, 18, 107, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(255, 255, 255, 1)
        Size: =13
        Text: ="3.  Legal & Docs"
        Width: =180
        X: =356
        Y: =52
        ZIndex: =6

    CL_Tab3Line As rectangle:
        Height: =3
        Width: =180
        X: =356
        Y: =99
        ZIndex: =7

    CL_Tab4 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildValidScreen)
        Size: =13
        Text: ="4.  Validations"
        Width: =170
        X: =546
        Y: =52
        ZIndex: =8

    CL_BtnNext As button:
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(ChildValidScreen)
        Size: =14
        Text: |-
            ="Next: Validations  →"
        Width: =220
        X: =1110
        Y: =720
        ZIndex: =9

    CL_Gallery As gallery:
        Fill: =RGBA(247, 248, 250, 1)
        Height: =666
        Items: |-
            =[{id: 1}]
        Layout: =Layout.Vertical
        TemplatePadding: =0
        TemplateSize: =If(varChildMediaType = "Video", 960, 335)
        Width: =1366
        Y: =102
        ZIndex: =15

        CL_Banner As rectangle:
            BorderColor: =RGBA(147, 197, 253, 1)
            BorderThickness: =1
            Fill: =RGBA(239, 246, 255, 1)
            Height: =40
            Width: =1302
            X: =32
            Y: =6
            ZIndex: =1

        CL_BannerText As label:
            Color: =RGBA(30, 64, 175, 1)
            Text: ="Select the contract case for this media, confirm rights flags and upload required legal documents below."
            Width: =1260
            X: =52
            Y: =6
            ZIndex: =2

        CL_LblCase As label:
            Color: =RGBA(0, 18, 107, 1)
            FontWeight: =FontWeight.Bold
            Height: =28
            Size: =16
            Text: ="Contract case *"
            Width: =600
            X: =32
            Y: =58
            ZIndex: =3

        CL_Case As dropdown:
            Default: =varChildContractCase
            Height: =44
            Items: |-
                =[
                    "Case 1 - framework / direct service contract",
                    "Case 2 - specific service contract",
                    "Case 3 - co-production agreement",
                    "Case 4 - acquisition of existing material",
                    "Case 5 - internal EU production",
                    "Case 6 - donation / free licence"
                ]
            OnChange: =Set(varChildContractCase, Self.Selected.Value)
            Width: =900
            X: =32
            Y: =90
            ZIndex: =4

        CL_LblCase1Sub As label:
            Color: =RGBA(60, 66, 80, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="Case 1 sub-type *"
            Visible: =Left(varChildContractCase, 6) = "Case 1"
            Width: =400
            X: =32
            Y: =148
            ZIndex: =5

        CL_Case1Sub As dropdown:
            Default: =varChildContractCase1Sub
            Items: =["Framework contract", "Specific contract", "Offer / quote"]
            OnChange: =Set(varChildContractCase1Sub, Self.Selected.Value)
            Visible: =Left(varChildContractCase, 6) = "Case 1"
            Width: =400
            X: =32
            Y: =174
            ZIndex: =6

        CL_LblRef As label:
            Color: =RGBA(60, 66, 80, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="Contract reference number *"
            Visible: =Left(varChildContractCase, 6) = "Case 1" Or Left(varChildContractCase, 6) = "Case 2" Or Left(varChildContractCase, 6) = "Case 3"
            Width: =500
            X: =500
            Y: =148
            ZIndex: =7

        CL_Ref As text:
            Default: =varChildContractRef1
            HintText: ="e.g. COMM-2026-PHOTO-0142"
            OnChange: =Set(varChildContractRef1, Self.Text)
            Visible: =Left(varChildContractCase, 6) = "Case 1" Or Left(varChildContractCase, 6) = "Case 2" Or Left(varChildContractCase, 6) = "Case 3"
            Width: =500
            X: =500
            Y: =174
            ZIndex: =8

        CL_Divider1 As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =1302
            X: =32
            Y: =230
            ZIndex: =9

        CL_LblRights As label:
            Color: =RGBA(0, 18, 107, 1)
            FontWeight: =FontWeight.Bold
            Height: =28
            Size: =16
            Text: ="Rights & declarations"
            Width: =600
            X: =32
            Y: =242
            ZIndex: =10

        CL_ChkModel As checkbox.Checkbox:
            Height: =36
            OnCheck: =Set(varChildModelRelease, true)
            OnUncheck: =Set(varChildModelRelease, false); Set(varChildModelReleaseProvided, false)
            Text: ="Recognisable private persons appear in this production"
            Width: =900
            X: =28
            Y: =276
            ZIndex: =11

        CL_ChkModelProvided As checkbox.Checkbox:
            Height: =32
            OnCheck: =Set(varChildModelReleaseProvided, true)
            OnUncheck: =Set(varChildModelReleaseProvided, false)
            Text: ="  ↳  Model release form(s) provided (attach below)"
            Visible: =varChildModelRelease
            Width: =700
            X: =52
            Y: =314
            ZIndex: =12

        CL_ChkMusic As checkbox.Checkbox:
            Height: =36
            OnCheck: =Set(varChildMusicUsed, true)
            OnUncheck: =Set(varChildMusicUsed, false); Set(varChildMusicLicenceProvided, false)
            Text: ="This production contains music (original or licensed)"
            Visible: =varChildMediaType = "Video" Or varChildMediaType = "Podcast"
            Width: =900
            X: =28
            Y: =352
            ZIndex: =13

        CL_ChkMusicProvided As checkbox.Checkbox:
            Height: =32
            OnCheck: =Set(varChildMusicLicenceProvided, true)
            OnUncheck: =Set(varChildMusicLicenceProvided, false)
            Text: ="  ↳  Music licence / annex provided (attach below)"
            Visible: =(varChildMediaType = "Video" Or varChildMediaType = "Podcast") And varChildMusicUsed
            Width: =700
            X: =52
            Y: =390
            ZIndex: =14

        CL_ChkPreexisting As checkbox.Checkbox:
            Height: =36
            OnCheck: =Set(varChildPreexisting, true)
            OnUncheck: =Set(varChildPreexisting, false); Set(varChildPreexistingProvided, false)
            Text: ="Production contains pre-existing rights material"
            Visible: =varChildMediaType = "Video" Or varChildMediaType = "Podcast"
            Width: =900
            X: =28
            Y: =428
            ZIndex: =15

        CL_ChkPreexistingProvided As checkbox.Checkbox:
            Height: =32
            OnCheck: =Set(varChildPreexistingProvided, true)
            OnUncheck: =Set(varChildPreexistingProvided, false)
            Text: ="  ↳  Pre-existing rights annex(es) provided (attach below)"
            Visible: =(varChildMediaType = "Video" Or varChildMediaType = "Podcast") And varChildPreexisting
            Width: =700
            X: =52
            Y: =466
            ZIndex: =16

        CL_Divider2 As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =1302
            X: =32
            Y: =510
            ZIndex: =17

        CL_LblAttachments As label:
            Color: =RGBA(0, 18, 107, 1)
            FontWeight: =FontWeight.Bold
            Height: =28
            Size: =16
            Text: ="Legal annexes & supporting documents"
            Width: =800
            X: =32
            Y: =520
            ZIndex: =18

        CL_AttachHint As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =22
            Size: =12
            Text: ="Attach signed contracts, model releases, music licences, pre-existing rights annexes, VTT subtitles (SRT is no longer accepted), scripts."
            Width: =1302
            X: =32
            Y: =552
            ZIndex: =19

        CL_Annex As attachments:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =140
            MaxAttachments: =20
            Width: =1302
            X: =32
            Y: =578
            ZIndex: =20

        CL_ChkSubtitles As checkbox.Checkbox:
            Height: =36
            OnCheck: =Set(varChildSubtitlesProvided, true)
            OnUncheck: =Set(varChildSubtitlesProvided, false)
            Text: ="Subtitles are provided for this production (VTT format)"
            Visible: =varChildMediaType = "Video"
            Width: =900
            X: =28
            Y: =734
            ZIndex: =21

        CL_LblVTT As label:
            Color: =RGBA(60, 66, 80, 1)
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="VTT subtitle file(s) *   (VTT only - SRT is not accepted)"
            Visible: =varChildMediaType = "Video" And varChildSubtitlesProvided
            Width: =800
            X: =32
            Y: =776
            ZIndex: =22

        CL_VTTUpload As attachments:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =110
            MaxAttachments: =5
            Visible: =varChildMediaType = "Video" And varChildSubtitlesProvided
            Width: =1302
            X: =32
            Y: =802
            ZIndex: =23

    CL_BottomBar As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =56
        Width: =1366
        Y: =712
        ZIndex: =16

    CL_BtnPrev As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(60, 66, 80, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildMetaScreen)
        Size: =14
        Text: ="←  Previous"
        Width: =140
        X: =32
        Y: =720
        ZIndex: =17

    CL_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =56
        Width: =1366
        ZIndex: =18

