                  Font: =Font.'Open Sans'
                  Height: =55
                  OnSelect: =Select(Parent)
                  Text: =If(IsBlank(ThisItem.Title) Or ThisItem.Title = "New archive", "— untitled archive —", ThisItem.Title)
                  Width: =420
                  X: =24
            - RS_CRowType:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =55
                  OnSelect: =Select(Parent)
