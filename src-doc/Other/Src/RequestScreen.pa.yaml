      - RS_BtnSubmitRequest:
          Control: Classic/Button@2.2.0
          Group: Group1
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
                  And CountRows(colArchives) > 0
                  And CountIf(colArchives,
                      IsBlank(Title) Or Title = "" Or Title = "New archive"
                      Or IsBlank(MediaType) Or MediaType = ""
                      Or IsBlank(ContractCase) Or ContractCase = ""
                      Or Coalesce(AIVoiceover, false)
                  ) = 0,
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: |-
              =IfError(
                  With(
                      {
                          savedReq: Patch(
                              AVCentralDepositRequests,
                              LookUp(AVCentralDepositRequests, ID = varCurrentRequest.ID),
                              {
                                  RequestNumber: varRequestTitle,
                                  RequestTitle: varRequestTitle,
                                  DG: {Value: varRequestDG},
                                  Description: varRequestDescription,
                                  DG_Agency_Contact: ForAll(RS_Owner.SelectedItems As u, {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(u.Mail), DisplayName: u.DisplayName, Email: u.Mail, Department: "", JobTitle: "", Picture: ""}),
                                  Contractor_Contact: ForAll(RS_Contractor.SelectedItems As u, {'@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser", Claims: "i:0#.f|membership|" & Lower(u.Mail), DisplayName: u.DisplayName, Email: u.Mail, Department: "", JobTitle: "", Picture: ""}),
                                  Status: {Value: "Submitted"}
                              }
                          )
                      },
                      Set(varCurrentRequest, savedReq);
                      ForAll(
                          Filter(colArchives, SPId > 0),
                          Patch(
                              AVCentralDepositMediaItems,
                              LookUp(AVCentralDepositMediaItems, ID = SPId),
                              {DepositStatus: Table({Value: "Pending Approval"})}
                          )
                      );
                      Clear(colArchives);
                      Notify("Request submitted successfully.", NotificationType.Success);
                      Navigate(MyRequestScreen)
                  ),
                  Notify("Error submitting request: " & FirstError.Message, NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="Submit request  →"
            Visible: |-
              =Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
              And (IsBlank(varCurrentRequest.Status.Value) Or varCurrentRequest.Status.Value = "Draft")
            Width: =200
            X: =1134
            Y: =720
