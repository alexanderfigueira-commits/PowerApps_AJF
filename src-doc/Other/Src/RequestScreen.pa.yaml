                  "Approved", RGBA(22, 128, 80, 1),
                  "Submitted", RGBA(56, 96, 178, 1),
                  "Rejected", RGBA(193, 40, 40, 1),
                  "Draft", RGBA(96, 104, 120, 1),
                  RGBA(96, 104, 120, 1))
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =DisplayMode.View
            Fill: |-
              =Switch(varCurrentRequest.Status.Value,
                  "Approved", RGBA(223, 245, 233, 1),
                  "Submitted", RGBA(230, 236, 245, 1),
                  "Rejected", RGBA(253, 235, 235, 1),
                  "Draft", RGBA(240, 242, 246, 1),
                  RGBA(240, 242, 246, 1))
            Font: =Font.'Open Sans'
            Height: =32
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =11
            Text: =If(IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0, "New", If(IsBlank(varCurrentRequest.Status.Value), "Draft", varCurrentRequest.Status.Value))
            Visible: =Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
            Width: =120
            X: =1194
            Y: =67
