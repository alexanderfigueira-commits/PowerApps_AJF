          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =180
            Items: =colArchives
            TemplateSize: =56
            Width: =1302
            X: =24
            Y: =526
          Children:
            - RS_CRowSelect:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =55
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(varCurrentChildId, ThisItem.ArchiveId);
                    Set(varChildTitle, If(ThisItem.Title = "New archive", "", ThisItem.Title));
                    Set(varChildMediaType, If(IsBlank(ThisItem.MediaType), "Photo", ThisItem.MediaType));
                    Set(varChildDescription, Coalesce(ThisItem.Description, ""));
                    Set(varChildCaptureDate, ThisItem.CaptureDate);
                    Set(varChildProductionPlace, Coalesce(ThisItem.ProductionPlace, ""));
                    Set(varChildCredits, Coalesce(ThisItem.Credits, ""));
                    Set(varChildLanguageVersions, Coalesce(ThisItem.LanguageVersions, ""));
                    Set(varChildAIVoiceover, Coalesce(ThisItem.AIVoiceover, false));
                    Set(varChildContractCase, Coalesce(ThisItem.ContractCase, ""));
                    Set(varChildContractCase1Sub, Coalesce(ThisItem.ContractCase1Sub, ""));
                    Set(varChildContractRef, Coalesce(ThisItem.ContractRef, ""));
                    Set(varChildModelRelease, Coalesce(ThisItem.ModelRelease, false));
                    Set(varChildModelReleaseProvided, Coalesce(ThisItem.ModelReleaseProvided, false));
                    Set(varChildMusicUsed, Coalesce(ThisItem.MusicUsed, false));
                    Set(varChildMusicLicenceProvided, Coalesce(ThisItem.MusicLicenceProvided, false));
                    Set(varChildPreexisting, Coalesce(ThisItem.Preexisting, false));
                    Set(varChildPreexistingProvided, Coalesce(ThisItem.PreexistingProvided, false));
                    Set(varChildEpisodeTitle, Coalesce(ThisItem.EpisodeTitle, ""));
                    Set(varChildEpisodeSummary, Coalesce(ThisItem.EpisodeSummary, ""));
                    Set(varChildSeasonNumber, Coalesce(ThisItem.SeasonNumber, 0));
                    Set(varChildEpisodeNumber, Coalesce(ThisItem.EpisodeNumber, 0));
                    Set(varChildSeriesTitle, Coalesce(ThisItem.SeriesTitle, ""));
                    Set(varChildProductType, Coalesce(ThisItem.ProductType, ""));
                    Set(varChildProductionEndDate, ThisItem.ProductionEndDate);
                    Set(varChildPublicationStartDate, ThisItem.PublicationStartDate);
                    Set(varChildPublicationEndDate, ThisItem.PublicationEndDate);
                    Set(varChildLinks, Coalesce(ThisItem.ReferenceLinks, ""));
                    Set(varChildTags, Coalesce(ThisItem.Tags, ""));
                    Set(varChildFTPPath, Coalesce(ThisItem.FTPPath, ""));
                    Navigate(ChildInfoScreen)
