                  Font: =Font.'Open Sans'
                  Height: =55
                  OnSelect: =Select(Parent)
                  Text: =If(IsBlank(ThisItem.Title) Or ThisItem.Title = "New archive", "— untitled archive —", ThisItem.Title)
                  Width: =420
                  X: =24
            - RS_CRowType:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =55
                  OnSelect: =Select(Parent)
                  Text: =If(IsBlank(ThisItem.MediaType), "—", If(ThisItem.MediaType = "Photo", "Photo/Reportage", ThisItem.MediaType))
                  Width: =160
                  X: =468
            - RS_CRowValid:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "" And ThisItem.Title <> "New archive"
                        And Not(IsBlank(ThisItem.MediaType)) And ThisItem.MediaType <> ""
                        And Not(IsBlank(ThisItem.ContractCase)) And ThisItem.ContractCase <> ""
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        RGBA(22, 128, 80, 1),
                        RGBA(193, 40, 40, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =55
                  OnSelect: =Select(Parent)
                  Text: |-
                    =If(
                        Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "" And ThisItem.Title <> "New archive"
                        And Not(IsBlank(ThisItem.MediaType)) And ThisItem.MediaType <> ""
                        And Not(IsBlank(ThisItem.ContractCase)) And ThisItem.ContractCase <> ""
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        "✓  Ready",
                        "⚠  Incomplete"
                    )
                  Width: =200
                  X: =648
