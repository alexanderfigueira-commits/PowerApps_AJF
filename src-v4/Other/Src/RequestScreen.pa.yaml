      - RS_BtnSaveRequest:
          Control: Classic/Button@2.2.0
          Group: Group1
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(60, 66, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(186, 196, 214, 1)
            DisabledFill: =RGBA(240, 242, 246, 1)
            DisplayMode: =If(IsBlank(varRequestTitle) Or varRequestTitle = "", DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(230, 236, 245, 1)
            OnSelect: |-
              =Set(varCurrentRequest,
                  Patch(AVCentralDepositRequests,
                      If(
                          IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0,
                          Defaults(AVCentralDepositRequests),
                          LookUp(AVCentralDepositRequests, ID = varCurrentRequest.ID)
                      ),
                      {
                          Title: varRequestTitle,
                          DG: varRequestDG,
                          OwnerContact: varRequestOwnerContact,
                          OwnerEmail: varRequestOwnerEmail,
                          Description: varRequestDescription,
                          Status: {Value: "Draft"},
                          ValidationStatus: {Value: "Incomplete"}
                      }
                  )
              );
              If(IsError(varCurrentRequest),
                  Notify("Error saving draft. Please try again.", NotificationType.Error),
                  Notify("Draft saved as Incomplete.", NotificationType.Success)
              )
            PressedBorderColor: =RGBA(0, 0, 0, 1)
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: |-
              ="💾  Save draft"
            X: =967
            Y: =438
