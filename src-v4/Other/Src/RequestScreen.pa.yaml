              =Set(varCurrentRequest,
                  Patch(AVCentralDepositProjects,
                      LookUp(AVCentralDepositProjects, ID = varCurrentRequest.ID),
                      {
                          Title: varRequestTitle,
                          DG: varRequestDG,
                          OwnerContact: varRequestOwnerContact,
                          OwnerEmail: varRequestOwnerEmail,
                          Description: varRequestDescription,
                          Status: {Value: "Submitted"}
                      }
                  )
              );
              If(IsError(varCurrentRequest),
                  Notify("Error submitting request. Please try again.", NotificationType.Error),
                  ForAll(colArchives,
                      If(
                          Coalesce(SPId, 0) > 0,
                          Patch(CentralDepositMainList, LookUp(CentralDepositMainList, ID = SPId),
                              {
                                  Project: Title,
                                  MediaType: {Value: MediaType},
                                  Description: Description,
                                  CaptureDate: CaptureDate,
                                  ProductionPlace: ProductionPlace,
                                  ProductType: If(MediaType = "Video", ProductType, ""),
                                  SeriesTitle: If(MediaType = "Podcast", SeriesTitle, ""),
                                  EpisodeTitle: If(MediaType = "Podcast", EpisodeTitle, ""),
                                  EpisodeSummary: If(MediaType = "Podcast", EpisodeSummary, ""),
                                  SeasonNumber: If(MediaType = "Podcast", SeasonNumber, 0),
                                  EpisodeNumber: If(MediaType = "Podcast", EpisodeNumber, 0),
                                  PublicationEndDate: If(MediaType = "Video" Or MediaType = "Podcast", ProductionEndDate, Blank()),
                                  PublicationStartDate: PublicationStartDate,
                                  ProductionEndDate: PublicationEndDate,
                                  ReferenceLinks: ReferenceLinks,
                                  Tags: Tags,
                                  FTPPath: FTPPath,
                                  LanguageVersions: {Value: LanguageVersions},
                                  Photographer: If(MediaType = "Photo", Credits, ""),
                                  Director: If(MediaType = "Video", Credits, ""),
                                  Producer: If(MediaType = "Podcast", Credits, ""),
                                  AIVoiceover: AIVoiceover,
                                  ContractCase: {Value: ContractCase},
                                  ContractReference: ContractRef,
                                  MusicUsed: MusicUsed,
                                  MusicLicenseProvided: MusicLicenceProvided,
                                  PreexistingRightsProvided: PreexistingProvided,
                                  DepositStatus: {Value: "Pending Approval"}
                              }
                          ),
                          Patch(CentralDepositMainList, Defaults(CentralDepositMainList),
                              {
                                  Project: Title,
                                  MediaType: {Value: MediaType},
                                  Description: Description,
                                  CaptureDate: CaptureDate,
                                  ProductionPlace: ProductionPlace,
                                  ProductType: If(MediaType = "Video", ProductType, ""),
                                  SeriesTitle: If(MediaType = "Podcast", SeriesTitle, ""),
                                  EpisodeTitle: If(MediaType = "Podcast", EpisodeTitle, ""),
                                  EpisodeSummary: If(MediaType = "Podcast", EpisodeSummary, ""),
                                  SeasonNumber: If(MediaType = "Podcast", SeasonNumber, 0),
