                  X: =32
                  Y: =882
            - CL_ChkFramework:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =varDocFramework
                  Font: =Font.'Open Sans'
                  Height: =36
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varDocFramework, true)
                  OnUncheck: =Set(varDocFramework, false)
                  Text: ="Signed framework contract *"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =600
                  X: =28
                  Y: =176
            - CL_ChkSpecific:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =varDocSpecific
                  Font: =Font.'Open Sans'
                  Height: =36
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varDocSpecific, true)
                  OnUncheck: =Set(varDocSpecific, false)
                  Text: ="Signed specific contract *"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =600
                  X: =28
                  Y: =206
            - CL_ChkOffer:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =varDocOffer
                  Font: =Font.'Open Sans'
                  Height: =36
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varDocOffer, true)
                  OnUncheck: =Set(varDocOffer, false)
                  Text: ="Offer (optional)"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =600
                  X: =28
                  Y: =236
            - CL_LblCase1Req:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(200, 30, 30, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: ="⚠  Both mandatory contracts must be confirmed"
                  Visible: =Left(varChildContractCase, 6) = "Case 1" And (Not(varDocFramework) Or Not(varDocSpecific))
