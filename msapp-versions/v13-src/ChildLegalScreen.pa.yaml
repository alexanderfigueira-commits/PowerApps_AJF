            Y: =30
      - CL_Gallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DelayItemLoading: =false
            Fill: =RGBA(247, 248, 250, 1)
            Height: =666
            Items: |-
              =[{id: 1}]
            LoadingSpinner: =LoadingSpinner.None
            TemplatePadding: =0
            TemplateSize: =If(varChildMediaType = "Video", 1040, 810)
            Width: =1366
            Y: =102
          Children:
            - CL_Banner:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(147, 197, 253, 1)
                  BorderThickness: =1
                  Fill: =RGBA(239, 246, 255, 1)
                  Height: =40
                  Width: =1302
                  X: =32
                  Y: =6
            - CL_BannerText:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(30, 64, 175, 1)
                  Font: =Font.'Open Sans'
                  Text: ="Select the contract case for this media, confirm rights flags and upload required legal documents below."
                  Width: =1260
                  X: =52
                  Y: =6
            - CL_LblCase:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  Size: =16
                  Text: ="Contract case *"
                  Width: =600
                  X: =32
                  Y: =58
            - CL_Case:
                Control: Classic/DropDown@2.3.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  ChevronBackground: =RGBA(56, 96, 178, 1)
                  ChevronFill: =RGBA(255, 255, 255, 1)
                  ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  ChevronHoverFill: =RGBA(255, 255, 255, 1)
                  Default: =varChildContractCase
                  Font: =Font.'Open Sans'
                  Height: =44
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Items: |-
                    =[
                        "Case 1 - framework / direct service contract",
                        "Case 2 - specific service contract",
                        "Case 3 - co-production agreement",
                        "Case 4 - acquisition of existing material",
                        "Case 5 - internal EU production",
                        "Case 6 - donation / free licence"
                    ]
                  Items.Value: =Value
                  OnChange: =Set(varChildContractCase, Self.Selected.Value)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 18, 107, 1)
                  SelectionColor: =RGBA(255, 255, 255, 1)
                  SelectionFill: =RGBA(56, 96, 178, 1)
                  Width: =900
                  X: =32
                  Y: =90
            - CL_LblCase1Sub:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Case 1 — required documents"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =520
                  X: =32
                  Y: =148
            - CL_Divider1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 232, 238, 1)
                  Height: =1
                  Width: =1302
                  X: =32
                  Y: =310
            - CL_LblRights:
                Control: Label@2.5.1
