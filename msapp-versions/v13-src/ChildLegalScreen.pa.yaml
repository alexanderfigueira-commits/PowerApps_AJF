                  Width: =900
                  X: =28
                  Y: =814
            - CL_LblVTT:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="VTT subtitle file(s) *   (VTT only - SRT is not accepted)"
                  Visible: =varChildMediaType = "Video" And varChildSubtitlesProvided
