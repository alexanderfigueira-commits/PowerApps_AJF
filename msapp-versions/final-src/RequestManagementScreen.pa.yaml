      - HomeGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =If(locShowFilters,330,450)
            Items: |-
              =Sort(
                  Filter(
                      colMyReqs,
                      'Created By'.Email = User().Email Or (varUserRole = "ADMINISTRATOR" And Status.Value <> "Draft"),
                      varFilter = "All" Or Status.Value = varFilter,
                      varFilterDG = "All" Or IsBlank(varFilterDG) Or DG.Value = varFilterDG,
                      (IsBlank(HomeFilterRequestID.Text) Or HomeFilterRequestID.Text = "" Or StartsWith(
                          RequestNumber,
                          HomeFilterRequestID.Text
                      )) And (IsBlank(HomeFilterRequestName.Text) Or HomeFilterRequestName.Text = "" Or StartsWith(
                          RequestTitle,
                          HomeFilterRequestName.Text
                      )),
                      IsEmpty(cmbFilterRequestor.SelectedItems) Or "All" in cmbFilterRequestor.SelectedItems.Value Or 'Created By'.DisplayName in cmbFilterRequestor.SelectedItems.Value,
                      IsEmpty(cmbFilterAssignee_1.SelectedItems) Or "All" in cmbFilterAssignee_1.SelectedItems.Value Or Assignee.DisplayName in cmbFilterAssignee_1.SelectedItems.Value,
                      IsBlank(HomeFilterBeluga.Text) Or HomeFilterBeluga.Text = "" Or !IsEmpty(Filter(colMyMedia, ParentRequest = RequestNumber And StartsWith(BelugaReference, HomeFilterBeluga.Text))),
                      IsBlank(varFilterStartDate) Or Created >= varFilterStartDate,
                      IsBlank(varFilterEndDate) Or Created <= varFilterEndDate,
                      IsBlank(locProdTypeFilter) Or !IsEmpty(
                          Filter(
                              colMyMedia,
                              ParentRequest = RequestNumber And First(MediaType).Value = locProdTypeFilter
                          )
                      )
                  ),
                  Created,
                  // one status: oldest first (waiting longest on top); All Status: newest first
                  If(varFilter = "All", SortOrder.Descending, SortOrder.Ascending)
              )
