Screens:
  RequestManagementScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varViewOnly, false);
        // varUserRole gates the gallery's role clause, so it is always set.
        Set(
            varUserRole,
            Coalesce(
                LookUp('AV-CD-RolesPermissionsList', UserEmail.Email = User().Email, Role.Value),
                "REQUESTOR"
            )
        );

        // Data loads once per session, or whenever the cache is empty (self-heal),
        // instead of on every visit. Use HomeBtnRefresh to reload on demand.
        If(
            Not(varReqDataLoaded) Or IsEmpty(colMyReqs),
            Set(varReqReady, false);
            ClearCollect(colDGOptions, {Value: "All"});
            Collect(colDGOptions, Choices('AV-CD-Requests'.DG));
            ClearCollect(colAssignees, {Value: "All"});
            Collect(
                colAssignees,
                Sort(Distinct(Filter('AV-CD-RolesPermissionsList', Role.Value = "ADMINISTRATOR"), UserEmail.DisplayName), Value)
            );
            Refresh('AV-CD-Requests');
            Refresh('AV-CD-Mediafiles');
            ClearCollect(colMyReqs, 'AV-CD-Requests');
            ClearCollect(colMyMedia, 'AV-CD-Mediafiles');
            Set(
                varMyRequestorName,
                LookUp(colMyReqs, 'Created By'.Email = User().Email, 'Created By'.DisplayName)
            );
            ClearCollect(colRequestorOptions, {Value: "All"});
            Collect(
                colRequestorOptions,
                Sort(Distinct(colMyReqs, 'Created By'.DisplayName), Value)
            );
            If(
                CountRows(colMyReqs) >= 2000 Or CountRows(colMyMedia) >= 2000,
                Notify(
                    "Only the first 2000 requests are loaded, so older ones may be missing. Narrow your search - status, production type, date range, ID or title - to work with a smaller set.",
                    NotificationType.Warning
                )
            );
            Set(varReqDataLoaded, true)
        );

        // Filters initialise once, so the selection survives navigating away and back.
        If(
            Not(varReqFiltersInit),
            // ADMINISTRATOR opens on Processing from the first render; REQUESTOR starts on "All" and the ladder below picks the status
            Set(varFilter,"All");
            Set(varFilterDG, "");
            Set(varFilterRequestName, "");
            // To = the END of today: Today() is 00:00 and Created has a time, so "Created <= To" hid today's requests
            Set(varFilterStartDate, Today()-31);
            Set(varFilterEndDate, Today() + Time(23, 59, 59));
            Set(varFilterDay, Today());
            UpdateContext({locProdTypeFilter: Blank(), locShowFilters: true});
            Set(varReqFiltersInit, true)
        );
        // a new day since the range was set (app kept open past midnight): the default range moves to today
        If(
            varReqFiltersInit And varFilterDay <> Today(),
            Set(varFilterDay, Today());
            Set(varFilterStartDate, Today()-31);
            Set(varFilterEndDate, Today() + Time(23, 59, 59));
            Reset(HomeFilterStart);
            Reset(HomeFilterEnd)
        );

        // The list opens on the first status that has requests (per role) when the
        // screen is entered with "All Status" and "All Media":
        //   REQUESTOR:     Pending -> Draft -> Processing -> All
        //   ADMINISTRATOR: Processing -> Pending -> All (drafts are never shown to admins)
        // "Has requests" = what HomeGallery would show for that status with the other
        // filters as they are now. A status handed over from the dashboard still wins.
        If(
            varFilter = "All" And IsBlank(locProdTypeFilter) And IsBlank(varNavFilter),
            With(
                {
                    visible: Filter(
                        colMyReqs,
                        'Created By'.Email = User().Email Or (varUserRole = "ADMINISTRATOR" And Status.Value <> "Draft"),
                        varFilterDG = "All" Or IsBlank(varFilterDG) Or DG.Value = varFilterDG,
                        (IsBlank(HomeFilterRequestID.Text) Or HomeFilterRequestID.Text = "" Or StartsWith(
                                    RequestNumber,
                                    HomeFilterRequestID.Text
                                )) And (IsBlank(HomeFilterRequestName.Text) Or HomeFilterRequestName.Text = "" Or StartsWith(
                                    RequestTitle,
                                    HomeFilterRequestName.Text
                                )),
                        IsEmpty(cmbFilterRequestor.SelectedItems) Or "All" in cmbFilterRequestor.SelectedItems.Value Or 'Created By'.DisplayName in cmbFilterRequestor.SelectedItems.Value,
                        IsEmpty(cmbFilterAssignee_1.SelectedItems) Or "All" in cmbFilterAssignee_1.SelectedItems.Value Or Assignee.DisplayName in cmbFilterAssignee_1.SelectedItems.Value,
                        IsBlank(HomeFilterBeluga.Text) Or HomeFilterBeluga.Text = "" Or !IsEmpty(Filter(colMyMedia, ParentRequest = RequestNumber And StartsWith(BelugaReference, HomeFilterBeluga.Text))),
                        IsBlank(varFilterStartDate) Or Created >= varFilterStartDate,
                        IsBlank(varFilterEndDate) Or Created <= varFilterEndDate,
                        IsBlank(locProdTypeFilter) Or !IsEmpty(
                                    Filter(
                                        colMyMedia,
                                        ParentRequest = RequestNumber And First(MediaType).Value = locProdTypeFilter
                                    )
                                )
                    )
                },
                Set(
                    varFilter,
                    Coalesce(
                        First(
                            Filter(
                                If(
                                    varUserRole = "ADMINISTRATOR",
                                    ["Processing"],
                                    ["Pending", "Draft", "Processing"]
                                ) As step,
                                CountRows(Filter(visible, Status.Value = step.Value)) > 0
                            )
                        ).Value,
                        If(varUserRole = "ADMINISTRATOR", "Processing", "All")
                    )
                )
            )
        );

        // A status handed over from the dashboard still wins on every visit.
        If(
            Not(IsBlank(varNavFilter)),
            Set(varFilter, varNavFilter)
        );
        Set(varNavFilter, Blank());
        // data loaded and the status is settled: only now is the list shown
        Set(varReqReady, true)
