                    Set(varRequestTitle, Coalesce(ThisItem.RequestTitle, ""));
                    Set(varRequestDG, Coalesce(ThisItem.DG.Value, ""));
                    Set(varRequestDescription1, Coalesce(ThisItem.Description, ""));
                    Set(varRequestDescription, Coalesce(ThisItem.Description, ""));
                    Set(varRequestOwnerContact, Coalesce(First(ThisItem.DG_Agency_Contact).DisplayName, ""));
