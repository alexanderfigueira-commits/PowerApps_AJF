                          Filter(varAttachRecord.Attachments, Not(StartsWith(DisplayName, "EpisodeVisual_")) And (EndsWith(Lower(DisplayName), ".jpg") Or EndsWith(Lower(DisplayName), ".jpeg") Or EndsWith(Lower(DisplayName), ".png")))
