Screens:
  ChildInfoScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(
            varRequestorLocked,
            // view-only (a request opened from a dashboard ID) locks everything, whatever the role; a requestor edits only in Draft / Pending
            varViewOnly
            Or (
                varUserRole <> "ADMINISTRATOR"
                And Not(Coalesce(varCurrentRequest.Status.Value, "Draft") in ["Draft", "Pending"])
            )
        );
        Set(varNavArm, "");
        ClearCollect(colTplMedia, 'AV-CD-Mediafiles');
        // the attachments panel (CL_FormAttach) edits a snapshot of the open media item;
        // taken here too so the file lists on this tab show the right item
        // the item's SharePoint ID: if the variable lost it, take it back from the media list, else from the record already loaded for this item
        If(
            Coalesce(varCurrentChildSPId, 0) = 0,
            Set(
                varCurrentChildSPId,
                If(
                    Coalesce(LookUp(colArchives, ArchiveId = varCurrentChildId).SPId, 0) > 0,
                    LookUp(colArchives, ArchiveId = varCurrentChildId).SPId,
                    Coalesce(varAttachRecord.ID, 0)
                )
            )
        );
        // the attachments record is only reloaded when the id is known and different: it is never blanked while an id exists
        If(
            Coalesce(varCurrentChildSPId, 0) > 0 And Coalesce(varAttachRecord.ID, 0) <> varCurrentChildSPId,
            Set(varAttachRecord, LookUp('AV-CD-Mediafiles', ID = varCurrentChildSPId))
        );
        // the podcast visual preview starts closed
        UpdateContext({locShowVisualPreview: false});
        // A Video's Language and Type of product dropdowns show their first item (EN / Clip) while nothing is
        // stored yet. Store what is shown, or the Validations tab sees them empty until they are re-selected.
        If(
            varChildMediaType = "Video" And Not(varRequestorLocked),
            If(Coalesce(varChildLanguageVersions, "") = "", Set(varChildLanguageVersions, "EN"));
            If(Coalesce(varChildProductType, varChildProductType1, "") = "", Set(varChildProductType, "Clip"))
        )
