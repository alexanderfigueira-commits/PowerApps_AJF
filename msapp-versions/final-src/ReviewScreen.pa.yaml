Screens:
  ReviewScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Refresh('AV-CD-Requests');
        Set(varReviewProject, Blank());
        Set(varReviewComment, "");
        Set(varReviewQueueMine, Coalesce(varReviewMineOnly, false));
        Set(varReviewMineOnly, false);
        ClearCollect(colRevReqs, 'AV-CD-Requests')
    Children:
      - RV_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =52
            Width: =1366
      - RV_QueuePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =840
            Width: =430
            Y: =52
      - RV_QueueTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =14
            Text: ="Submitted requests  (" & Text(CountRows(RV_QueueGallery.AllItems)) & ")"
            Width: =400
            X: =16
            Y: =60
      - RV_QueueDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =430
            Y: =104
      - RV_QueueGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =786
            Items: |-
              =Sort(
                  Filter(colRevReqs,
                      // ADMINISTRATOR: Processing and Pending. Anyone else: only their own Pending
                      // (a safety net: ReviewScreen is only reachable by administrators).
                      If(
                          varUserRole = "ADMINISTRATOR",
                          Status.Value = "Processing" Or Status.Value = "Pending",
                          Status.Value = "Pending" And Lower('Created By'.Email) = Lower(User().Email)
                      ),
                      Not(varReviewQueueMine) Or Not(IsEmpty(Filter(DG_Agency_Contact, Lower(Email) = Lower(User().Email))))
                  ),
                  Modified, SortOrder.Descending
              )
            TemplateSize: =72
            Width: =430
            Y: =106
          Children:
            - RV_QRowBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =72
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(varReviewProject, ThisItem);
                    Set(varReviewComment, "")
                  Width: =430
            - RV_QRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Width: =430
                  Y: =71
            - RV_QRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  OnSelect: =Select(Parent)
                  Text: =Coalesce(ThisItem.RequestTitle, "Untitled request")
                  Width: =390
                  X: =20
                  Y: =10
            - RV_QRowMeta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =33
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: =Coalesce(ThisItem.DG.Value, "—") & "  ·  " & Coalesce(First(ThisItem.DG_Agency_Contact).DisplayName, "—")
                  Width: =370
                  X: =20
                  Y: =38
            - Icon1:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Height: =30
                  Icon: =Icon.NextArrow
                  OnSelect: |-
                    =Set(varReviewProject, ThisItem);
                    Set(varReviewComment, "")
                  Width: =25
                  X: =390
                  Y: =21
      - RV_DetailPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =840
            Width: =930
            X: =436
            Y: =52
      - RV_EmptyState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(140, 148, 160, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Select a request from the queue on the left to review it."
            Visible: =IsBlank(varReviewProject)
            Width: =880
            X: =461
            Y: =420
      - RV_DetailMeta:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: |-
              =Coalesce(varReviewProject.DG.Value, "—") & "   ·   Contact: " & Coalesce(First(varReviewProject.DG_Agency_Contact).DisplayName, varReviewProject.Manual_DG_Agency_Contact, "—")
            Visible: =Not(IsBlank(varReviewProject))
            Width: =860
            X: =454
            Y: =110
      - RV_DetailDivider1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =136
      - RV_ChildrenTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Text: ="Archives in this request"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =400
            X: =460
            Y: =148
      - RV_ThTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =11
            Text: ="ARCHIVE TITLE"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =340
            X: =460
            Y: =180
      - RV_ThType:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =11
            Text: ="TYPE"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =140
            X: =820
            Y: =180
      - RV_ThValid:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =11
            Text: ="VALIDATION"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =160
            X: =976
            Y: =180
      - RV_ChildrenGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =248
            Items: |-
              =If(
                  IsBlank(varReviewProject),
                  Filter('AV-CD-Mediafiles', 1 = 2),
                  Sort(
                      Filter('AV-CD-Mediafiles', ParentRequest = varReviewProject.RequestNumber),
                      Created, SortOrder.Descending
                  )
              )
            TemplateSize: =100
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =216
          Children:
            - RV_CRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Width: =900
                  Y: =99
            - RV_CRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  Height: =36
                  Size: =12
                  Text: =If(IsBlank(ThisItem.CD_MediaNumber) Or ThisItem.CD_MediaNumber = "New archive", "— untitled —", ThisItem.CD_MediaNumber)
                  Width: =340
                  X: =24
            - RV_CRowType:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =36
                  Size: =12
                  Text: =If(IsBlank(First(ThisItem.MediaType).Value), "—", If(First(ThisItem.MediaType).Value = "Photo", "Photo/Reportage", First(ThisItem.MediaType).Value))
                  Width: =140
                  X: =384
            - RV_CRowValid:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        Not(IsBlank(ThisItem.CD_MediaNumber)) And ThisItem.CD_MediaNumber <> "New archive"
                        And Not(IsBlank(First(ThisItem.MediaType).Value))
                        And Not(IsBlank(First(ThisItem.ContractCase).Value))
                        And Not(ThisItem.AIVoiceover = "Yes"),
                        RGBA(22, 128, 80, 1),
                        RGBA(193, 40, 40, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =36
                  Size: =12
                  Text: |-
                    =If(
                        Not(IsBlank(ThisItem.CD_MediaNumber)) And ThisItem.CD_MediaNumber <> "New archive"
                        And Not(IsBlank(First(ThisItem.MediaType).Value))
                        And Not(IsBlank(First(ThisItem.ContractCase).Value))
                        And Not(ThisItem.AIVoiceover = "Yes"),
                        "✓  Ready",
                        "⚠  Incomplete"
                    )
                  Width: =160
                  X: =540
            - RV_CRowNotesLbl:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =22
                  Size: =10
                  Text: ="Internal Notes"
                  Width: =110
                  X: =24
                  Y: =40
                Children: []
            - RV_CRowNotes:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =PlainText(Coalesce(ThisItem.Notes, ""))
                  DisplayMode: =If(varUserRole = "ADMINISTRATOR", DisplayMode.Edit, DisplayMode.View)
                  Font: =Font.'Open Sans'
                  Height: =56
                  HintText: ="Internal notes for this media item"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Mode: =TextMode.MultiLine
                  Visible: =true
                  Width: =690
                  X: =140
                  Y: =38
                Children: []
            - RV_CRowNotesSave:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =If(Self.DisplayMode = DisplayMode.Edit, RGBA(56, 96, 178, 1), RGBA(186, 196, 214, 1))
                  DisplayMode: =If(varUserRole = "ADMINISTRATOR" And RV_CRowNotes.Text <> PlainText(Coalesce(ThisItem.Notes, "")), DisplayMode.Edit, DisplayMode.Disabled)
                  Height: =32
                  Icon: =Icon.Save
                  OnSelect: |-
                    =IfError(
                        Patch('AV-CD-Mediafiles', LookUp('AV-CD-Mediafiles', ID = ThisItem.ID), {Notes: RV_CRowNotes.Text});
                        Notify("Internal notes saved for " & ThisItem.CD_MediaNumber & ".", NotificationType.Success),
                        Notify("Internal notes could not be saved: " & FirstError.Message, NotificationType.Error)
                    )
                  Width: =32
                  X: =846
                  Y: =50
                Children: []
      - RV_DetailDivider2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =472
      - RV_LblOwnerAssign:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: ="Assignee(s)  -  approver is added on approval; add a co-assignee when needed"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =700
            X: =460
            Y: =484
      - RV_Assignee:
          Control: Classic/ComboBox@2.4.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            DefaultSelectedItems: |-
              =Filter(
                  Table({
                      DisplayName: Coalesce(
                          varReviewProject.Assignee.DisplayName,
                          First(varReviewProject.DG_Agency_Contact).DisplayName
                      ),
                      Mail: Coalesce(
                          varReviewProject.Assignee.Email,
                          First(varReviewProject.DG_Agency_Contact).Email
                      )
                  }),
                  Not(IsBlank(DisplayName))
              )
            DisplayFields: =["DisplayName"]
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            InputTextPlaceholder: ="Search people to add as assignee…"
            Items: |-
              =Office365Users.SearchUserV2({searchTerm: Self.SearchText, top: 20}).value
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SearchFields: =["DisplayName"]
            SelectMultiple: =false
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Visible: =Not(IsBlank(varReviewProject))
            Width: =380
            X: =460
            Y: =512
      - RV_OwnerEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =Coalesce(First(varReviewProject.Contractor_Contact).DisplayName, varReviewProject.Manual_Contractor_Contact, "—")
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            HintText: ="Contractor contact"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =Not(IsBlank(varReviewProject))
            Width: =380
            X: =860
            Y: =512
      - RV_DetailDivider3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =564
      - RV_LblComment:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: ="Reviewer comment  (required to pending or reject)"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =600
            X: =460
            Y: =576
      - RV_Comment:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =Coalesce(varReviewComment, "")
            Font: =Font.'Open Sans'
            Height: =60
            HintText: ="Explain what needs to be corrected before the project can be approved."
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Mode: =TextMode.MultiLine
            OnChange: =Set(varReviewComment, Self.Text)
            Visible: =Not(IsBlank(varReviewProject))
            Width: =880
            X: =460
            Y: =604
      - RV_ExistingComment:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Size: =12
            Text: |-
              ="Previous reviewer comment: " & Coalesce(varReviewProject.ReviewerComments, "none")
            Visible: =Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewProject.ReviewerComments))
            Width: =880
            X: =460
            Y: =668
      - RV_DetailDivider4:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =706
      - RV_BtnApprove:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
                  And varReviewProject.Status.Value = "Processing",
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(22, 128, 80, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(15, 90, 55, 1)
            OnSelect: |-
              =IfError(
                  Patch('AV-CD-Requests',
                      LookUp('AV-CD-Requests', ID = varReviewProject.ID),
                      {
                          Status: {Value: "Approved"},
                         Assignee: If(
                              IsBlank(RV_Assignee.Selected.Mail),
                              Blank(),
                              {
                                  Claims: "i:0#.f|membership|" & Lower(RV_Assignee.Selected.Mail),
                                  DisplayName: RV_Assignee.Selected.DisplayName,
                                  Email: RV_Assignee.Selected.Mail,
                                  Department: "",
                                  JobTitle: "",
                                  Picture: ""
                              }
                          ),
                          ReviewedByContact: Table({
                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                              DisplayName: User().FullName,
                              Email: User().Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          }),
                          ReviewedDate: Now()
                      }
                  );
                  Notify("Request approved.", NotificationType.Success);
                  Set(varReviewProject, Blank());
                  Set(varReviewComment, ""),
                  Notify("Approve failed: " & FirstError.Message, NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="✓  Approve"
            Visible: =Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
            Width: =200
            X: =460
            Y: =720
      - RV_BtnReject:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(193, 40, 40, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(186, 196, 214, 1)
            DisabledFill: =RGBA(240, 242, 246, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
                  And varReviewProject.Status.Value = "Processing"
                  And Not(IsBlank(varReviewComment)) And varReviewComment <> "",
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(253, 235, 235, 1)
            OnSelect: |-
              =IfError(
                  Patch('AV-CD-Requests',
                      LookUp('AV-CD-Requests', ID = varReviewProject.ID),
                      {
                          Status: {Value: "Rejected"},
                          ReviewerComments: varReviewComment,
                          ReviewedByContact: Table({
                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                              DisplayName: User().FullName,
                              Email: User().Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          }),
                          ReviewedDate: Now()
                      }
                  );
                  Notify("Request rejected. The owner will see your comment on their next visit.", NotificationType.Warning);
                  Set(varReviewProject, Blank());
                  Set(varReviewComment, ""),
                  Notify("Reject failed: " & FirstError.Message, NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="✕  Reject"
            Visible: =Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
            X: =676
            Y: =720
      - RV_BtnNeedInfo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(224, 134, 0, 1)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(186, 196, 214, 1)
            DisabledFill: =RGBA(240, 242, 246, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
                  And varReviewProject.Status.Value = "Processing"
                  And Not(IsBlank(varReviewComment)) And varReviewComment <> "",
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(224, 134, 0, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(224, 134, 0, 1), -20%)
            OnSelect: |-
              =IfError(
                  Patch('AV-CD-Requests',
                      LookUp('AV-CD-Requests', ID = varReviewProject.ID),
                      {
                          Status: {Value: "Pending"},
                          ReviewerComments: varReviewComment,
                          ReviewedByContact: Table({
                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                              DisplayName: User().FullName,
                              Email: User().Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          }),
                          ReviewedDate: Now()
                      }
                  );
                  Notify("Sent back to the requestor for more information.", NotificationType.Success);
                  Set(varReviewProject, Blank());
                  Set(varReviewComment, ""),
                  Notify("Could not send it back: " & FirstError.Message, NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="↩  Need info"
            Visible: =Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
            Width: =200
            X: =852
            Y: =720
      - RV_RejectHint:
          Control: Label@2.5.1
          Properties:
