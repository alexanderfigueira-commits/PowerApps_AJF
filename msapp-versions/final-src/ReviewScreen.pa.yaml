Screens:
  ReviewScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Refresh('AV-CD-Requests');
        Set(varReviewQueueMine, Coalesce(varReviewMineOnly, false));
        Set(varReviewMineOnly, false);
        ClearCollect(colRevReqs, 'AV-CD-Requests');
        // opened from HomeRowReview: keep the request selected there (re-read fresh from the list); any other entry starts empty
        If(
            Coalesce(varReviewFromRow, false) And Not(IsBlank(varReviewProject)),
            Set(varReviewProject, Coalesce(LookUp(colRevReqs, ID = varReviewProject.ID), varReviewProject)),
            Set(varReviewProject, Blank());
            Set(varReviewComment, "")
        );
        Set(varReviewFromRow, false)
    Children:
      - RV_QueuePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =840
            Width: =430
            Y: =52
      - RV_QueueTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =14
            Text: ="Submitted requests  (" & Text(CountRows(RV_QueueGallery.AllItems)) & ")"
            Width: =400
            X: =16
            Y: =60
      - RV_QueueDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =430
            Y: =104
      - RV_QueueGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Default: =LookUp(colRevReqs, ID = varReviewProject.ID)
            Height: =786
            Items: |-
              =Sort(
                  Filter(colRevReqs,
                      // ADMINISTRATOR: Processing and Pending. Anyone else: only their own Pending
                      // (a safety net: ReviewScreen is only reachable by administrators).
                      If(
                          varUserRole = "ADMINISTRATOR",
                          Status.Value = "Processing" Or Status.Value = "Pending",
                          Status.Value = "Pending" And Lower('Created By'.Email) = Lower(User().Email)
                      ),
                      Not(varReviewQueueMine) Or Not(IsEmpty(Filter(DG_Agency_Contact, Lower(Email) = Lower(User().Email))))
                  ),
                  Modified, SortOrder.Descending
              )
            TemplateSize: =95
            Width: =430
            Y: =106
          Children:
            - RV_QRowBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =95
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(varReviewProject, ThisItem);
                    Set(varReviewComment, "")
                  Width: =430
            - RV_QRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Width: =430
                  Y: =94
            - RV_QRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =56
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: =Coalesce(ThisItem.RequestTitle, "Untitled request")
                  Width: =241
                  X: =135
            - RV_QRowMeta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =38
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: =Coalesce(ThisItem.DG.Value, "—") & "  ·  " & Coalesce(ThisItem.Assignee.DisplayName, "— Not Assigned —") & If(IsBlank(ThisItem.CoAssignee.DisplayName), "", " + " & ThisItem.CoAssignee.DisplayName)
                  Width: =417
                  X: =13
                  Y: =51
            - Icon1:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Height: =30
                  Icon: =Icon.NextArrow
                  OnSelect: |-
                    =Set(varReviewProject, ThisItem);
                    Set(varReviewComment, "")
                  Width: =25
                  X: =390
                  Y: =21
            - RV_RequestIDNav_Gallery:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =RGBA(77, 77, 77, 1)
                  DisabledBorderColor: =Self.BorderColor
                  DisabledColor: =RGBA(77, 77, 77, 1)
                  DisabledFill: =RGBA(215, 223, 240, 1)
                  Fill: =RGBA(215, 223, 240, 1)
                  Font: =Font.'Open Sans'
                  Height: =31
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(99, 96, 178, 1), -20%)
                  OnSelect: |-
                    =// open the request, the same way as a HomeGallery row on the Requests screen
                    // (from ReviewScreen's own list, colRevReqs; RequesDetailScreen shows the back arrow)
                    With(
                        {req: Coalesce(LookUp(colRevReqs, ID = ThisItem.ID), ThisItem)},
                        // select this row too, so ReviewScreen shows it when the user comes back
                        Set(varReviewProject, req);
                        Set(varReviewComment, "");
                        Set(varCurrentRequest, req);
                        Set(varRequestTitle1, Coalesce(req.RequestTitle, ""));
                        Set(varRequestTitle, Coalesce(req.RequestTitle, ""));
                        Set(varRequestDG, Coalesce(req.DG.Value, ""));
                        Set(varRequestDescription1, Coalesce(req.Description, ""));
                        Set(varRequestDescription, Coalesce(req.Description, ""));
                        Set(varRequestOwnerContact, Coalesce(First(req.DG_Agency_Contact).DisplayName, ""));
                        Set(varRequestMediaType, "");
                        Navigate(RequesDetailScreen, ScreenTransition.Cover, {locShowTypePicker: false, locResetContacts: true, locFromReview: true})
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =11
                  Text: |+
                    =Switch(
                      First(LookUp('AV-CD-Mediafiles', ParentRequest = ThisItem.RequestNumber).MediaType).Value, 
                      "Photo","📷 ","Video","🎬 ","Podcast","🎙️ ") 
                    & ThisItem.RequestNumber

                  Tooltip: ="Click to navigate to the Request Details"
                  Width: =110
                  X: =13
                  Y: =12
