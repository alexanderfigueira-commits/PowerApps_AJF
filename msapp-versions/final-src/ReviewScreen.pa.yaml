                  Height: =1
                  Width: =900
                  Y: =99
            - RV_CRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  Height: =36
                  Size: =11
                  Text: =If(IsBlank(ThisItem.CD_MediaNumber) Or ThisItem.CD_MediaNumber = "New archive", "— untitled —", ThisItem.CD_MediaNumber)
                  Width: =340
                  X: =24
            - RV_CRowType:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =36
                  Size: =12
                  Text: =If(IsBlank(First(ThisItem.MediaType).Value), "—", If(First(ThisItem.MediaType).Value = "Photo", "Photo/Reportage", First(ThisItem.MediaType).Value))
                  Width: =140
                  X: =384
            - RV_CRowNotesLbl:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =22
                  Size: =11
                  Text: ="Internal Notes"
                  Width: =110
                  X: =24
                  Y: =40
            - RV_CRowValid:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        Not(IsBlank(ThisItem.CD_MediaNumber)) And ThisItem.CD_MediaNumber <> "New archive"
                        And Not(IsBlank(First(ThisItem.MediaType).Value))
                        And Not(IsBlank(First(ThisItem.ContractCase).Value))
                        And Not(ThisItem.AIVoiceover = "Yes"),
                        RGBA(22, 128, 80, 1),
                        RGBA(193, 40, 40, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =36
                  Size: =11
                  Text: |-
                    =If(
                        Not(IsBlank(ThisItem.CD_MediaNumber)) And ThisItem.CD_MediaNumber <> "New archive"
                        And Not(IsBlank(First(ThisItem.MediaType).Value))
                        And Not(IsBlank(First(ThisItem.ContractCase).Value))
                        And Not(ThisItem.AIVoiceover = "Yes"),
                        "✓  Ready",
                        "⚠  Incomplete"
                    )
                  Width: =160
                  X: =540
