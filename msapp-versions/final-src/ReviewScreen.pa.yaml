      - RV_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =56
            Width: =1366
      - RV_BtnApprove:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
                  And varReviewProject.Status.Value = "Processing"
                  // turning archive-only ON needs a reason (it goes to the requestor)
                  And Not(RV_ArchiveOnly.Value And Not(Coalesce(varReviewProject.ArchivedOnly, false)) And IsBlank(Trim(varReviewComment))),
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(22, 128, 80, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(15, 90, 55, 1)
            OnSelect: |-
              =IfError(
                  Patch('AV-CD-Requests',
                      LookUp('AV-CD-Requests', ID = varReviewProject.ID),
                      {
                          // some but not all media files ticked "Approved" on the request screen -> Partially approved
                          Status: {Value: If(
                          With(
                              {n: CountRows(RV_ChildrenGallery.AllItems), ok: CountRows(Filter(RV_ChildrenGallery.AllItems, MediaApproved = true))},
                              ok > 0 And ok < n
                          ),
                          "Partially approved",
                          "Approved"
                      )},
                          ReviewedByContact: Table({
                              Claims: "i:0#.f|membership|" & Lower(User().Email),
                              DisplayName: User().FullName,
                              Email: User().Email,
                              Department: "",
                              JobTitle: "",
                              Picture: ""
                          }),
                          ReviewedDate: Now(),
                          // "archive only": saved with the decision; the reason (RV_Comment) goes to ReviewerComments for the email
                          ArchivedOnly: RV_ArchiveOnly.Value,
                          ReviewerComments: If(RV_ArchiveOnly.Value And Not(Coalesce(varReviewProject.ArchivedOnly, false)), Trim(varReviewComment), varReviewProject.ReviewerComments)
                      }
                  );
              // archive-only decision: the reason is also a note of the request (AV-CD-Notes), the email comes from the notification flow
              If(
                  RV_ArchiveOnly.Value And Not(Coalesce(varReviewProject.ArchivedOnly, false)),
                  IfError(
                      Patch(
                          'AV-CD-Notes',
                          Defaults('AV-CD-Notes'),
                          {
                              Title: varReviewProject.RequestNumber,
                              ParentRequest: varReviewProject.RequestNumber,
                              NoteText: "<b>Approved - archive only</b> · " & Substitute(Trim(varReviewComment), Char(10), "<br>"),
                              AuthorRole: {Value: "Administrator"},
                              AuthorName: User().FullName,
                              AuthorEmail: User().Email,
                              NoteDate: Now()
                          }
                      );
                      true,
                      Notify("The reason could not be added to the notes: " & FirstError.Message, NotificationType.Warning)
                  )
              );
                  Notify(
                      If(
                          RV_ArchiveOnly.Value And Not(Coalesce(varReviewProject.ArchivedOnly, false)),
                          "Approved as archive only. The reason is added to the notes and the requestor is notified.",
                          If(With(
                              {n: CountRows(RV_ChildrenGallery.AllItems), ok: CountRows(Filter(RV_ChildrenGallery.AllItems, MediaApproved = true))},
                              ok > 0 And ok < n
                          ), "Request partially approved: only the ticked media files are approved.", "Request approved.")
                      ),
                      NotificationType.Success
                  );
                  Set(varReviewProject, Blank());
                  Set(varReviewComment, "");
                  // reload the queue from SharePoint so the handled request leaves or updates
                  Refresh('AV-CD-Requests');
                  ClearCollect(colRevReqs, 'AV-CD-Requests');
                  // RequestManagementScreen reloads on its next visit too
                  Set(varReqDataLoaded, false),
                  Notify("Approve failed: " & FirstError.Message, NotificationType.Error)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: =If(RV_ArchiveOnly.Value, "✓  Approve · Archive", "✓  Approve")
            Visible: =Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
            Width: =200
            X: =460
            Y: =720
