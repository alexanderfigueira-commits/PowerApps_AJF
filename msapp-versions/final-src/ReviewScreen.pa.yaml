      - RV_ChildrenGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =248
            Items: |-
              =If(
                  IsBlank(varReviewProject),
                  Filter('AV-CD-Mediafiles', 1 = 2),
                  Sort(
                      Filter('AV-CD-Mediafiles', ParentRequest = varReviewProject.RequestNumber),
                      Created, SortOrder.Descending
                  )
              )
            ShowNavigation: =true
            TemplateSize: =100
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =216
          Children:
            - RV_CRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
