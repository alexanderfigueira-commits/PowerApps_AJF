            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Text: ="Assignee / Co-assignee                                        "
            Visible: =Not(IsBlank(varReviewProject))
            Width: =800
            X: =454
            Y: =484
      - RV_ArchiveOnly:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Default: =Coalesce(varReviewProject.ArchivedOnly, false)
            DisplayMode: =If(varUserRole = "ADMINISTRATOR" And Coalesce(varReviewProject.Status.Value, "") = "Processing", DisplayMode.Edit, DisplayMode.View)
            Font: =Font.'Open Sans'
            Height: =48
            HoverColor: =RGBA(0, 18, 107, 1)
            Size: =10
            Text: |-
              ="Archive only: the conditions for publication are not met"
            Visible: =Not(IsBlank(varReviewProject)) And varUserRole = "ADMINISTRATOR"
            Width: =470
            X: =870
            Y: =506
      - RV_Assignee:
          Control: Classic/ComboBox@2.4.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            DefaultSelectedItems: |-
              =// only what is saved on the request: the assignee, then the co-assignee (no default from the DG contact)
              Filter(
                  Table(
                      {DisplayName: Coalesce(varReviewProject.Assignee.DisplayName, ""), Mail: Coalesce(varReviewProject.Assignee.Email, "")},
                      {DisplayName: Coalesce(varReviewProject.CoAssignee.DisplayName, ""), Mail: Coalesce(varReviewProject.CoAssignee.Email, "")}
                  ),
                  Not(IsBlank(DisplayName))
              )
            DisplayFields: =["DisplayName"]
            DisplayMode: =If(varUserRole = "ADMINISTRATOR", DisplayMode.Edit, DisplayMode.View)
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            InputTextPlaceholder: |-
              ="Search people: assignee, and co-assignee when needed (max 2)…"
            Items: |-
              =Office365Users.SearchUserV2({searchTerm: Self.SearchText, top: 20}).value
            OnChange: |-
              =// saves as soon as the selection changes (this replaces the Assign button)
              With(
                  {
                      sel: Self.SelectedItems,
                      id: varReviewProject.ID,
                      oldA: Lower(Coalesce(varReviewProject.Assignee.Email, "")),
                      oldC: Lower(Coalesce(varReviewProject.CoAssignee.Email, ""))
                  },
                  If(
                      CountRows(sel) > 2,
                      Notify("Only two people can be assigned: an assignee and a co-assignee.", NotificationType.Warning);
                      Reset(Self),
                      With(
                          // the saved assignee stays the assignee while still picked; otherwise the first person picked
                          {a: If(oldA <> "" And Not(IsBlank(LookUp(sel, Lower(Mail) = oldA))), LookUp(sel, Lower(Mail) = oldA), First(sel))},
                          With(
                              {c: First(Filter(sel, Lower(Mail) <> Lower(Coalesce(a.Mail, ""))))},
                              If(
                                  Lower(Coalesce(a.Mail, "")) <> oldA Or Lower(Coalesce(c.Mail, "")) <> oldC,
                                  IfError(
                                      Patch(
                                          'AV-CD-Requests',
                                          LookUp('AV-CD-Requests', ID = id),
                                          {
                                              Assignee: If(IsBlank(a.Mail), Blank(), {Claims: "i:0#.f|membership|" & Lower(a.Mail), DisplayName: a.DisplayName, Email: a.Mail, Department: "", JobTitle: "", Picture: ""}),
                                              CoAssignee: If(IsBlank(c.Mail), Blank(), {Claims: "i:0#.f|membership|" & Lower(c.Mail), DisplayName: c.DisplayName, Email: c.Mail, Department: "", JobTitle: "", Picture: ""})
                                          }
                                      );
                                      Notify(
                                          "Assignment saved: " & Coalesce(a.DisplayName, "no assignee") & If(IsBlank(c.DisplayName), "", " + " & c.DisplayName & " (co-assignee)") & ". A new assignee receives an email.",
                                          NotificationType.Success
                                      );
                                      Refresh('AV-CD-Requests');
                                      ClearCollect(colRevReqs, 'AV-CD-Requests');
                                      // keep the same request open, now with the new assignment
                                      Set(varReviewProject, LookUp(colRevReqs, ID = id));
                                      Set(varReqDataLoaded, false),
                                      Notify("Assign failed: " & FirstError.Message, NotificationType.Error)
                                  )
                              )
                          )
                      )
                  )
              )
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SearchFields: =["DisplayName"]
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Size: =11
            Visible: =Not(IsBlank(varReviewProject))
            Width: =380
            X: =460
            Y: =512
