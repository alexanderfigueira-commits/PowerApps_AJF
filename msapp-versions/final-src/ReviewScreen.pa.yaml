Screens:
  ReviewScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varReviewProject, Blank());
        Set(varReviewComment, "");
        Set(varReviewQueueMine, Coalesce(varReviewMineOnly, false));
        Set(varReviewMineOnly, false);
        ClearCollect(colRevReqs, AVCentralDepositRequests)
    Children:
      - RV_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =52
            Width: =1366
      - RV_QueuePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =840
            Width: =430
            Y: =52
      - RV_QueueTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =14
            Text: ="Submitted requests  (" & Text(CountRows(RV_QueueGallery.AllItems)) & ")"
            Width: =400
            X: =16
            Y: =60
      - RV_QueueDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =430
            Y: =104
      - RV_QueueGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =786
            Items: |-
              =Sort(
                  Filter(colRevReqs,
                      If(varReviewQueueMine, Status.Value = "Pending", Status.Value = "Pending"),
                      Not(varReviewQueueMine) Or Not(IsEmpty(Filter(DG_Agency_Contact, Lower(Email) = Lower(User().Email)))),
                      Lower('Created By'.Email) <> Lower(User().Email)
                  ),
                  Modified, SortOrder.Descending
              )
            TemplateSize: =72
            Width: =430
            Y: =106
          Children:
            - RV_QRowBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =71
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(varReviewProject, ThisItem);
                    Set(varReviewComment, "")
                  Width: =430
            - RV_QRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Width: =430
                  Y: =71
            - RV_QRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  OnSelect: =Select(Parent)
                  Text: =Coalesce(ThisItem.RequestTitle, "Untitled request")
                  Width: =390
                  X: =20
                  Y: =10
            - RV_QRowMeta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =Coalesce(ThisItem.DG.Value, "—") & "  ·  " & Coalesce(First(ThisItem.DG_Agency_Contact).DisplayName, "—")
                  Width: =390
                  X: =20
                  Y: =38
      - RV_DetailPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
