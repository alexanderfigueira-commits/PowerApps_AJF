            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            DefaultSelectedItems: |-
              =ForAll(varReviewProject.DG_Agency_Contact As p, {DisplayName: p.DisplayName, Mail: p.Email})
            DisplayFields: =["DisplayName"]
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            InputTextPlaceholder: ="Search people to add as assignee…"
            Items: |-
              =Office365Users.SearchUserV2({searchTerm: Self.SearchText, top: 20}).value
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SearchFields: =["DisplayName"]
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Visible: =Not(IsBlank(varReviewProject))
            Width: =380
            X: =460
            Y: =432
      - RV_OwnerEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =Coalesce(First(varReviewProject.Contractor_Contact).DisplayName, "—")
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            HintText: ="Contractor contact"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =Not(IsBlank(varReviewProject))
            Width: =380
            X: =860
            Y: =432
      - RV_DetailDivider3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =484
      - RV_LblComment:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: ="Reviewer comment  (required to reject)"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =600
            X: =460
            Y: =496
      - RV_Comment:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =Coalesce(varReviewComment, "")
            Font: =Font.'Open Sans'
            Height: =100
            HintText: ="Explain what needs to be corrected before the project can be approved."
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Mode: =TextMode.MultiLine
            OnChange: =Set(varReviewComment, Self.Text)
            Visible: =Not(IsBlank(varReviewProject))
            Width: =880
            X: =460
            Y: =524
      - RV_ExistingComment:
          Control: Label@2.5.1
