Screens:
  PrintPodcastDetailScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =// media rows of the request chosen on HomePrintScreen (delegable filter)
        ClearCollect(
            colPrintReqMedia,
            Sort(
                Filter('AV-CD-Mediafiles', ParentRequest = varPrintRequest.RequestNumber),
                ID,
                SortOrder.Ascending
            )
        );
        UpdateContext({locPrintPage: 1})
    Children:
      - PPoD_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =56
            Width: =1366
      - PPoD_PodVal0:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(IsBlank(First(colPrintReqMedia).ProductionTitle), RGBA(150, 155, 165, 1), RGBA(30, 34, 44, 1))
            Font: =Font.'Open Sans'
            Height: =15
            PaddingBottom: =0
            PaddingTop: =0
            Size: =9
            Text: =If(IsBlank(First(colPrintReqMedia).ProductionTitle), "Not provided", First(colPrintReqMedia).ProductionTitle)
            Visible: =Not(IsBlank(First(colPrintReqMedia).ProductionTitle))
            Width: =1094
            X: =240
            Y: =218
      - PPoD_PodVal1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(IsBlank(Trim(PlainText(First(colPrintReqMedia).Description))), RGBA(150, 155, 165, 1), RGBA(30, 34, 44, 1))
            Font: =Font.'Open Sans'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =9
            Text: |-
              =// rich-text column: show the text only, without the HTML
              With(
                  {plain: Trim(PlainText(First(colPrintReqMedia).Description))},
                  If(IsBlank(plain), "Not provided", plain)
              )
            Visible: =Not(IsBlank(Trim(PlainText(First(colPrintReqMedia).Description))))
            Width: =1094
            X: =240
            Y: =PPoD_PodVal0.Y + If(PPoD_PodVal0.Visible, PPoD_PodVal0.Height, 0)
      - PPoD_BtnBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(60, 66, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Back()
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="← Back"
            Visible: =Not(locPrinting)
            Width: =100
            X: =32
            Y: =68
      - PPoD_Heading:
