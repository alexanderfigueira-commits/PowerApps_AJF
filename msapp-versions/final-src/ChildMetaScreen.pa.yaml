                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: |-
                    =If(varChildMediaType = "Photo", "Contractor / Agency *",
                       If(varChildMediaType = "Podcast", "Director, Motion Designer, Photographer",
                          If(varChildMediaType = "Video", "Director, Motion Designer, Photographer", "Director / producer *")))
                  Width: =If(varChildMediaType = "Podcast", 390, 500)
                  X: =If(varChildMediaType = "Photo", 588, If(varChildMediaType = "Video", 56, If(varChildMediaType = "Podcast", 896, 500)))
                  Y: =If(varChildMediaType = "Photo", 394, If(varChildMediaType = "Video", 476, If(varChildMediaType = "Podcast", 526, 122)))
            - CM_Credits:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: =varChildCredits1
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  HintText: |-
                    =If(varChildMediaType = "Photo", "Contractor or agency name",
                       If(varChildMediaType = "Podcast", "precise names + function",
                          If(varChildMediaType = "Video", "precise names + function", "Director and/or producer name")))
