                  HoverFill: =RGBA(186, 202, 226, 1)
                  OnChange: =Set(varChildCredits1, Self.Text)
                  Width: =If(varChildMediaType = "Podcast", 390, 500)
                  X: =If(varChildMediaType = "Photo", 588, If(varChildMediaType = "Video", 56, If(varChildMediaType = "Podcast", 896, 500)))
                  Y: =If(varChildMediaType = "Photo", 420, If(varChildMediaType = "Video", 502, If(varChildMediaType = "Podcast", 552, 148)))
