            FontWeight: =FontWeight.Semibold
            Size: =12
            Text: |-
              =With(
                  {miss:
                      Concat(
                          Filter(
                              Table(
                              {lbl: CM_LblProdEnd.Text, gone: CM_LblProdEnd.Visible And IsBlank(CM_ProdEnd.SelectedDate)},
                              {lbl: CM_LblPubStartV.Text, gone: CM_LblPubStartV.Visible And IsBlank(CM_PubStartV.SelectedDate)},
                              {lbl: CM_LblPubEndV.Text, gone: CM_LblPubEndV.Visible And IsBlank(CM_PubEndV.SelectedDate)},
                              {lbl: CM_LblSeasonNumber.Text, gone: CM_LblSeasonNumber.Visible And IsBlank(Trim(CM_SeasonNumber.Text))},
                              {lbl: CM_LblEpisodeNumber.Text, gone: CM_LblEpisodeNumber.Visible And IsBlank(Trim(CM_EpisodeNumber.Text))},
                              {lbl: CM_LblEpisodeTitleP.Text, gone: CM_LblEpisodeTitleP.Visible And IsBlank(Trim(CM_EpisodeTitleP.Text))},
                              {lbl: CM_LblEpisodeSummary.Text, gone: CM_LblEpisodeSummary.Visible And IsBlank(Trim(CM_EpisodeSummary.Text))},
                              {lbl: CM_LblCaptions.Text, gone: CM_LblCaptions.Visible And IsBlank(Trim(CM_Caption.Text))},
                              {lbl: CM_LblLanguage.Text, gone: CM_LblLanguage.Visible And IsEmpty(CM_Language.SelectedItems)},
                              {lbl: CM_LblAuthority.Text, gone: CM_LblAuthority.Visible And IsBlank(Trim(CM_Authority.Text))},
                              {lbl: CM_LblProducer.Text, gone: CM_LblProducer.Visible And IsEmpty(CM_Producer.SelectedItems)}
                              ),
                              gone
                          ),
                          ", " & Trim(Substitute(lbl, "*", ""))
                      )
                  },
                  If(IsBlank(miss), "", "Still to complete:  " & Mid(miss, 3))
              )
