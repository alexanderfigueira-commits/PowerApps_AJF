      - CM_FormAudioFiles:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DataSource: ='AV-CD-Mediafiles'
            DefaultMode: =If(varRequestorLocked, FormMode.View, FormMode.Edit)
            Height: =420
            Item: |-
              =If(
                  IsBlank(varAttachRecord),
                  Defaults('AV-CD-Mediafiles'),
                  varAttachRecord
              )
            NumberOfColumns: =1
            OnFailure: |-
              =// not submitted: Save Media submits CL_FormAttach, which saves these files too
              false
            OnSuccess: |-
              =// not submitted: Save Media submits CL_FormAttach, which saves these files too
              false
            Visible: =locShowAudioFiles And varChildMediaType = "Podcast"
            Width: =484
            X: =862
            Y: =If(IsBlank(varAttachRecord), 278, 250)
            ZIndex: =40
          Children:
            - CM_DCAudId:
                Control: TypedDataCard@1.0.7
                Variant: BlankCard
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DisplayMode: =Parent.DisplayMode
                  Height: =44
                  Visible: =false
                  Width: =484
                  X: =0
                  Y: =0
                Children:
                  - CM_DCAudIdKey:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =32
                        Size: =12
                        Text: ="ID"
                        Width: =60
                        Wrap: =false
                        X: =15
                        Y: =6
                  - CM_DCAudIdValue:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(60, 66, 80, 1)
                        Font: =Font.'Open Sans'
                        Height: =32
                        Size: =12
                        Text: =If(IsBlank(ThisItem.ID), "—", Text(ThisItem.ID))
                        Width: =Parent.Width - 96
                        Wrap: =false
                        X: =80
                        Y: =6
            - CM_DCAudioFiles:
                Control: TypedDataCard@1.0.7
                Variant: ClassicAttachmentsEdit
                IsLocked: true
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataField: ="{Attachments}"
                  Default: =ThisItem.Attachments
                  DisplayMode: =If(IsBlank(varAttachRecord), DisplayMode.Disabled, Parent.DisplayMode)
                  DisplayName: =DataSourceInfo([@'AV-CD-Mediafiles'],DataSourceInfo.DisplayName,Attachments)
                  Height: =360
                  Required: =false
                  Update: =CM_AudioFiles.Attachments
                  Width: =484
                  X: =0
                  Y: =1
                Children:
                  - CM_DCAudioFilesKey:
                      Control: Label@2.5.1
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =34
                        Size: =12
                        Text: |-
                          ="Audio file(s): MP3, WAV, M4A or AAC"
                        Width: =Parent.Width - 32
                        Wrap: =false
                        X: =16
                        Y: =6
                  - CM_AudioFiles:
                      Control: Attachments@2.3.0
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =RGBA(220, 224, 230, 1)
                        DisplayMode: =Parent.DisplayMode
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        Height: =280
                        HoverFill: =RGBA(186, 202, 226, 1)
                        ItemColor: =RGBA(255, 255, 255, 1)
                        ItemFill: =RGBA(56, 96, 178, 1)
                        ItemHoverFill: =RGBA(186, 202, 226, 1)
                        Items: |-
                          =// only this kind of file; the item's other files stay in the Legal & Docs panel
                          Filter(Parent.Default, EndsWith(Lower(DisplayName), ".mp3") Or EndsWith(Lower(DisplayName), ".wav") Or EndsWith(Lower(DisplayName), ".m4a") Or EndsWith(Lower(DisplayName), ".aac"))
                        MaxAttachments: =3
                        PaddingBottom: =5
                        PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        Size: =12
                        Tooltip: =Parent.DisplayName
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =42
                  - CM_DCAudioFilesError:
                      Control: Label@2.5.1
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(168, 0, 0, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =CM_AudioFiles.Y + CM_AudioFiles.Height
                  - CM_DCAudioFilesStar:
                      Control: Label@2.5.1
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =CM_DCAudioFilesKey.Height
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =CM_DCAudioFilesKey.Y
