Screens:
  ChildMetaScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(
            varRequestorLocked,
            varUserRole <> "ADMINISTRATOR"
            And Coalesce(varCurrentRequest.Status.Value, "") = "Processing"
        );
        Set(varNavArm, "");
        If(varChildMediaType = "Video" And varVideoMetaChildId <> varCurrentChildId,
            Set(varVideoMetaChildId, varCurrentChildId);
            Set(varChildProducer, "");
            Set(varChildExecProducer, "");
            Set(varChildScript, "");
            Set(varChildSubtitlesProvided, false));
        If(varChildMediaType = "Podcast" And varPodMetaChildId <> varCurrentChildId,
            Set(varPodMetaChildId, varCurrentChildId);
            Set(varChildProducer, "");
            Set(varChildExecProducer, ""));
        // the attachments panel (CL_FormAttach) edits a snapshot of the open media item;
        // taken here too so the file lists on this tab show the right item
        If(
            Coalesce(varAttachRecord.ID, 0) <> Coalesce(varCurrentChildSPId, 0),
            Set(varAttachRecord, LookUp('AV-CD-Mediafiles', ID = Coalesce(varCurrentChildSPId, 0)))
        )
    Children:
      - CM_Back:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(186, 202, 226, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: |-
              =Navigate(RequesDetailScreen, ScreenTransition.None, {locShowTypePicker: false, locResetContacts: false})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="←  Back to request"
            Width: =180
            X: =16
            Y: =10
      - CM_Breadcrumb:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =52
            Text: =" /  " & Coalesce(varRequestTitle, "Request") & "  /  " & If(IsBlank(varChildTitle) Or varChildTitle = "", "New archive", varChildTitle)
