Screens:
  Dashboard-Ope-Requestor:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// role and data are set here too: this can be the start screen, so it must not
        // rely on App.OnStart having finished
        Set(varUserRole, Coalesce(LookUp('AV-CD-RolesPermissionsList', UserEmail.Email = User().Email, Role.Value), "REQUESTOR"));
        Refresh('AV-CD-Requests');
        // the requestor's own requests, all statuses (delegable filter)
        ClearCollect(colOpeReqs, Filter('AV-CD-Requests', 'Created By'.Email = User().Email));
        // the requestor's media items, for the TODO bell (delegable filter)
        ClearCollect(colOpeMedia, Filter('AV-CD-Mediafiles', 'Created By'.Email = User().Email))
