            - DOR_List1RowBell:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: |-
                    =// days left to the publication date of the request's media items (PublicationStartDate)
                    With(
                        {dated: Sort(Filter(colOpeMedia, ParentRequest = ThisItem.RequestNumber And Not(IsBlank(PublicationStartDate))), PublicationStartDate, SortOrder.Ascending)},
                        With(
                            {
                                m: If(
                                    IsEmpty(Filter(dated, PublicationStartDate >= Today())),
                                    Last(dated),                                 // every date is past: the latest
                                    First(Filter(dated, PublicationStartDate >= Today()))  // else the next one
                                )
                            },
                            If(
                                IsBlank(m),
                                "No publication date yet",
                                With(
                                    {
                                        days: DateDiff(Today(), m.PublicationStartDate, TimeUnit.Days),
                                        what: "Publication date"
                                    },
                                    what & ": " & Text(m.PublicationStartDate, "dd mmm 'yy") & "  ·  "
                                    & If(
                                        days > 1, days & " days left",
                                        days = 1, "1 day left",
                                        days = 0, "today",
                                        days = -1, "1 day ago",
                                        -days & " days ago"
                                    )
                                )
                            )
                        )
                    )
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =// red: fewer than 7 days left (today and past dates included); navy: 7 or more;
                    // grey: no publication date. Same date as the tooltip: the next one, else the latest past one.
                    With(
                        {dated: Sort(Filter(colOpeMedia, ParentRequest = ThisItem.RequestNumber And Not(IsBlank(PublicationStartDate))), PublicationStartDate, SortOrder.Ascending)},
                        With(
                            {
                                m: If(
                                    IsEmpty(Filter(dated, PublicationStartDate >= Today())),
                                    Last(dated),
                                    First(Filter(dated, PublicationStartDate >= Today()))
                                )
                            },
                            If(
                                IsBlank(m), RGBA(166, 166, 166, 1),
                                DateDiff(Today(), m.PublicationStartDate, TimeUnit.Days) < 7, Color.Red,
                                RGBA(0, 18, 107, 1)
                            )
                        )
                    )
