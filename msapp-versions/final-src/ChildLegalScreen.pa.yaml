      - CL_FormAttach:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DataSource: ='AV-CD-Mediafiles'
            DefaultMode: =If(varRequestorLocked, FormMode.View, FormMode.Edit)
            Height: =420
            Item: |-
              =If(
                  IsBlank(varAttachRecord),
                  Defaults('AV-CD-Mediafiles'),
                  varAttachRecord
              )
            NumberOfColumns: =1
            OnFailure: |-
              =// Stop: stay on the Validations tab. The other fields were already Patched
              // and the staged files are still in the form, so Save Media can be retried.
              Notify(
                  "The media details were saved, but the attachments were not: " & CL_FormAttach.Error & "  Press Save Media to try again.",
                  NotificationType.Error
              )
            OnSuccess: |-
              =Notify("Media and attachments saved to SharePoint.", NotificationType.Success);
              // re-read the item so the form lists the saved files
              Refresh('AV-CD-Mediafiles');
              Set(varAttachRecord, LookUp('AV-CD-Mediafiles', ID = Coalesce(varCurrentChildSPId, 0)));
              // the same finish CV_BtnSaveArchive has always had
              Set(varRequestMediaType, "");
              Set(varConfirmed, false);
              Navigate(RequesDetailScreen, ScreenTransition.None, {locShowTypePicker: false, locResetContacts: false})
            Width: =484
            X: =862
            Y: =If(IsBlank(varAttachRecord), 278, 250)
          Children:
            - CL_DCId:
                Control: TypedDataCard@1.0.7
                Variant: BlankCard
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DisplayMode: =Parent.DisplayMode
                  Height: =44
                  Visible: =false
                  Width: =484
                  X: =0
                  Y: =0
                Children:
                  - CL_DCIdKey:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =32
                        Size: =12
                        Text: ="ID"
                        Width: =60
                        Wrap: =false
                        X: =15
                        Y: =6
                  - CL_DCIdValue:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(60, 66, 80, 1)
                        Font: =Font.'Open Sans'
                        Height: =32
                        Size: =12
                        Text: =If(IsBlank(ThisItem.ID), "—", Text(ThisItem.ID))
                        Width: =Parent.Width - 96
                        Wrap: =false
                        X: =80
                        Y: =6
            - CL_DCAttach:
                Control: TypedDataCard@1.0.7
                Variant: ClassicAttachmentsEdit
                IsLocked: true
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataField: ="{Attachments}"
                  Default: =ThisItem.Attachments
                  DisplayMode: =If(IsBlank(varAttachRecord), DisplayMode.Disabled, Parent.DisplayMode)
                  DisplayName: =DataSourceInfo([@'AV-CD-Mediafiles'],DataSourceInfo.DisplayName,Attachments)
                  Height: =360
                  Required: =false
                  Update: |-
                    =// CL_FormAttach is the only form that is submitted (Save Media). For podcasts the
                    // podcast visual (Info tab, CI_PodcastVisual) and the audio files (Metadata tab,
                    // CM_AudioFiles) are edited in their own forms; their changes are merged here so
                    // one SubmitForm saves every file and no form removes another form's files.
                    With(
                        {
                            podcast: varChildMediaType = "Podcast",
                            saved: varAttachRecord.Attachments.DisplayName,
                            here: CL_DCAttachValue.Attachments.Name
                        },
                        Ungroup(
                            Table(
                                // this panel's files, minus the podcast files removed on Info / Metadata
                                {files: Filter(
                                    CL_DCAttachValue.Attachments,
                                    Not(podcast)
                                        Or Not(Name in saved)
                                        Or (Not(EndsWith(Lower(Name), ".jpg") Or EndsWith(Lower(Name), ".jpeg") Or EndsWith(Lower(Name), ".png")) Or Name in CI_PodcastVisual.Attachments.Name)
                                            And (Not(EndsWith(Lower(Name), ".mp3") Or EndsWith(Lower(Name), ".wav") Or EndsWith(Lower(Name), ".m4a") Or EndsWith(Lower(Name), ".aac")) Or Name in CM_AudioFiles.Attachments.Name)
                                )},
                                // new files added on Info / Metadata
                                {files: Filter(CI_PodcastVisual.Attachments, podcast And Not(Name in saved) And Not(Name in here))},
                                {files: Filter(CM_AudioFiles.Attachments, podcast And Not(Name in saved) And Not(Name in here))}
                            ),
                            files
                        )
                    )
                  Width: =484
                  X: =0
                  Y: =1
                Children:
                  - CL_DCAttachKey:
                      Control: Label@2.5.1
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =34
                        Size: =12
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 32
                        Wrap: =false
                        X: =16
                        Y: =6
                  - CL_DCAttachValue:
                      Control: Attachments@2.3.0
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        DisplayMode: =Parent.DisplayMode
                        Font: =Font.'Open Sans'
                        Height: =280
                        HoverFill: =RGBA(186, 202, 226, 1)
                        ItemColor: =RGBA(255, 255, 255, 1)
                        ItemFill: =RGBA(56, 96, 178, 1)
                        ItemHoverFill: =RGBA(186, 202, 226, 1)
                        Items: =Parent.Default
                        PaddingBottom: =5
                        PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        Size: =12
                        Tooltip: =Parent.DisplayName
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =42
                  - CL_DCAttachError:
                      Control: Label@2.5.1
                      MetadataKey: ErrorMessage
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(168, 0, 0, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =10
                        Live: =Live.Assertive
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =Parent.Error
                        Visible: =Parent.DisplayMode=DisplayMode.Edit
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =CL_DCAttachValue.Y + CL_DCAttachValue.Height
                  - CL_DCAttachStar:
                      Control: Label@2.5.1
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        Height: =CL_DCAttachKey.Height
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Wrap: =false
                        Y: =CL_DCAttachKey.Y
