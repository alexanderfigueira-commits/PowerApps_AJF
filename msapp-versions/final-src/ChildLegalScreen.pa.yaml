Screens:
  ChildLegalScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(
            varRequestorLocked,
            varUserRole <> "ADMINISTRATOR"
            And Coalesce(varCurrentRequest.Status.Value, "") = "Processing"
        );
        Set(varNavArm, "");
        // The attachments form edits a snapshot of the open media item. It is
        // re-read only when a different item is open, so the Patch on Save
        // cannot reload the form and drop files staged but not yet saved.
        If(
            Coalesce(varAttachRecord.ID, 0) <> Coalesce(varCurrentChildSPId, 0),
            Set(varAttachRecord, LookUp('AV-CD-Mediafiles', ID = Coalesce(varCurrentChildSPId, 0)))
        );
        // CL_Case cannot be empty: with no case stored it shows its first item.
        // OnChange does not run when that item is simply accepted, so store it
        // here; Validations, the Case 1 checkboxes and Save then see the same value.
        If(
            IsBlank(varChildContractCase) Or varChildContractCase = "",
            Set(varChildContractCase, "Case 1 - framework / direct service contract")
        )
    Children:
      - CL_Breadcrumb:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =56
            Text: =" /  " & Coalesce(varRequestTitle, "Request") & "  /  " & If(IsBlank(varChildTitle) Or varChildTitle = "", "New archive", varChildTitle)
            Width: =700
            X: =200
      - HomeAppTitle_CL:
          Control: Label@2.5.1
          Group: Header_CL
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =18
            Text: ="Central Deposit"
            VerticalAlign: =VerticalAlign.Bottom
            Width: =180
            X: =264
            Y: =6
      - HomeUserName_CL:
          Control: Label@2.5.1
          Group: Header_CL
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Text: =User().FullName
            Width: =204
            X: =1103
            Y: =18
      - Logo_EC_CL:
          Control: Image@2.2.3
          Group: Header_CL
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =42
            Image: ='logo--en'
            PaddingLeft: =15
            Width: =170
            X: =16
            Y: =8
      - CD_Logo_CL:
          Control: Image@2.2.3
          Group: Header_CL
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =40
            Image: =cd_badge_play
            Width: =40
            X: =214
            Y: =8
      - CL_TabsBg:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =50
            Width: =1366
            Y: =52
      - CL_Tab1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(ChildInfoScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  1.  Info"
            Width: =150
            X: =16
            Y: =52
      - HeaderDivider_ChildLegalScreen:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(255, 255, 255, 0.35)
            Height: =30
            Width: =2
            X: =200
            Y: =13
      - CL_Tab2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(ChildMetaScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="✓  2.  Metadata"
            Width: =170
            X: =176
            Y: =52
      - CL_Tab3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(0, 18, 107, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(255, 255, 255, 1)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="3.  Legal & Docs"
            Width: =180
            X: =356
            Y: =52
      - CL_Tab3Line:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =3
            Width: =180
            X: =356
            Y: =99
      - CL_Tab4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(96, 104, 120, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(ChildValidScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="4.  Validations"
            Width: =170
            X: =546
            Y: =52
      - CL_BottomBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =56
            Width: =1366
            Y: =712
      - CL_BtnPrev:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(60, 66, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Navigate(ChildMetaScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="←  Previous"
            Width: =140
            X: =32
            Y: =720
      - HomeAppSubtitle_CL:
          Control: Label@2.5.1
          Group: Header_CL
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =22
            Size: =10
            Text: ="Ticket System"
            VerticalAlign: =VerticalAlign.Top
            X: =264
            Y: =30
      - CL_Gallery:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DelayItemLoading: =false
            Fill: =RGBA(247, 248, 250, 1)
            Height: =610
            Items: |-
              =[{id: 1}]
            LoadingSpinner: =LoadingSpinner.None
            TemplatePadding: =0
            TemplateSize: |-
              =// grows only with what is visible, so the panel scrolls only when it must
              260
              + If(Left(varChildContractCase, 6) = "Case 1", 140, 0)
              + If(varChildModelRelease, 30, 0)
              + If(
                  varChildMediaType = "Video" Or varChildMediaType = "Podcast",
                  64 + If(varChildMusicUsed, 30, 0) + If(varChildPreexisting, 30, 0),
                  0
              )
              + If(varChildMediaType = "Video", 32 + If(varChildSubtitlesProvided, 120, 0), 0)
            Width: =846
            Y: =102
          Children:
            - CL_Banner:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(147, 197, 253, 1)
                  BorderThickness: =1
                  Fill: =RGBA(239, 246, 255, 1)
                  Height: =36
                  Width: =810
                  X: =24
                  Y: =8
            - CL_BannerText:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(30, 64, 175, 1)
                  Font: =Font.'Open Sans'
                  Height: =36
                  Size: =12
                  Text: ="Select the contract case, confirm the rights flags, then attach the legal documents in the panel on the right."
                  Width: =809
                  X: =30
                  Y: =8
            - CL_LblCase:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  Size: =16
                  Text: ="Contract case *"
                  Width: =600
                  X: =24
                  Y: =54
            - CL_Case:
                Control: Classic/DropDown@2.3.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  ChevronBackground: =RGBA(56, 96, 178, 1)
                  ChevronFill: =RGBA(255, 255, 255, 1)
                  ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  ChevronHoverFill: =RGBA(255, 255, 255, 1)
                  Default: =varChildContractCase
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Items: |-
                    =[
                        "Case 1 - framework / direct service contract",
                        "Case 2 - specific service contract",
                        "Case 3 - co-production agreement",
                        "Case 4 - acquisition of existing material",
                        "Case 5 - internal EU production",
                        "Case 6 - donation / free licence"
                    ]
                  Items.Value: =Value
                  OnChange: =Set(varChildContractCase, Self.Selected.Value)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 18, 107, 1)
                  SelectionColor: =RGBA(255, 255, 255, 1)
                  SelectionFill: =RGBA(56, 96, 178, 1)
                  Width: =560
                  X: =24
                  Y: =82
            - CL_LblCase1Sub:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="Case 1 — required documents"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =520
                  X: =24
                  Y: =130
            - CL_Divider1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 232, 238, 1)
                  Height: =1
                  Width: =798
                  X: =24
                  Y: =If(Left(varChildContractCase, 6) = "Case 1", 274, 134)
            - CL_LblRights:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  Size: =16
                  Text: ="Rights & declarations"
                  Width: =600
                  X: =24
                  Y: =CL_Divider1.Y + 10
            - CL_ChkNoThirdParty:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =varChildNoThirdParty
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildNoThirdParty, true)
                  OnUncheck: =Set(varChildNoThirdParty, false)
                  Text: ="No third-party rights in this production"
                  Width: =780
                  X: =20
                  Y: =CL_LblRights.Y + 30
            - CL_ChkModel:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildModelRelease, true)
                  OnUncheck: =Set(varChildModelRelease, false); Set(varChildModelReleaseProvided, false)
                  Text: ="Recognisable private persons appear in this production"
                  Width: =780
                  X: =20
                  Y: =CL_ChkNoThirdParty.Y + CL_ChkNoThirdParty.Height
            - CL_ChkModelProvided:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildModelReleaseProvided, true)
                  OnUncheck: =Set(varChildModelReleaseProvided, false)
                  Text: ="  ↳  Model release form(s) provided (attach on the right)"
                  Visible: =varChildModelRelease
                  Width: =700
                  X: =44
                  Y: =CL_ChkModel.Y + CL_ChkModel.Height
            - CL_ChkMusic:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildMusicUsed, true)
                  OnUncheck: =Set(varChildMusicUsed, false); Set(varChildMusicLicenceProvided, false)
                  Text: ="This production contains music (original or licensed)"
                  Visible: =varChildMediaType = "Video" Or varChildMediaType = "Podcast"
                  Width: =780
                  X: =20
                  Y: =CL_ChkModelProvided.Y + If(CL_ChkModelProvided.Visible, CL_ChkModelProvided.Height, 0)
            - CL_ChkMusicProvided:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildMusicLicenceProvided, true)
                  OnUncheck: =Set(varChildMusicLicenceProvided, false)
                  Text: ="  ↳  Music licence / annex provided (attach on the right)"
                  Visible: =(varChildMediaType = "Video" Or varChildMediaType = "Podcast") And varChildMusicUsed
                  Width: =700
                  X: =44
                  Y: =CL_ChkMusic.Y + If(CL_ChkMusic.Visible, CL_ChkMusic.Height, 0)
            - CL_ChkPreexisting:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildPreexisting, true)
                  OnUncheck: =Set(varChildPreexisting, false); Set(varChildPreexistingProvided, false)
                  Text: ="Production contains pre-existing rights material"
                  Visible: =varChildMediaType = "Video" Or varChildMediaType = "Podcast"
                  Width: =780
                  X: =20
                  Y: =CL_ChkMusicProvided.Y + If(CL_ChkMusicProvided.Visible, CL_ChkMusicProvided.Height, 0)
            - CL_ChkPreexistingProvided:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildPreexistingProvided, true)
                  OnUncheck: =Set(varChildPreexistingProvided, false)
                  Text: ="  ↳  Pre-existing rights annex(es) provided (attach on the right)"
                  Visible: =(varChildMediaType = "Video" Or varChildMediaType = "Podcast") And varChildPreexisting
                  Width: =700
                  X: =44
                  Y: =CL_ChkPreexisting.Y + If(CL_ChkPreexisting.Visible, CL_ChkPreexisting.Height, 0)
            - CL_Divider2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 232, 238, 1)
                  Height: =1
                  Width: =798
                  X: =24
                  Y: =CL_VTTUpload.Y + If(CL_VTTUpload.Visible, CL_VTTUpload.Height, 0) + 8
            - CL_ChkSubtitles:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varChildSubtitlesProvided, true)
                  OnUncheck: =Set(varChildSubtitlesProvided, false)
                  Text: ="Subtitles are provided for this production (VTT format)"
                  Visible: =varChildMediaType = "Video"
                  Width: =780
                  X: =20
                  Y: =CL_ChkPreexistingProvided.Y + If(CL_ChkPreexistingProvided.Visible, CL_ChkPreexistingProvided.Height, 0)
            - CL_LblVTT:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(60, 66, 80, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Text: ="VTT subtitle file(s) *   - attach them in the panel on the right (VTT only, SRT is not accepted)"
                  Visible: =varChildMediaType = "Video" And varChildSubtitlesProvided
                  Width: =780
                  X: =24
                  Y: =CL_ChkSubtitles.Y + If(CL_ChkSubtitles.Visible, CL_ChkSubtitles.Height, 0)
            - CL_VTTUpload:
                Control: Attachments@2.3.0
                Properties:
                  BorderColor: =RGBA(220, 224, 230, 1)
                  DisplayMode: =DisplayMode.View
                  Font: =Font.'Open Sans'
                  Height: =96
                  HoverFill: =RGBA(186, 202, 226, 1)
                  ItemColor: =RGBA(255, 255, 255, 1)
                  ItemFill: =RGBA(56, 96, 178, 1)
                  ItemHoverFill: =RGBA(186, 202, 226, 1)
                  Items: =Filter(CL_DCAttachValue.Attachments, EndsWith(Lower(Name), ".vtt"))
                  Items.Name: =Name
                  Items.Value: =Value
                  MaxAttachments: =5
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 18, 107, 1)
                  Visible: =varChildMediaType = "Video" And varChildSubtitlesProvided
                  Width: =780
                  X: =24
                  Y: =CL_LblVTT.Y + If(CL_LblVTT.Visible, 24, 0)
            - CL_ChkFramework:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =varDocFramework
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varDocFramework, true)
                  OnUncheck: =Set(varDocFramework, false)
                  Text: ="Signed framework contract *"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =560
                  X: =20
                  Y: =152
            - CL_ChkSpecific:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =varDocSpecific
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varDocSpecific, true)
                  OnUncheck: =Set(varDocSpecific, false)
                  Text: ="Signed specific contract *"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =560
                  X: =20
                  Y: =182
            - CL_ChkOffer:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =varDocOffer
                  DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: =Set(varDocOffer, true)
                  OnUncheck: =Set(varDocOffer, false)
                  Text: ="Offer (optional)"
                  Visible: =Left(varChildContractCase, 6) = "Case 1"
                  Width: =560
                  X: =20
                  Y: =212
            - CL_LblCase1Req:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(200, 30, 30, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: ="⚠  Both mandatory contracts must be confirmed"
                  Visible: =Left(varChildContractCase, 6) = "Case 1" And (Not(varDocFramework) Or Not(varDocSpecific))
                  Width: =700
