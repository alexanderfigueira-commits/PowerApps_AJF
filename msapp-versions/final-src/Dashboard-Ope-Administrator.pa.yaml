      - DOA_List1Gallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =503
            Items: |-
              =// oldest first: every Pending request, then every Processing request.
              // One Sort with a two-part key (status group, then seconds since 2000), so the
              // rows stay request records and ThisItem.Status works in the row badge.
              Sort(
                  Filter(colOpeReqs, Status.Value = "Processing" Or Status.Value = "Pending"),
                  If(Status.Value = "Processing", 0, 10000000000)
                      + DateDiff(DateTime(2000, 1, 1, 0, 0, 0), Modified, TimeUnit.Seconds),
                  SortOrder.Ascending
              )
            ShowNavigation: =true
            ShowScrollbar: =false
            TemplateSize: =86
            Width: =400
            X: =56
            Y: =184
          Children:
            - DOA_List1RowSelect:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(241, 244, 249, 1)
                  Height: =75
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: =
                  Width: =400
            - DOA_List1RowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 232, 238, 1)
                  Height: =1
                  Width: =400
                  Y: =75
            - DOA_List1RowMeta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  DisplayMode: =DisplayMode.Disabled
                  Font: =Font.'Open Sans'
                  Height: =22
                  OnSelect: =Select(Parent)
                  Overflow: =Overflow.Scroll
                  Size: =8
                  Text: =Coalesce(ThisItem.'Created By'.DisplayName, "—")
                  Tooltip: ="Created by"
                  Width: =201
                  X: =123
                  Y: =51
            - DOA_List1RowDate:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(77, 77, 77, 1)
                  DisplayMode: =DisplayMode.View
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  OnSelect: =Select(Parent)
                  Size: =8
                  Text: =Text(ThisItem.SubmittedOn, "dd mmm 'yy")
                  Tooltip: |+
                    ="Submitted on:  " 
                    & Char(10) 
                    & Text(ThisItem.Modified, "dd mmm 'yy  (hh:mm)")

                  Width: =70
                  Y: =53
            - DOA_List1RowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DisabledColor: =RGBA(116, 116, 116, 1)
                  DisplayMode: =DisplayMode.Disabled
                  Font: =Font.'Open Sans'
                  Height: =47
                  OnSelect: =Select(Parent)
                  Overflow: =Overflow.Scroll
                  Size: =10
                  Text: =If(IsBlank(ThisItem.RequestTitle), "Untitled", ThisItem.RequestTitle)
                  Tooltip: ="Title"
                  Width: =268
                  X: =123
                  Y: =4
            - DOA_List1RowNumber:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =RGBA(77, 77, 77, 1)
                  DisabledBorderColor: =Self.BorderColor
                  DisabledColor: =RGBA(77, 77, 77, 1)
                  DisabledFill: =RGBA(215, 223, 240, 1)
                  Fill: =RGBA(215, 223, 240, 1)
                  Font: =Font.'Open Sans'
                  Height: =29
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(99, 96, 178, 1), -20%)
                  OnSelect: |-
                    =// open the request, the same way as a HomeGallery row on the Requests screen
                    With(
                        {req: LookUp(colOpeReqs, ID = ThisItem.ID)},
                        // opened from a dashboard: details are shown in view-only mode
                        Set(varViewOnly, true);
                        Set(varCurrentRequest, req);
                        Set(varRequestTitle1, Coalesce(req.RequestTitle, ""));
                        Set(varRequestTitle, Coalesce(req.RequestTitle, ""));
                        Set(varRequestDG, Coalesce(req.DG.Value, ""));
                        Set(varRequestDescription1, Coalesce(req.Description, ""));
                        Set(varRequestDescription, Coalesce(req.Description, ""));
                        Set(varRequestOwnerContact, Coalesce(First(req.DG_Agency_Contact).DisplayName, ""));
                        Set(varRequestMediaType, "");
                        Navigate(RequesDetailScreen, ScreenTransition.Cover, {locShowTypePicker: false, locResetContacts: true, locFromReview: false})
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =11
                  Text: |-
                    ="📷 " & ThisItem.RequestNumber
                  Tooltip: ="Open request (v." & ThisItem.'Version number' & ")"
                  Width: =100
                  X: =10
                  Y: =14
            - DOA_List1RowBadge:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =Self.BorderColor
                  DisplayMode: =DisplayMode.View
                  Fill: |-
                    =If("Draft" in ThisItem.Status.Value, Color.Gray,
                       "Pending" in ThisItem.Status.Value, Color.DarkKhaki,
                       "Processing" in ThisItem.Status.Value, Color.SlateBlue,
                       "Approved" in ThisItem.Status.Value, Color.DarkGreen,
                       "Rejected" in ThisItem.Status.Value, ColorValue("#F08080"),
                       Color.Gray)
                  Font: =Font.'Open Sans'
                  Height: =19
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Size: =9
                  Text: =If(IsBlank(ThisItem.Status.Value), "Draft", If(ThisItem.Status.Value = "Partially approved", "Approved", Text(ThisItem.Status.Value)))
                  Tooltip: |-
                    =// "Partially approved" is not a status: an Approved request whose media files are only partly ticked (RS_CRowApproved) says so here
                    With(
                        {
                            n: CountRows(Filter(colOpeMedia, ParentRequest = ThisItem.RequestNumber)),
                            ok: CountRows(Filter(colOpeMedia, ParentRequest = ThisItem.RequestNumber, MediaApproved = true))
                        },
                        If(
                            ThisItem.Status.Value = "Partially approved" Or (ThisItem.Status.Value = "Approved" And ok > 0 And ok < n),
                            "Partially Approved Request.",
                            "Status"
                        )
                    )
                  Width: =80
                  X: =312
                  Y: =51
            - DOA_List1RowNotes:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =// amber = the most recent note on this request is from the requestor (waiting for you)
                    // gray = the most recent note is yours; light gray = no notes yet
                    With(
                        {
                            reqHas: Not(IsBlank(ThisItem.RequestorNotesUpdatedOn)) Or Trim(PlainText(Coalesce(ThisItem.Notes, ""))) <> "",
                            admHas: Not(IsBlank(ThisItem.AdminNotesUpdatedOn)) Or Trim(PlainText(Coalesce(ThisItem.ReviewerComments, ""))) <> "",
                            reqAt: Coalesce(ThisItem.RequestorNotesUpdatedOn, DateTime(2000, 1, 1, 0, 0, 0)),
                            admAt: Coalesce(ThisItem.AdminNotesUpdatedOn, DateTime(2000, 1, 1, 0, 0, 0))
                        },
                        If(
                            Not(reqHas) And Not(admHas),
                            Color.LightGray,
                            If(reqHas And (Not(admHas) Or reqAt > admAt), RGBA(255, 193, 7, 1), Color.Gray)
                        )
                    )
                  DisplayMode: =DisplayMode.View
                  FocusedBorderThickness: =0
                  Height: =20
                  Icon: =Icon.Note
                  OnSelect: =Select(Parent)
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                  Tooltip: |-
                    =With(
                        {
                            reqHas: Not(IsBlank(ThisItem.RequestorNotesUpdatedOn)) Or Trim(PlainText(Coalesce(ThisItem.Notes, ""))) <> "",
                            admHas: Not(IsBlank(ThisItem.AdminNotesUpdatedOn)) Or Trim(PlainText(Coalesce(ThisItem.ReviewerComments, ""))) <> "",
                            reqAt: Coalesce(ThisItem.RequestorNotesUpdatedOn, DateTime(2000, 1, 1, 0, 0, 0)),
                            admAt: Coalesce(ThisItem.AdminNotesUpdatedOn, DateTime(2000, 1, 1, 0, 0, 0))
                        },
                        If(
                            Not(reqHas) And Not(admHas),
                            "No notes",
                            If(reqHas And (Not(admHas) Or reqAt > admAt), "New notes to check", "Notes sent")
                        )
                    ) & Char(10) & Char(10) &
                    ("Notes: " & Char(10) & Char(10) & 
                    Coalesce(ThisItem.'Created By'.DisplayName, "—") & ", updated on " & Text(ThisItem.RequestorNotesUpdatedOn, "dd mmm 'yy hh:mm" )
                    & Char(10) & 
                    PlainText(Coalesce(ThisItem.Notes, ""))
                    & Char(10) & Char(10) & 
                    "Central Deposit: " &  ", updated on " & Text(ThisItem.AdminNotesUpdatedOn, "dd mmm 'yy hh:mm" )
                    & Char(10) & 
                    Coalesce(ThisItem.ReviewerComments, ""))
                  Width: =20
                  X: =72
                  Y: =53
            - DOA_List1RowBell:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: |-
                    =// days left to the publication date of the request's media items (PublicationStartDate)
                    With(
                        {dated: Sort(Filter(colOpeMedia, ParentRequest = ThisItem.RequestNumber And Not(IsBlank(PublicationStartDate))), PublicationStartDate, SortOrder.Ascending)},
                        With(
                            {
                                m: If(
                                    IsEmpty(Filter(dated, PublicationStartDate >= Today())),
                                    Last(dated),                                 // every date is past: the latest
                                    First(Filter(dated, PublicationStartDate >= Today()))  // else the next one
                                )
                            },
                            If(
                                IsBlank(m),
                                "No publication date yet",
                                With(
                                    {
                                        days: DateDiff(Today(), m.PublicationStartDate, TimeUnit.Days),
                                        what: "Publication date"
                                    },
                                    what & ": " & Text(m.PublicationStartDate, "dd mmm 'yy") 
                                    & Char(10) & Char(10) 
                                    & If(
                                        days > 1, days & " days left",
                                        days = 1, "1 day left",
                                        days = 0, "today",
                                        days = -1, "1 day ago",
                                        -days & " days ago"
                                    )
                                )
                            )
                        )
                    )
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =// red: fewer than 7 days left (today and past dates included); navy: 7 or more;
                    // grey: no publication date. Same date as the tooltip: the next one, else the latest past one.
                    With(
                        {dated: Sort(Filter(colOpeMedia, ParentRequest = ThisItem.RequestNumber And Not(IsBlank(PublicationStartDate))), PublicationStartDate, SortOrder.Ascending)},
                        With(
                            {
                                m: If(
                                    IsEmpty(Filter(dated, PublicationStartDate >= Today())),
                                    Last(dated),
                                    First(Filter(dated, PublicationStartDate >= Today()))
                                )
                            },
                            If(
                                IsBlank(m), RGBA(166, 166, 166, 1),
                                DateDiff(Today(), m.PublicationStartDate, TimeUnit.Days) < 7, Color.Orange,
                                RGBA(0, 18, 107, 1)
                            )
                        )
                    )
                  DisplayMode: =DisplayMode.View
                  FocusedBorderThickness: =0
                  Height: =20
                  Icon: =Icon.Clock
                  OnSelect: =Select(Parent)
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                  Tooltip: |-
                    =// days left to the publication date of the request's media items (PublicationStartDate)
                    With(
                        {dated: Sort(Filter(colOpeMedia, ParentRequest = ThisItem.RequestNumber And Not(IsBlank(PublicationStartDate))), PublicationStartDate, SortOrder.Ascending)},
                        With(
                            {
                                m: If(
                                    IsEmpty(Filter(dated, PublicationStartDate >= Today())),
                                    Last(dated),                                 // every date is past: the latest
                                    First(Filter(dated, PublicationStartDate >= Today()))  // else the next one
                                )
                            },
                            If(
                                IsBlank(m),
                                "No publication date yet",
                                With(
                                    {
                                        days: DateDiff(Today(), m.PublicationStartDate, TimeUnit.Days),
                                        what: "Publication date"
                                    },
                                    what & ": " & Text(m.PublicationStartDate, "dd mmm 'yy")
                                    & Char(10)
                                    & If(
                                        days > 1, days & " days left!",
                                        days = 1, "1 day left!",
                                        days = 0, "today!!",
                                        days = -1, "1 day ago!!!",
                                        -days & " days ago!!!"
                                    )
                                )
                            )
                        )
                    )
