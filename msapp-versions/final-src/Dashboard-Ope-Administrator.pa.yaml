            Height: =450
            HoverBorderColor: =Self.BorderColor
            HoverFill: =Self.Fill
            Items: |-
              =// oldest first: every Pending request, then every Processing request
              Ungroup(
                  Table(
                      {rows: Sort(Filter(colOpeReqs, Status.Value = "Pending"), Modified, SortOrder.Ascending)},
                      {rows: Sort(Filter(colOpeReqs, Status.Value = "Processing"), Modified, SortOrder.Ascending)}
