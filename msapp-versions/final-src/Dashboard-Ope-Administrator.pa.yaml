Screens:
  Dashboard-Ope-Administrator:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// role and data are set here too: this can be the start screen, so it must not
        // rely on App.OnStart having finished
        Set(varUserRole, Coalesce(LookUp('AV-CD-RolesPermissionsList', UserEmail.Email = User().Email, Role.Value), "REQUESTOR"));
        Refresh('AV-CD-Requests');
        // every request except drafts (a draft belongs to its requestor until submitted);
        // "<>" on a Choice column is not delegable, so the list is loaded, then filtered
        ClearCollect(colOpeAll, 'AV-CD-Requests');
        ClearCollect(colOpeReqs, Filter(colOpeAll, Status.Value <> "Draft"));
        If(
            CountRows(colOpeAll) >= 2000,
            Notify("Only the first 2000 requests are loaded, so older ones may be missing.", NotificationType.Warning)
        )
