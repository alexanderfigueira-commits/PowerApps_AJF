      - RS_BtnSubmitRequest:
          Control: Classic/Button@2.2.0
          Group: Group1
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
                  And Not(IsBlank(Coalesce(varRequestTitle))) And Coalesce(varRequestTitle) <> ""
                  And Not(IsBlank(varRequestDG)) And varRequestDG <> ""
                  And Not(IsEmpty(RS_Owner.SelectedItems))
                  And Not(IsEmpty(RS_Contractor.SelectedItems))
                  And CountRows(colArchives) > 0
                  And CountIf(colArchives,
                      IsBlank(Title) Or Title = "" Or Title = "New archive"
                      Or IsBlank(MediaType) Or MediaType = ""
                      Or IsBlank(ContractCase) Or ContractCase = ""
                      Or Coalesce(AIVoiceover, false)
                  ) = 0,
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =43
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: |-
              =// save exactly what is on screen
              Set(varRequestTitle, RS_Title.Text);
              Set(varRequestDescription, RS_Description.Text);
              Set(varRequestDG, HomeFilterDG.Selected.Value);
              IfError(
                  With(
                      {
                          savedReq: Patch(
                              'AV-CD-Requests',
                              LookUp('AV-CD-Requests', ID = varCurrentRequest.ID),
                              {
                                  ReviewerComments: If(varUserRole = "ADMINISTRATOR", RS_AdminNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).ReviewerComments),
                                  AdminNotesUpdatedOn: If(varUserRole = "ADMINISTRATOR" And RS_AdminNotes.Text <> Coalesce(varCurrentRequest.ReviewerComments, ""), Now(), varCurrentRequest.AdminNotesUpdatedOn),
                                  Notes: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)), RS_RequestorNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).Notes),
                                  RequestorNotesUpdatedOn: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)) And RS_RequestorNotes.Text <> PlainText(Coalesce(varCurrentRequest.Notes, "")), Now(), varCurrentRequest.RequestorNotesUpdatedOn),
                                  RequestNumber: varCurrentRequest.RequestNumber,
                                  RequestTitle: varRequestTitle,
                                  DG: {Value: varRequestDG},
                                  Description: varRequestDescription,
                                  DG_Agency_Contact: ForAll(Filter(RS_Owner.SelectedItems, Not(IsBlank(Mail)) And DisplayName <> Mail) As u, {Claims: "i:0#.f|membership|" & Lower(u.Mail), DisplayName: u.DisplayName, Email: u.Mail, Department: "", JobTitle: "", Picture: ""}),
                                  Contractor_Contact: ForAll(Filter(RS_Contractor.SelectedItems, Not(IsBlank(Mail)) And DisplayName <> Mail) As u, {Claims: "i:0#.f|membership|" & Lower(u.Mail), DisplayName: u.DisplayName, Email: u.Mail, Department: "", JobTitle: "", Picture: ""}),
                                  // manual (non-Microsoft 365) email picked in RS_Owner; blank when none
                                  Manual_DG_Agency_Contact: Concat(Filter(RS_Owner.SelectedItems, Not(IsBlank(Mail)) And DisplayName = Mail), Mail, "; "),
                                  // manual (non-Microsoft 365) email picked in RS_Contractor; blank when none
                                  Manual_Contractor_Contact: Concat(Filter(RS_Contractor.SelectedItems, Not(IsBlank(Mail)) And DisplayName = Mail), Mail, "; "),
                                  Status: {Value: "Processing"}
                              }
                          )
                      },
                      Set(varCurrentRequest, savedReq);
                      ForAll(
                          Filter(colArchives, SPId > 0),
                          Patch(
                              'AV-CD-Mediafiles',
                              LookUp('AV-CD-Mediafiles', ID = SPId),
                              {DepositStatus: Table({Value: "Pending Approval"})}
                          )
                      );
                      Clear(colArchives);
                      // the management gallery reloads on its next visit
                      // saved on the request now, so it becomes the source for this request
                      RemoveIf(colManualContacts, ParentRequest = varCurrentRequest.RequestNumber);
                      Set(varReqDataLoaded, false);
                      Notify("Request submitted successfully.", NotificationType.Success);
                      Navigate(RequestManagementScreen)
                  ),
                  Notify("Error submitting request: " & FirstError.Message, NotificationType.Error)
              )
