      - NT_BtnAdd:
          Control: Classic/Button@2.2.0
          Group: Group3
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(160, 172, 200, 1)
            DisplayMode: =If(IsBlank(Trim(NT_Input.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  Coalesce(varCurrentRequest.ID, 0) > 0 And Not(IsBlank(Trim(NT_Input.Text))),
                  With(
                      {noteRole: If(varUserRole = "ADMINISTRATOR", "Administrator", "Requestor"), noteText: Substitute(Trim(NT_Input.Text), Char(10), "<br>")},
                      IfError(
                          Patch(
                              'AV-CD-Notes',
                              Defaults('AV-CD-Notes'),
                              {
                                  Title: varCurrentRequest.RequestNumber,
                                  ParentRequest: varCurrentRequest.RequestNumber,
                                  NoteText: noteText,
                                  AuthorRole: {Value: If(varUserRole = "ADMINISTRATOR", "Administrator", "Requestor")},
                                  AuthorName: User().FullName,
                                  AuthorEmail: User().Email,
                                  NoteDate: Now()
                              }
                          );
                          // the notes icons on the dashboards read these two dates
                          Set(
                              varCurrentRequest,
                              Patch(
                                  'AV-CD-Requests',
                                  LookUp('AV-CD-Requests', ID = varCurrentRequest.ID),
                                  {
                                      AdminNotesUpdatedOn: If(noteRole = "Administrator", Now(), varCurrentRequest.AdminNotesUpdatedOn),
                                      RequestorNotesUpdatedOn: If(noteRole = "Requestor", Now(), varCurrentRequest.RequestorNotesUpdatedOn)
                                  }
                              )
                          );
                          If(
                              Not(IsBlank(LookUp(colMyReqs, ID = varCurrentRequest.ID))),
                              Patch(
                                  colMyReqs,
                                  LookUp(colMyReqs, ID = varCurrentRequest.ID),
                                  {AdminNotesUpdatedOn: varCurrentRequest.AdminNotesUpdatedOn, RequestorNotesUpdatedOn: varCurrentRequest.RequestorNotesUpdatedOn}
                              )
                          );
                          If(
                              Coalesce(varCurrentRequest.ID, 0) > 0,
                              With(
                                  {
                                      // the side of the thread the current user is on; notes from the other side can be new for them
                                      noteSide: If(
                                          varUserRole = "ADMINISTRATOR",
                                          "Administrator",
                                          If(Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email), "Requestor", "")
                                      )
                                  },
                                  ClearCollect(
                                      colReqNotes,
                                      ForAll(
                                          Filter('AV-CD-Notes', ParentRequest = varCurrentRequest.RequestNumber),
                                          {
                                              NRole: AuthorRole.Value,
                                              NAuthor: Coalesce(AuthorName, "-"),
                                              NDate: Coalesce(NoteDate, Created),
                                              NText: PlainText(Coalesce(NoteText, "")),
                                              NKey: ID,
                                              // not read yet by the side it was written for
                                              NNew: noteSide <> "" And AuthorRole.Value <> noteSide And IsBlank(ReadOn)
                                          }
                                      )
                                  )
                              );
                              // notes written before the thread existed stay as the first entry of each column
                              Collect(
                                  colReqNotes,
                                  Filter(
                                      Table({NRole: "Requestor", NAuthor: Coalesce(varCurrentRequest.'Created By'.DisplayName, "Requestor"), NDate: DateTime(1900, 1, 1, 0, 0, 0), NText: PlainText(Coalesce(varCurrentRequest.Notes, "")), NKey: 0, NNew: false}),
                                      Not(IsBlank(Trim(PlainText(Coalesce(varCurrentRequest.Notes, "")))))
                                  )
                              );
                              // a reviewer comment saved on ReviewScreen is also a note in the thread: count it once
                              With(
                                  {rc: Lower(Substitute(Substitute(Substitute(Coalesce(varCurrentRequest.ReviewerComments, ""), Char(13), ""), Char(10), ""), " ", ""))},
                                  With(
                                      {inThread: Not(IsBlank(LookUp(colReqNotes, NKey > 0 And EndsWith(Lower(Substitute(Substitute(Substitute(NText, Char(13), ""), Char(10), ""), " ", "")), rc))))},
                                      Collect(
                                          colReqNotes,
                                          Filter(
                                              Table({NRole: "Administrator", NAuthor: "Central Deposit", NDate: DateTime(1900, 1, 1, 0, 0, 0), NText: Coalesce(varCurrentRequest.ReviewerComments, ""), NKey: 0, NNew: false}),
                                              rc <> "" And Not(inThread)
                                          )
                                      )
                                  )
                              ),
                              Clear(colReqNotes)
                          );
                          Reset(NT_Input);
                          Notify("Note added.", NotificationType.Success),
                          Notify("Could not save the note: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            PressedBorderColor: =RGBA(0, 0, 0, 1)
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =22
            Text: |-
              ="📩"
            Tooltip: ="Add the note to the thread"
            Visible: =locShowNotes And (Coalesce(varCurrentRequest.ID, 0) > 0 And (varUserRole = "ADMINISTRATOR" Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)))
            Width: =63
            X: =960
            Y: =667
