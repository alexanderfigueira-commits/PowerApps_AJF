      - Add_media_icon:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =28
            HoverColor: =ColorFade(Color.CadetBlue, 20%)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.AddLibrary
            OnSelect: |-
              =If(
                  IsBlank(Coalesce(varRequestTitle)) Or Coalesce(varRequestTitle) = ""
                  Or IsBlank(varRequestDG) Or varRequestDG = "",
                  Notify("Enter the request title and select a DG/Agency before adding media.", NotificationType.Warning),
              If(
                  IsBlank(varRequestMediaType) Or varRequestMediaType = "",
                  Notify("Please select the production type first.", NotificationType.Warning),
              IfError(
                  If(
                      IsBlank(varCurrentRequest) Or Coalesce(varCurrentRequest.ID, 0) <= 0,
                      Set(varNextReqSeq, With(
                          {yr4: Text(Year(Today())), yr2: Right(Text(Year(Today())), 2), lastNum: Coalesce(First(Sort('AV-CD-Requests', ID, SortOrder.Descending)).RequestNumber, "")},
                          If(
                              Left(lastNum, 3) = yr2 & "-",
                              Value(Mid(lastNum, 4, 10)),
                              If(Left(lastNum, 5) = yr4 & "-", Value(Right(lastNum, 4)), 0)
                          ) + 1
                      ));
                      Set(varCurrentRequest, IfError(
                                  Patch('AV-CD-Requests', Defaults('AV-CD-Requests'), {
                          RequestNumber: Right(Text(Year(Today())), 2) & "-" & Text(varNextReqSeq, "0000"),
                                  ReviewerComments: If(varUserRole = "ADMINISTRATOR", RS_AdminNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).ReviewerComments),
                                  AdminNotesUpdatedOn: If(varUserRole = "ADMINISTRATOR" And RS_AdminNotes.Text <> Coalesce(varCurrentRequest.ReviewerComments, ""), Now(), varCurrentRequest.AdminNotesUpdatedOn),
                                  Notes: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)), RS_RequestorNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).Notes),
                                  RequestorNotesUpdatedOn: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)) And RS_RequestorNotes.Text <> PlainText(Coalesce(varCurrentRequest.Notes, "")), Now(), varCurrentRequest.RequestorNotesUpdatedOn),
                                  RequestTitle: Coalesce(varRequestTitle, varRequestTitle1),
                                  DG: {Value: varRequestDG},
                                  MediaType_Request: If(
                                      // never left to the column default: always the user's choice; an existing request keeps its value if none is picked
                                      IsBlank(varRequestMediaType) Or varRequestMediaType = "",
                                      If(Coalesce(varCurrentRequest.ID, 0) > 0, varCurrentRequest.MediaType_Request, Blank()),
                                      {Value: varRequestMediaType}
                                  ),
                                  ArchivingOnly: varRequestArchivingOnly,
                                  Description: varRequestDescription, 
                                  Status: {Value: "Draft"}
                              
                      }),
                                  IfError(
                                      Patch('AV-CD-Requests', Defaults('AV-CD-Requests'), {
                          RequestNumber: Right(Text(Year(Today())), 2) & "-" & Text(varNextReqSeq + 1, "0000"),
                                  ReviewerComments: If(varUserRole = "ADMINISTRATOR", RS_AdminNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).ReviewerComments),
                                  AdminNotesUpdatedOn: If(varUserRole = "ADMINISTRATOR" And RS_AdminNotes.Text <> Coalesce(varCurrentRequest.ReviewerComments, ""), Now(), varCurrentRequest.AdminNotesUpdatedOn),
                                  Notes: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)), RS_RequestorNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).Notes),
                                  RequestorNotesUpdatedOn: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)) And RS_RequestorNotes.Text <> PlainText(Coalesce(varCurrentRequest.Notes, "")), Now(), varCurrentRequest.RequestorNotesUpdatedOn),
                                  RequestTitle: Coalesce(varRequestTitle, varRequestTitle1),
                                  DG: {Value: varRequestDG},
                                  MediaType_Request: If(
                                      // never left to the column default: always the user's choice; an existing request keeps its value if none is picked
                                      IsBlank(varRequestMediaType) Or varRequestMediaType = "",
                                      If(Coalesce(varCurrentRequest.ID, 0) > 0, varCurrentRequest.MediaType_Request, Blank()),
                                      {Value: varRequestMediaType}
                                  ),
                                  ArchivingOnly: varRequestArchivingOnly,
                                  Description: varRequestDescription, 
                                  Status: {Value: "Draft"}
                              
                      }),
                                      Patch('AV-CD-Requests', Defaults('AV-CD-Requests'), {
                          RequestNumber: Right(Text(Year(Today())), 2) & "-" & Text(varNextReqSeq + 2, "0000"),
                                  ReviewerComments: If(varUserRole = "ADMINISTRATOR", RS_AdminNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).ReviewerComments),
                                  AdminNotesUpdatedOn: If(varUserRole = "ADMINISTRATOR" And RS_AdminNotes.Text <> Coalesce(varCurrentRequest.ReviewerComments, ""), Now(), varCurrentRequest.AdminNotesUpdatedOn),
                                  Notes: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)), RS_RequestorNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).Notes),
                                  RequestorNotesUpdatedOn: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)) And RS_RequestorNotes.Text <> PlainText(Coalesce(varCurrentRequest.Notes, "")), Now(), varCurrentRequest.RequestorNotesUpdatedOn),
                                  RequestTitle: Coalesce(varRequestTitle, varRequestTitle1),
                                  DG: {Value: varRequestDG},
                                  MediaType_Request: If(
                                      // never left to the column default: always the user's choice; an existing request keeps its value if none is picked
                                      IsBlank(varRequestMediaType) Or varRequestMediaType = "",
                                      If(Coalesce(varCurrentRequest.ID, 0) > 0, varCurrentRequest.MediaType_Request, Blank()),
                                      {Value: varRequestMediaType}
                                  ),
                                  ArchivingOnly: varRequestArchivingOnly,
                                  Description: varRequestDescription, 
                                  Status: {Value: "Draft"}
                              
                      })
                                  )
                              ))
                  );
              // Manual contacts typed before the first save are keyed to a blank request
              // number; move them onto the number this save assigned.
              UpdateIf(
                  colManualContacts,
                  IsBlank(ParentRequest) Or ParentRequest = "",
                  {ParentRequest: varCurrentRequest.RequestNumber}
              );
              Set(varCurrentChildId, Text(GUID()));
              Set(varCurrentChildSPId,
                  IfError(
                      With(
                          {rn: varCurrentRequest.RequestNumber},
                          With(
                              {
                                  n0: With({lastMed: Coalesce(First(Sort(Filter('AV-CD-Mediafiles', ParentRequest = rn), ID, SortOrder.Descending)).CD_MediaNumber, "")}, If(Left(lastMed, Len(rn) + 1) = rn & "-", Value(Mid(lastMed, Len(rn) + 2)), 0)) + 1
                              },
                              IfError(
                                  Patch('AV-CD-Mediafiles', Defaults('AV-CD-Mediafiles'), {
                                          CD_MediaNumber: rn & "-" & Text(n0, "00"),
                                          MediaType: Table({Value: varRequestMediaType}),
                                          ParentRequest: varCurrentRequest.RequestNumber,
                                          DepositStatus: Table({Value: "Draft"})
                                      }),
                                  IfError(
                                      Patch('AV-CD-Mediafiles', Defaults('AV-CD-Mediafiles'), {
