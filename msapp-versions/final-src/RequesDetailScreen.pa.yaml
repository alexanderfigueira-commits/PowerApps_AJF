Screens:
  RequesDetailScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(
            varRequestorLocked,
            varUserRole <> "ADMINISTRATOR"
            And Coalesce(varCurrentRequest.Status.Value, "") = "Processing"
        );
        Set(
            varUserDept,
            Coalesce(IfError(Office365Users.MyProfile().Department, ""), "")
        );
        // details open; a blank locDetailsCollapsed also means open, so they are
        // already open before this runs
        UpdateContext(
            {
                locDetailsCollapsed: false,
                locShowMedia: true,
                locShowAdminNotes: false,
                locShowRequestorNotes: false,
                locShowNotes: false
            }
        );
        // locShowTypePicker arrives with Navigate: true only from HomeBtnNew
        // ("New request"), false from every other entry. It is not set here,
        // so the value handed over is never overwritten.
        //
        // Opening a request from RequestManagementScreen (New or a gallery row)
        // also passes locResetContacts: true, so the contact pickers drop what the
        // previously opened request left selected. Returns from the media tabs
        // pass false and keep the selection.
        If(
            locResetContacts,
            Reset(RS_Owner);
            Reset(RS_Contractor);
            Reset(RS_AdminNotes);
            Reset(RS_RequestorNotes);
            UpdateContext({locResetContacts: false})
        );
        Set(
            varConfirmed,
            false
        );
        Set(
            varCurrentChildId,
            ""
        );
        Clear(colArchives);
        If(
            Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0,
            Refresh('AV-CD-Mediafiles');
            ForAll(
                Sort(
                    Filter(
                        'AV-CD-Mediafiles',
                        ParentRequest = varCurrentRequest.RequestNumber
                    ),
                    Modified,
                    SortOrder.Descending
                ),
                Collect(
                    colArchives,
                    {
                        ArchiveId: Text(ID),
                        SPId: ID,
                        Title: CD_MediaNumber,
                        BelugaReference: Coalesce(
                            BelugaReference,
                            ""
                        ),
                        // rich-text column: keep the text, drop the HTML
                        Notes: PlainText(Coalesce(
                            Notes,
                            ""
                        )),
                        MediaApproved: Coalesce(MediaApproved, false),
                        PublicationChannel: Coalesce(PublicationChannel.Value, ""),
                        ProductionTitle: Coalesce(
                            ProductionTitle,
                            ""
                        ),
                        MediaType: Coalesce(
                            First(MediaType).Value,
                            ""
                        ),
                        Description: Coalesce(
                            Description,
                            ""
                        ),
                        CaptureDate: CaptureDate,
                        ProductionPlace: Coalesce(
                            ProductionPlace,
                            ""
                        ),
                        ProductType: Coalesce(
                            First(ProductType).Value,
                            ""
                        ),
                        SeriesTitle: Coalesce(
                            SeriesTitle,
                            ""
                        ),
                        EpisodeTitle: Coalesce(
                            EpisodeTitle,
                            ""
                        ),
                        EpisodeSummary: Coalesce(
                            EpisodeSummary,
                            ""
                        ),
                        SeasonNumber: Coalesce(
                            SeasonNumber,
                            0
                        ),
                        EpisodeNumber: Coalesce(
                            EpisodeNumber,
                            0
                        ),
                        ProductionEndDate: ProductionEndDate,
                        PublicationStartDate: PublicationStartDate,
                        PublicationEndDate: PublicationEndDate,
                        ReferenceLinks: Coalesce(
                            ReferenceLinks,
                            ""
                        ),
                        Tags: Coalesce(
                            Tags,
                            ""
                        ),
                        FTPPath: Coalesce(
                            FTPPath,
                            ""
                        ),
                        LanguageVersions: Coalesce(
                            First(LanguageVersions).Value,
                            ""
                        ),
                        // rich-text column: keep the text, drop the HTML
                        PhotoCaption: PlainText(Coalesce(
                            PhotoCaption,
                            ""
                        )),
                        Credits: Coalesce(
                            CreditContact,
                            ""
                        ),
                        ContractingAuthority: Coalesce(
                            ContractingAuthority,
                            ""
                        ),
                        ExecProducer: Coalesce(
                            ExecProducerName,
                            ""
                        ),
                        Producer: ForAll(
                            Producer As p,
                            {
                                DisplayName: p.DisplayName,
                                Mail: p.Email
                            }
                        ),
                        AIVoiceover: AIVoiceover = "Yes",
                        ContractCase: Coalesce(
                            First(ContractCase).Value,
                            ""
                        ),
                        ContractCase1Sub: Coalesce(
                            First(ContractCase1Sub).Value,
                            ""
                        ),
                        ModelRelease: false,
                        NoThirdPartyRights: Coalesce(
                            NoThirdPartyRights,
                            false
                        ),
                        ModelReleaseProvided: Coalesce(
                            ModelReleaseProvided,
                            false
                        ),
                        MusicUsed: Coalesce(
                            MusicUsed,
                            false
                        ),
                        MusicLicenceProvided: Coalesce(
                            MusicLicenseProvided,
                            false
                        ),
                        Preexisting: false,
                        PreexistingProvided: Coalesce(
                            PreexistingRightsProvided,
                            false
                        )
                    }
                )
            )
        );
        If(
            CountRows(colArchives) > 0,
            Set(
                varRequestMediaType,
                First(colArchives).MediaType
            )
        );
        // only a new request takes the dropdown's first DG; an opened one keeps its own
        If(
            IsBlank(varRequestDG) Or varRequestDG = "",
            Set(varRequestDG, HomeFilterDG.Selected.Value)
        );
        Set(locShowContactPopup, false);
        If(
            Not(IsBlank(varCurrentRequest))
            And (varCurrentRequest.Status.Value = "Rejected"
                 Or varCurrentRequest.Status.Value = "Pending")
            And Not(IsBlank(varCurrentRequest.ReviewerComments)),
            Notify(
                If(
                    varCurrentRequest.Status.Value = "Rejected",
                    "Rejected by ",
                    // Pending = the administrator pressed Need info
                    "More information requested by "
                ) & Coalesce(First(varCurrentRequest.ReviewedByContact).DisplayName, "the reviewer")
                & If(
                    IsBlank(varCurrentRequest.ReviewedDate),
                    "",
                    " on " & Text(varCurrentRequest.ReviewedDate, DateTimeFormat.ShortDate)
                )
                & ": " & varCurrentRequest.ReviewerComments,
                NotificationType.Warning
            )
        );
        If(
            Coalesce(varCurrentRequest.ID, 0) > 0,
            With(
                {
                    // the side of the thread the current user is on; notes from the other side can be new for them
                    noteSide: If(
                        varUserRole = "ADMINISTRATOR",
                        "Administrator",
                        If(Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email), "Requestor", "")
                    )
                },
                ClearCollect(
                    colReqNotes,
                    ForAll(
                        Filter('AV-CD-Notes', ParentRequest = varCurrentRequest.RequestNumber),
                        {
                            NRole: AuthorRole.Value,
                            NAuthor: Coalesce(AuthorName, "-"),
                            NDate: Coalesce(NoteDate, Created),
                            NText: PlainText(Coalesce(NoteText, "")),
                            NKey: ID,
                            // not read yet by the side it was written for
                            NNew: noteSide <> "" And AuthorRole.Value <> noteSide And IsBlank(ReadOn)
                        }
                    )
                )
            );
            // notes written before the thread existed stay as the first entry of each column
            Collect(
                colReqNotes,
                Filter(
                    Table({NRole: "Requestor", NAuthor: Coalesce(varCurrentRequest.'Created By'.DisplayName, "Requestor"), NDate: DateTime(1900, 1, 1, 0, 0, 0), NText: PlainText(Coalesce(varCurrentRequest.Notes, "")), NKey: 0, NNew: false}),
                    Not(IsBlank(Trim(PlainText(Coalesce(varCurrentRequest.Notes, "")))))
                )
            );
            // a reviewer comment saved on ReviewScreen is also a note in the thread: count it once
            With(
                {rc: Lower(Substitute(Substitute(Substitute(Coalesce(varCurrentRequest.ReviewerComments, ""), Char(13), ""), Char(10), ""), " ", ""))},
                With(
                    {inThread: Not(IsBlank(LookUp(colReqNotes, NKey > 0 And EndsWith(Lower(Substitute(Substitute(Substitute(NText, Char(13), ""), Char(10), ""), " ", "")), rc))))},
                    Collect(
                        colReqNotes,
                        Filter(
                            Table({NRole: "Administrator", NAuthor: "Central Deposit", NDate: DateTime(1900, 1, 1, 0, 0, 0), NText: Coalesce(varCurrentRequest.ReviewerComments, ""), NKey: 0, NNew: false}),
                            rc <> "" And Not(inThread)
                        )
                    )
                )
            ),
            Clear(colReqNotes)
        );
        // "Archiving only, not publication": an opened request shows what is saved, a new request starts at No
        Set(varRequestArchivingOnly, Coalesce(varCurrentRequest.ArchivingOnly, false))
    Children:
      - RS_ChildrenGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Group: Group1
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =218
            Items: =colArchives
            TemplateSize: =56
            Visible: =locShowMedia
            Width: =1304
            X: =26
            Y: =If(locDetailsCollapsed, 190, 496)
          Children:
            - RS_CRowSelect:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =55
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(varCurrentChildId, ThisItem.ArchiveId);
                    Set(varCurrentChildSPId, Coalesce(ThisItem.SPId, 0));
                    Set(varChildTitle1, Coalesce(ThisItem.ProductionTitle, ""));
                    Set(varChildMediaType, If(IsBlank(ThisItem.MediaType), "Photo", ThisItem.MediaType));
                    Set(varChildDescription1, If(StartsWith(Trim(Coalesce(ThisItem.Description, "")),"<"),Trim(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Concat(MatchAll(Coalesce(ThisItem.Description, ""),">[^<]+"),Mid(FullMatch,2)&" "),"&#160;"," "),"&nbsp;"," "),"&amp;","&"),"&lt;","<"),"&gt;",">"),"&quot;","""")),Coalesce(ThisItem.Description, "")));
                    Set(varChildCaptureDate, ThisItem.CaptureDate);
                    Set(varChildProductionPlace1, Coalesce(ThisItem.ProductionPlace, ""));
                    Set(varChildCredits1, Coalesce(ThisItem.Credits, ""));
                    Set(varChildLanguageVersions, Coalesce(ThisItem.LanguageVersions, ""));
                    Set(varChildAIVoiceover, Coalesce(ThisItem.AIVoiceover, false));
                    Set(varChildContractCase, Coalesce(ThisItem.ContractCase, ""));
                    Set(varChildContractCase1Sub, Coalesce(ThisItem.ContractCase1Sub, ""));
                    Set(varDocFramework, false); Set(varDocSpecific, false); Set(varDocOffer, false);
                    Set(varChildContractingAuthority, Coalesce(ThisItem.ContractingAuthority, ""));
                    Set(varChildExecProducer, Coalesce(ThisItem.ExecProducer, ""));
                    Set(varChildProducerSel, ThisItem.Producer);
                    Set(varChildProducer, Concat(ThisItem.Producer, DisplayName, ", "));
                    Set(varChildPhotoCaption, Coalesce(ThisItem.PhotoCaption, ""));
                    Set(varChildPubBeluga, "Beluga" in Coalesce(ThisItem.PublicationChannel, ""));
                    Set(varChildPubSpotify, "Spotify" in Coalesce(ThisItem.PublicationChannel, ""));
                    Set(varChildModelRelease, Coalesce(ThisItem.ModelRelease, false));
                    Set(varChildNoThirdParty, Coalesce(ThisItem.NoThirdPartyRights, false));
                    Set(varChildModelReleaseProvided, Coalesce(ThisItem.ModelReleaseProvided, false));
                    Set(varChildMusicUsed, Coalesce(ThisItem.MusicUsed, false));
                    Set(varChildMusicLicenceProvided, Coalesce(ThisItem.MusicLicenceProvided, false));
                    Set(varChildPreexisting, Coalesce(ThisItem.Preexisting, false));
                    Set(varChildPreexistingProvided, Coalesce(ThisItem.PreexistingProvided, false));
                    Set(varChildEpisodeTitle1, Coalesce(ThisItem.EpisodeTitle, ""));
                    Set(varChildEpisodeSummary1, Coalesce(ThisItem.EpisodeSummary, ""));
                    Set(varChildSeasonNumber, Coalesce(ThisItem.SeasonNumber, 0));
                    Set(varChildEpisodeNumber, Coalesce(ThisItem.EpisodeNumber, 0));
                    Set(varChildSeriesTitle1, Coalesce(ThisItem.SeriesTitle, ""));
                    Set(varChildProductType1, Coalesce(ThisItem.ProductType, ""));
                    Set(varChildProductType, Coalesce(ThisItem.ProductType, ""));
                    Set(varChildTags, Coalesce(ThisItem.Tags, ""));
                    Set(varChildProductionEndDate, ThisItem.ProductionEndDate);
                    Set(varChildPublicationStartDate, ThisItem.PublicationStartDate);
                    Set(varChildPublicationEndDate, ThisItem.PublicationEndDate);
                    Set(varChildLinks1, Coalesce(ThisItem.ReferenceLinks, ""));
                    Set(varChildTags1, Coalesce(ThisItem.Tags, ""));
                    Set(varChildFTPPath1, Coalesce(ThisItem.FTPPath, ""));
                    Set(varChildBelugaRef, Coalesce(ThisItem.BelugaReference, ""));
                    Set(varChildNotes, Coalesce(ThisItem.Notes, ""));
                    Navigate(ChildInfoScreen)
                  Width: =1300
            - RS_CRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 232, 238, 1)
                  Height: =1
                  Width: =1302
                  Y: =55
            - RS_CRowTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  Height: =42
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: =If(IsBlank(ThisItem.ProductionTitle) Or ThisItem.ProductionTitle = "", "— untitled archive —", ThisItem.ProductionTitle) & If(Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "", "   ·   " & ThisItem.Title, "")
                  Width: =403
                  Y: =1
            - RS_CRowType:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =55
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: =If(IsBlank(ThisItem.MediaType), "—", If(ThisItem.MediaType = "Photo", "Photo/Reportage", ThisItem.MediaType))
                  Width: =126
                  X: =414
                  Y: =1
            - RS_CRowValid:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "" And ThisItem.Title <> "New archive"
                        And Not(IsBlank(ThisItem.MediaType)) And ThisItem.MediaType <> ""
                        And Not(IsBlank(ThisItem.ContractCase)) And ThisItem.ContractCase <> ""
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        RGBA(22, 128, 80, 1),
                        RGBA(193, 40, 40, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =55
                  OnSelect: =Select(Parent)
                  Size: =10
                  Text: |-
                    =If(
                        Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "" And ThisItem.Title <> "New archive"
                        And Not(IsBlank(ThisItem.MediaType)) And ThisItem.MediaType <> ""
                        And Not(IsBlank(ThisItem.ContractCase)) And ThisItem.ContractCase <> ""
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        "✓  Ready",
                        "⚠  Incomplete"
                    )
                  Width: =200
                  X: =634
                  Y: =1
            - RS_CRowBadge:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: |-
                    =If(
                        Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "" And ThisItem.Title <> "New archive"
                        And Not(IsBlank(ThisItem.ContractCase)) And ThisItem.ContractCase <> ""
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        RGBA(22, 128, 80, 1),
                        RGBA(193, 40, 40, 1)
                    )
                  DisabledBorderColor: =Self.BorderColor
                  DisplayMode: =DisplayMode.View
                  Fill: |-
                    =If(
                        Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "" And ThisItem.Title <> "New archive"
                        And Not(IsBlank(ThisItem.ContractCase)) And ThisItem.ContractCase <> ""
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        RGBA(240, 253, 244, 1),
                        RGBA(254, 242, 242, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =34
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =10
                  Text: |-
                    =If(
                        Not(IsBlank(ThisItem.Title)) And ThisItem.Title <> "" And ThisItem.Title <> "New archive"
                        And Not(IsBlank(ThisItem.ContractCase)) And ThisItem.ContractCase <> ""
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        "Ready",
                        "Incomplete"
                    )
                  Width: =140
                  X: =887
                  Y: =9
            - RS_CRowDelete:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(220, 224, 230, 1)
                  BorderThickness: =1
                  Color: =RGBA(193, 40, 40, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |-
                    =If(
                        IsBlank(varCurrentRequest.Status.Value)
                        Or varCurrentRequest.Status.Value = "Draft"
                        Or varCurrentRequest.Status.Value = "Pending",
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                    )
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(253, 235, 235, 1)
                  OnSelect: |-
                    =IfError(
                        If(
                            Coalesce(ThisItem.SPId, 0) > 0,
                            Remove('AV-CD-Mediafiles', LookUp('AV-CD-Mediafiles', ID = ThisItem.SPId))
                        );
                        RemoveIf(colArchives, ArchiveId = ThisItem.ArchiveId);
                        Notify("Media item removed.", NotificationType.Success),
                        Notify("Could not delete the media item: " & FirstError.Message, NotificationType.Error)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =10
                  Text: ="Remove"
                  Width: =90
                  X: =1150
                  Y: =15
            - RS_CRowApproved:
                Control: Classic/CheckBox@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                  CheckmarkFill: =RGBA(0, 0, 0, 1)
                  Default: =Coalesce(ThisItem.MediaApproved, false)
                  DisplayMode: |-
                    =// administrators approve per media file; everyone else sees the state
                    If(varUserRole = "ADMINISTRATOR" And Coalesce(ThisItem.SPId, 0) > 0, DisplayMode.Edit, DisplayMode.View)
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverColor: =RGBA(0, 18, 107, 1)
                  OnCheck: |-
                    =IfError(
                        Patch('AV-CD-Mediafiles', LookUp('AV-CD-Mediafiles', ID = ThisItem.SPId), {MediaApproved: true});
                        Patch(colArchives, ThisItem, {MediaApproved: true}),
                        Notify("Could not save the approval: " & FirstError.Message, NotificationType.Error)
                    )
                  OnUncheck: |-
                    =IfError(
                        Patch('AV-CD-Mediafiles', LookUp('AV-CD-Mediafiles', ID = ThisItem.SPId), {MediaApproved: false});
                        Patch(colArchives, ThisItem, {MediaApproved: false}),
                        Notify("Could not save the approval: " & FirstError.Message, NotificationType.Error)
                    )
                  Text: =""
                  Width: =44
                  X: =1058
                  Y: =12
      - DOA_List1RowBadge_3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =Self.BorderColor
            DisabledColor: =RGBA(0, 0, 0, 1)
            DisabledFill: =RGBA(237, 237, 237, 1)
            DisplayMode: =DisplayMode.View
            Fill: "=If(\"Draft\" in varCurrentRequest.Status.Value, Color.LightGray,\r\n   \"Pending\" in varCurrentRequest.Status.Value, Color.DarkKhaki,\r\n   \"Processing\" in varCurrentRequest.Status.Value, Color.SlateBlue,\r\n   \"Partially approved\" in varCurrentRequest.Status.Value, Color.DarkGoldenRod,\r\n   \"Approved\" in varCurrentRequest.Status.Value, Color.DarkGreen,\r\n   \"Rejected\" in varCurrentRequest.Status.Value, ColorValue(\"#F08080\"),\r\n   Color.Gray)\r\n\r\n\r\n   "
            Font: =Font.'Open Sans'
            Height: =38
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            PaddingBottom: =10
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =12
            Text: =varCurrentRequest.Status.Value
            Tooltip: ="Status"
            Visible: =Coalesce(varCurrentRequest.ID, 0) > 0
            Width: =119
            X: =1193
            Y: =78
      - RS_CardTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =34
            Size: =16
            Text: =If(Coalesce(varCurrentRequest.Status.Value, "Draft") exactin "Draft", "New Request", "Request Details")
            Width: =182
            X: =68
            Y: =65
      - RS_BtnDraftSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: |-
              =If(
                  (IsBlank(varCurrentRequest) Or IsBlank(varCurrentRequest.Status.Value)
                      Or varCurrentRequest.Status.Value = "Draft"
                      Or varCurrentRequest.Status.Value = "Pending")
                  And Not(IsBlank(Trim(RS_Title.Text)))
                  And Not(IsBlank(HomeFilterDG.Selected.Value)),
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(180, 95, 6, 1)
            Font: =Font.'Open Sans'
            Height: =43
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(120, 60, 0, 1)
            OnSelect: |-
              =// save exactly what is on screen
              Set(varRequestTitle, RS_Title.Text);
              Set(varRequestDescription, RS_Description.Text);
              Set(varRequestDG, HomeFilterDG.Selected.Value);
              If(
                  IsBlank(varRequestTitle) Or IsBlank(varRequestDG),
                  Notify("Enter the request title and select a DG/Agency before saving.", NotificationType.Warning),
              
                  IfError(
                      If(Coalesce(varCurrentRequest.ID, 0) <= 0, Set(varNextReqSeq, With(
                          {yr4: Text(Year(Today())), yr2: Right(Text(Year(Today())), 2), lastNum: Coalesce(First(Sort('AV-CD-Requests', ID, SortOrder.Descending)).RequestNumber, "")},
                          If(
                              Left(lastNum, 3) = yr2 & "-",
                              Value(Mid(lastNum, 4, 10)),
                              If(Left(lastNum, 5) = yr4 & "-", Value(Right(lastNum, 4)), 0)
                          ) + 1
                      )));
                      Set(varCurrentRequest,
                          If(
                              Coalesce(varCurrentRequest.ID, 0) > 0,
                              Patch('AV-CD-Requests', LookUp('AV-CD-Requests', ID = varCurrentRequest.ID), {
                                  ReviewerComments: If(varUserRole = "ADMINISTRATOR", RS_AdminNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).ReviewerComments),
                                  AdminNotesUpdatedOn: If(varUserRole = "ADMINISTRATOR" And RS_AdminNotes.Text <> Coalesce(varCurrentRequest.ReviewerComments, ""), Now(), varCurrentRequest.AdminNotesUpdatedOn),
                                  Notes: If((Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email)), RS_RequestorNotes.Text, LookUp('AV-CD-Requests', ID = Coalesce(varCurrentRequest.ID, 0)).Notes),
