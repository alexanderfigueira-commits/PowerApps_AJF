            Text: |-
              =With(
                  {miss:
                      Concat(
                          Filter(
                              Table(
                              {lbl: RS_LblTitle.Text, gone: RS_LblTitle.Visible And IsBlank(Trim(RS_Title.Text))},
                              {lbl: RS_LblDG.Text, gone: RS_LblDG.Visible And IsBlank(HomeFilterDG.Selected.Value)},
                              {lbl: RS_LblOwner.Text, gone: RS_LblOwner.Visible And IsEmpty(RS_Owner.SelectedItems)},
                              {lbl: RS_LblContractor.Text, gone: RS_LblContractor.Visible And IsEmpty(RS_Contractor.SelectedItems)},
                              {lbl: "Media files", gone: RS_ArchivesSection.Visible And CountRows(colArchives) = 0}
                              ),
                              gone
                          ),
                          ", " & Trim(Substitute(lbl, "*", ""))
                      )
                  },
                  If(IsBlank(miss), "", "Still to complete:  " & Mid(miss, 3))
