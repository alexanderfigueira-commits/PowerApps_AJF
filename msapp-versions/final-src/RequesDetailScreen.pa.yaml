            DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: |-
              =// every DG, straight from the column's choices: no collection to load first, sorted A-Z
              With(
                  {locAll: Sort(Choices('AV-CD-Requests'.DG), Value, SortOrder.Ascending)},
                  If(
                      // ADMINISTRATOR: every DG
                      varUserRole = "ADMINISTRATOR",
                      locAll,
                      With(
                          {locMine: Filter(locAll, Left(Value, 4) = Left(Coalesce(varUserDept, ""), 4))},
                          If(
                              // department unknown or matching no DG: keep the full list so the request can still be saved
                              IsBlank(varUserDept) Or varUserDept = "" Or IsEmpty(locMine),
                              locAll,
                              // REQUESTOR: own department only; the request's own DG stays listed even outside it
                              Filter(locAll, Left(Value, 4) = Left(varUserDept, 4) Or Value = varRequestDG)
                          )
                      )
                  )
              )
            Items.Value: =Value
            OnChange: =Set(varRequestDG, Self.Selected.Value)
            PressedColor: =Self.Color
            PressedFill: =Self.Fill
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(0, 176, 240, 1)
