      - HomeFilterDG:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: |-
              =// yellow while this mandatory field is empty
              If(RS_LblDG.Visible And IsBlank(HomeFilterDG.Selected.Value), RGBA(255, 204, 0, 1), RGBA(0, 18, 107, 1))
            BorderThickness: =If(RS_LblDG.Visible And IsBlank(HomeFilterDG.Selected.Value), 3, 2)
