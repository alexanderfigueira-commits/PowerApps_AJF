                          Patch(colMyReqs, LookUp(colMyReqs, ID = varCurrentRequest.ID), {Notes: RS_RequestorNotes.Text, RequestorNotesUpdatedOn: Now()})
                      );
                      Notify("Requestor notes saved.", NotificationType.Success);
                      UpdateContext({locShowRequestorNotes: false}),
                      Notify("Requestor notes could not be saved: " & FirstError.Message, NotificationType.Error)
                  ),
                  // new request: the text stays in the box and is saved with Save Draft / Submit
                  Notify("Notes kept. They are saved with the request when you press Save Draft or Submit.", NotificationType.Information);
                  UpdateContext({locShowRequestorNotes: false})
              )
            PressedBorderColor: =RGBA(0, 0, 0, 1)
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="Save"
            Tooltip: ="Save draft"
            Visible: =locShowRequestorNotes And (Coalesce(varCurrentRequest.ID, 0) <= 0 Or Lower(varCurrentRequest.'Created By'.Email) = Lower(User().Email))
            Width: =200
            X: =843
            Y: =490
            ZIndex: =122
          Children: []
