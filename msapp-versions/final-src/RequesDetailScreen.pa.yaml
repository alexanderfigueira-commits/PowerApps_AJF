      - RS_ArchiveOnlyCheck:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Color: =RGBA(0, 0, 0, 1)
            Default: =varRequestArchivingOnly
            DisplayMode: =If(varRequestorLocked, DisplayMode.View, DisplayMode.Edit)
            Font: =Font.'Open Sans'
            Height: =44
            HoverColor: =RGBA(0, 18, 107, 1)
            OnCheck: |-
              =Set(varRequestArchivingOnly, true);
              // a saved request stores the answer straight away, so it survives opening a media item and coming back
              If(
                  Coalesce(varCurrentRequest.ID, 0) > 0 And Coalesce(varCurrentRequest.ArchivingOnly, false) <> true,
                  IfError(
                      Set(varCurrentRequest, Patch('AV-CD-Requests', LookUp('AV-CD-Requests', ID = varCurrentRequest.ID), {ArchivingOnly: true})),
                      Notify("Could not save the answer: " & FirstError.Message, NotificationType.Error)
                  )
              )
            OnUncheck: |-
              =Set(varRequestArchivingOnly, false);
              // a saved request stores the answer straight away, so it survives opening a media item and coming back
              If(
                  Coalesce(varCurrentRequest.ID, 0) > 0 And Coalesce(varCurrentRequest.ArchivingOnly, false) <> false,
                  IfError(
                      Set(varCurrentRequest, Patch('AV-CD-Requests', LookUp('AV-CD-Requests', ID = varCurrentRequest.ID), {ArchivingOnly: false})),
                      Notify("Could not save the answer: " & FirstError.Message, NotificationType.Error)
                  )
              )
            Size: =10
            Text: ="Archiving only, not publication"
            Visible: =Not(locDetailsCollapsed)
            Width: =374
            X: =916
            Y: =276
            ZIndex: =8
          Children: []
