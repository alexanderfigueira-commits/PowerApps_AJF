Screens:
  PrintVideoDetailScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =// media rows of the request chosen on HomePrintScreen (delegable filter)
        ClearCollect(
            colPrintReqMedia,
            Sort(
                Filter('AV-CD-Mediafiles', ParentRequest = varPrintRequest.RequestNumber),
                ID,
                SortOrder.Ascending
            )
        );
        UpdateContext({locPrintPage: 1})
    Children:
      - PVD_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =56
            Width: =1366
      - PVD_BtnBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(60, 66, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(247, 248, 250, 1)
            OnSelect: =Back()
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="← Back"
            Visible: =Not(locPrinting)
            Width: =100
            X: =32
            Y: =68
      - PVD_Heading:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =36
            Size: =16
            Text: |-
              ="🎬  Video Production"
            Width: =500
            X: =132
            Y: =69
      - PVD_BtnPrint:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: |-
              =UpdateContext({locPrinting: true});
              Download(PDF(PrintVideoDetailScreen));
              UpdateContext({locPrinting: false})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="⬇  PDF (this file)"
            Visible: =Not(locPrinting)
            Width: =170
            X: =1002
            Y: =68
