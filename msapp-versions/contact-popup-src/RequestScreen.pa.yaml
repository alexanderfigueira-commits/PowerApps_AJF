                  "Published", RGBA(122, 48, 160, 1),
                  "Pending", RGBA(255, 243, 224, 1),
                  "Submitted", RGBA(230, 236, 245, 1),
                  "Rejected", RGBA(253, 235, 235, 1),
                  "Draft", RGBA(240, 242, 246, 1),
                  RGBA(240, 242, 246, 1))
