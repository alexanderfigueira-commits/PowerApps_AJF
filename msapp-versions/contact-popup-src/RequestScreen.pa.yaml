              =If(IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0, "New",
                 If(IsBlank(varCurrentRequest.Status.Value), "Draft", varCurrentRequest.Status.Value))
              & If(Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0 And Not(IsBlank(varCurrentRequest.Modified)),
