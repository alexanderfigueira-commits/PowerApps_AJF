Screens:
  RequestScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(
            varUserDept,
            Office365Users.MyProfile().Department
        );
        Set(
            varShowTypeConfirm,
            false
        );
        UpdateContext(
            {
                locShowDetails: true,
                locShowMedia: true
            }
        );
        If(
            (IsBlank(varRequestMediaType) Or varRequestMediaType = "") And (IsBlank(varCurrentRequest) Or Coalesce(
                varCurrentRequest.ID,
                0
            ) <= 0),
            Set(
                varShowTypeConfirm,
                true
            )
        );
        Set(
            varConfirmed,
            false
        );
        Set(
            varCurrentChildId,
            ""
        );
        Clear(colArchives);
        If(
            Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0,
            Refresh(AVCentralDepositMediaItems);
            ForAll(
                Sort(
                    Filter(
                        AVCentralDepositMediaItems,
                        ParentRequest = varCurrentRequest.RequestNumber
                    ),
                    Modified,
                    SortOrder.Descending
                ),
                Collect(
                    colArchives,
                    {
                        ArchiveId: Text(ID),
                        SPId: ID,
                        Title: CD_MediaNumber,
                        ProductionTitle: Coalesce(
                            ProductionTitle,
                            ""
                        ),
                        MediaType: Coalesce(
                            First(MediaType).Value,
                            ""
                        ),
                        Description: Coalesce(
                            Description,
                            ""
                        ),
                        CaptureDate: CaptureDate,
                        ProductionPlace: Coalesce(
                            ProductionPlace,
                            ""
                        ),
                        ProductType: Coalesce(
                            First(ProductType).Value,
                            ""
                        ),
                        SeriesTitle: Coalesce(
                            SeriesTitle,
                            ""
                        ),
                        EpisodeTitle: Coalesce(
                            EpisodeTitle,
                            ""
                        ),
                        EpisodeSummary: Coalesce(
                            EpisodeSummary,
                            ""
                        ),
                        SeasonNumber: Coalesce(
                            SeasonNumber,
                            0
                        ),
                        EpisodeNumber: Coalesce(
                            EpisodeNumber,
                            0
                        ),
                        ProductionEndDate: ProductionEndDate,
                        PublicationStartDate: PublicationStartDate,
                        PublicationEndDate: PublicationEndDate,
                        ReferenceLinks: Coalesce(
                            ReferenceLinks,
                            ""
                        ),
                        Tags: Coalesce(
                            Tags,
                            ""
                        ),
                        FTPPath: Coalesce(
                            FTPPath,
                            ""
                        ),
                        LanguageVersions: Coalesce(
                            First(LanguageVersions).Value,
                            ""
                        ),
                        PhotoCaption: Coalesce(
                            PhotoCaption,
                            ""
                        ),
                        Credits: Coalesce(
                            CreditContact,
                            ""
                        ),
                        ContractingAuthority: Coalesce(
                            ContractingAuthority,
                            ""
                        ),
                        ExecProducer: Coalesce(
                            ExecProducerName,
                            ""
                        ),
                        Producer: ForAll(
                            Producer As p,
                            {
                                DisplayName: p.DisplayName,
                                Mail: p.Email
                            }
                        ),
                        AIVoiceover: AIVoiceover = "Yes",
                        ContractCase: Coalesce(
                            First(ContractCase).Value,
                            ""
                        ),
                        ContractCase1Sub: Coalesce(
                            First(ContractCase1Sub).Value,
                            ""
                        ),
                        ModelRelease: false,
                        ModelReleaseProvided: Coalesce(
                            ModelReleaseProvided,
                            false
                        ),
                        MusicUsed: Coalesce(
                            MusicUsed,
                            false
                        ),
                        MusicLicenceProvided: Coalesce(
                            MusicLicenseProvided,
                            false
                        ),
                        Preexisting: false,
                        PreexistingProvided: Coalesce(
                            PreexistingRightsProvided,
                            false
                        )
                    }
                )
            )
        );
        If(
            CountRows(colArchives) > 0,
            Set(
                varRequestMediaType,
                First(colArchives).MediaType
            )
        );
        Set(varRequestDG, HomeFilterDG.Selected.Value);
        Set(locShowContactPopup, false)
