    "HomeGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Height: =282
        Items: |-
            =Filter(
                AVCentralDepositRequests,
                varUserRole = "ADMINISTRATOR" Or 'Created By'.Email = User().Email,
                varFilter = "All" Or Status.Value = varFilter,
                varFilterDG = "All" Or IsBlank(varFilterDG) Or DG.Value = varFilterDG,
                IsBlank(varFilterRequestName) Or varFilterRequestName = "" Or StartsWith(RequestTitle, varFilterRequestName),
                IsEmpty(cmbFilterAssignee.SelectedItems) Or "All" in cmbFilterAssignee.SelectedItems.Value Or First(DG_Agency_Contact).DisplayName in cmbFilterAssignee.SelectedItems.Value,
                IsBlank(varFilterStartDate) Or StartRequestDate >= varFilterStartDate,
                IsBlank(varFilterEndDate) Or EndRequestDate <= varFilterEndDate,
                IsBlank(locProdTypeFilter) Or
                    !IsEmpty(
                        Filter(
                            AVCentralDepositMediaItems,
                            ParentRequest = RequestNumber And First(MediaType).Value = locProdTypeFilter
                        )
                    )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =60
        Width: =1270
        X: =46
        Y: =412
        ZIndex: =18

        HomeRowSelect As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =59
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varCurrentRequest, ThisItem);
                Set(varRequestTitle1, Coalesce(ThisItem.RequestNumber, ""));
                Set(varRequestDG, Coalesce(ThisItem.DG.Value, ""));
                Set(varRequestDescription1, Coalesce(ThisItem.Description, ""));
                Set(varRequestOwnerContact, Coalesce(First(ThisItem.DG_Agency_Contact).DisplayName, ""));
                Set(varRequestMediaType, "");
                Navigate(RequestScreen, ScreenTransition.Cover)
            Width: =1270
            ZIndex: =1

        HomeRowDivider As rectangle:
