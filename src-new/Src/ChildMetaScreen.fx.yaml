ChildMetaScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =If(varChildMediaType = "Photo" And (IsEmpty(colPhotoCaptions) Or varPhotoCaptionsChildId <> varCurrentChildId),
            ClearCollect(colPhotoCaptions, {Name: "", Caption: ""});
            Set(varPhotoCaptionsChildId, varCurrentChildId);
            Set(varChildContractingAuthority, ""));
        If(varChildMediaType = "Video" And varVideoMetaChildId <> varCurrentChildId,
            Set(varVideoMetaChildId, varCurrentChildId);
            Set(varChildProducer, "");
            Set(varChildExecProducer, "");
            Set(varChildScript, "");
            Set(varChildSubtitlesProvided, false))

