    StatGeneral As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =10
        Size: =12
        Text: |-
            =If(
                Not(IsBlank(varTitle)) And Not(IsBlank(varLead)) And Not(IsBlank(varDG)),
                "Complete",
                If(Not(IsBlank(varTitle)) Or Not(IsBlank(varDG)) Or Not(IsBlank(varBudget)), "Needs review", "Not started")
            )
        Visible: =false
        Width: =10
        X: =0
        Y: =0
        ZIndex: =47

    StatObjectives As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =10
        Size: =12
        Text: |-
            =If(
                Not(IsBlank(varObjective)) And Not(IsBlank(varStartDate)) And Not(IsBlank(varEndDate)) And varEndDate >= varStartDate
                    And Not(IsBlank(varOutcome)) And Not(IsBlank(varKpiViews)) And Not(IsError(Value(varKpiViews))) And Not(IsBlank(varKpiSubs)) And Not(IsError(Value(varKpiSubs))),
                "Complete",
                If(Not(IsBlank(varObjective)) Or Not(IsBlank(varStartDate)) Or Not(IsBlank(varEndDate)) Or Not(IsBlank(varOutcome)) Or Not(IsBlank(varKpiViews)) Or Not(IsBlank(varKpiVTR)) Or Not(IsBlank(varKpiSubs)) Or Not(IsBlank(varKpiCPS)) Or Not(IsBlank(varKpiOther)), "Needs review", "Not started")
            )
        Visible: =false
        Width: =10
        X: =0
        Y: =0
        ZIndex: =48

    StatAudience As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =10
        Size: =12
        Text: |-
            =If(
                Not(IsBlank(varAges)) And Not(IsBlank(varLanguages)) And Not(IsBlank(varCountries)),
                "Complete",
                If(Not(IsBlank(varAges)) Or Not(IsBlank(varLanguages)) Or Not(IsBlank(varCountries)) Or Not(IsBlank(varInterests)), "Needs review", "Not started")
            )
        Visible: =false
        Width: =10
        X: =0
        Y: =0
        ZIndex: =49

    StatAttachments As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =10
        Size: =12
        Text: =If(varAttachCount > 0, "Complete", "Not started")
        Visible: =false
        Width: =10
        X: =0
        Y: =0
        ZIndex: =50

    StatDelivery As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =10
        Size: =12
        Text: |-
            =If(
                varAck1 And varAck2 And (Not(varContractorOn) Or Not(IsBlank(varContractor))),
                "Complete",
                If(
                    varContractorOn Or varAck1 Or varAck2 Or Not(IsBlank(varContractor)) Or Not(IsBlank(varContractRef)) Or Not(IsBlank(varReportDue)) Or Not(IsBlank(varNotes)),
                    "Needs review",
                    "Not started"
                )
            )
        Visible: =false
        Width: =10
        X: =0
        Y: =0
        ZIndex: =51

