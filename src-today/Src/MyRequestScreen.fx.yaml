    "HomeGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Height: =330
        Items: |-
            =Filter(
                AVCentralDepositProjects,
                'Created By'.Email = User().Email,
                varFilter = "All" Or Status.Value = varFilter,
                varFilterDG = "" Or IsBlank(varFilterDG) Or StartsWith(DG, varFilterDG),
                varFilterRequest = "" Or IsBlank(varFilterRequest) Or StartsWith(Title, varFilterRequest),
                varFilterArchive = "" Or IsBlank(varFilterArchive) Or
                    CountRows(Filter(CentralDepositMainList, ParentProject.Id = ID And StartsWith(Project, varFilterArchive))) > 0,
                IsBlank(varFilterStartDate) Or StartRequestDate >= varFilterStartDate,
                IsBlank(varFilterEndDate) Or EndRequestDate <= varFilterEndDate
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =60
        Width: =1270
        X: =48
        Y: =368
        ZIndex: =18

        HomeRowSelect As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =59
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varCurrentRequest, ThisItem);
                Set(varRequestTitle, ThisItem.Title);
                Set(varRequestDG, ThisItem.DG);
                Set(varRequestDescription, Coalesce(ThisItem.Description, ""));
                Set(varRequestOwnerContact, ThisItem.OwnerContact);
                Set(varRequestOwnerEmail, ThisItem.OwnerEmail);
                Navigate(RequestScreen)
            Width: =1270
            ZIndex: =1

        HomeRowDivider As rectangle:
