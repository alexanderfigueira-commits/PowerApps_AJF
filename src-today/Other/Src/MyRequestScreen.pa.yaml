      - HomeGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =330
            Items: |-
              =Filter(
                  AVCentralDepositProjects,
                  'Created By'.Email = User().Email,
                  varFilter = "All" Or Status.Value = varFilter,
                  varFilterDG = "" Or IsBlank(varFilterDG) Or StartsWith(DG, varFilterDG),
                  varFilterRequest = "" Or IsBlank(varFilterRequest) Or StartsWith(Title, varFilterRequest),
                  varFilterArchive = "" Or IsBlank(varFilterArchive) Or
                      CountRows(Filter(CentralDepositMainList, ParentProject.Id = ID And StartsWith(Project, varFilterArchive))) > 0,
                  IsBlank(varFilterStartDate) Or StartRequestDate >= varFilterStartDate,
                  IsBlank(varFilterEndDate) Or EndRequestDate <= varFilterEndDate
              )
            TemplateSize: =60
            Width: =1270
            X: =48
            Y: =368
          Children:
            - HomeRowSelect:
