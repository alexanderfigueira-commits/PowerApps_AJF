      - HomeGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =420
            Items: |-
              =If(
                  varFilter = "All",
                  Filter('CentralDepositMainList', 'Created By'.Email = User().Email),
                  Filter('CentralDepositMainList', 'Created By'.Email = User().Email, DepositStatus.Value = varFilter)
              )
            TemplateSize: =60
            Width: =1270
            X: =48
            Y: =278
          Children:
            - HomeRowSelect:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =59
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: =Set(varSelectedRequest, ThisItem); Navigate(NewRequestScreen)
                  Width: =1270
            - HomeRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 232, 238, 1)
                  Height: =1
                  Width: =1270
                  Y: =59
            - HomeRowProject:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Text: =If(IsBlank(ThisItem.Project), "Untitled request", ThisItem.Project)
                  Width: =510
                  X: =20
            - HomeRowType:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Text: =If(IsBlank(ThisItem.MediaType), "—", ThisItem.MediaType.Value)
                  Width: =220
                  X: =552
            - HomeRowSubmitted:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =59
                  OnSelect: =Select(Parent)
                  Text: =If(IsBlank(ThisItem.Created), "—", Text(ThisItem.Created, "dd mmm yyyy"))
                  Width: =200
                  X: =792
            - HomeRowBadge:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: |-
                    =Switch(ThisItem.DepositStatus.Value,
                        "Approved", RGBA(22, 128, 80, 1),
                        "Pending Approval", RGBA(180, 95, 6, 1),
                        "New", RGBA(56, 96, 178, 1),
                        "Rejected", RGBA(193, 40, 40, 1),
                        "Published", RGBA(13, 110, 113, 1),
                        RGBA(96, 104, 120, 1))
                  DisabledBorderColor: =Self.BorderColor
                  DisplayMode: =DisplayMode.View
                  Fill: |-
                    =Switch(ThisItem.DepositStatus.Value,
                        "Accepted", RGBA(223, 245, 233, 1),
                        "Pending Approval", RGBA(255, 247, 230, 1),
                        "New", RGBA(230, 236, 245, 1),
                        "Not Accepted", RGBA(253, 235, 235, 1),
                        RGBA(240, 242, 246, 1))
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =11
                  Text: =If(IsBlank(ThisItem.DepositStatus.Value), "—", ThisItem.DepositStatus.Value)
                  Width: =150
                  X: =1032
                  Y: =16
