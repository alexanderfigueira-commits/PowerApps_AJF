          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            IconBackground: =RGBA(56, 96, 178, 1)
            IconFill: =RGBA(255, 255, 255, 1)
            Width: =300
            X: =56
            Y: =440
      - MI_LblLanguage:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="Language version(s)"
            Width: =300
            X: =388
            Y: =414
      - MI_Language:
          Control: Classic/ComboBox@2.4.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            DefaultSelectedItems: =First(ComboBoxSample)
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: =["EN", "FR", "DE", "ES", "IT", "PL", "NL", "Multilingual"]
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Width: =300
            X: =388
            Y: =440
      - MI_LblCredits:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: =If(varMediaType="Photo", "Photographer / agency", If(varMediaType="Audio" Or varMediaType="Podcast", "Presenter / producer", "Director / producer"))
            Width: =500
            X: =720
            Y: =414
      - MI_Credits:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =""
            Font: =Font.'Open Sans'
            HintText: ="Production credits"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Width: =566
            X: =720
            Y: =440
      - MI_LblFTP:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="FTP delivery path *  (where the master files were delivered)"
            Width: =900
            X: =56
            Y: =504
      - MI_FTP:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =varFTPPath
            Font: =Font.'Open Sans'
            HintText: ="ftp://avdeposit.ec.europa.eu/incoming/2026/…"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            OnChange: =Set(varFTPPath, Self.Value)
            Width: =1230
            X: =56
            Y: =530
      - MI_AICheck:
          Control: Classic/CheckBox@2.1.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            CheckboxBorderColor: =RGBA(0, 18, 107, 1)
            CheckmarkFill: =RGBA(0, 0, 0, 1)
            Font: =Font.'Open Sans'
            Height: =40
            HoverColor: =RGBA(0, 18, 107, 1)
            OnCheck: =Set(varAIVoiceover, true)
            OnUncheck: =Set(varAIVoiceover, false)
            Text: ="This production uses an AI-generated voice-over"
            Width: =700
            X: =52
            Y: =588
