            Width: =840
            X: =56
            Y: =184
      - MI_LblTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="Descriptive title *"
            Width: =600
            X: =56
            Y: =224
      - MI_Title:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =varEventTitle
            Font: =Font.'Open Sans'
            HintText: ="Title as it should appear in the AV catalogue"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            OnChange: =Set(varEventTitle, Self.Value)
            Width: =1230
            X: =56
            Y: =250
      - MI_LblDesc:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =22
            Text: ="Description *"
            Width: =600
            X: =56
            Y: =302
      - MI_Desc:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =varDescription
            Font: =Font.'Open Sans'
            Height: =72
            HintText: ="Editorial description, context and keywords (max 500 characters)"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Mode: =TextMode.MultiLine
            OnChange: =Set(varDescription, Self.Value)
            Width: =1230
            X: =56
            Y: =328
