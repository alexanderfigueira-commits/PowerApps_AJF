Screens:
  ConfirmationScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - CF_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =64
            Width: =1366
      - CF_AppTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =16
            Text: ="AV Central Deposit"
            Width: =400
            X: =24
      - CF_Circle:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(223, 245, 233, 1)
            Height: =110
            Width: =110
            X: =(Parent.Width - Self.Width) / 2
            Y: =150
      - CF_Check:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(22, 128, 80, 1)
            Font: =Font.'Open Sans'
            Height: =110
            Size: =54
            Text: ="✓"
            Width: =110
            X: =(Parent.Width - Self.Width) / 2
            Y: =150
      - CF_Title:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =24
            Text: ="Your request has been submitted"
            Width: =Parent.Width
            Y: =280
      - CF_Subtitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Size: =14
            Text: ="The Central Deposit team will review it and may contact your point of contact for clarification."
            Width: =Parent.Width
            Y: =324
      - CF_RefCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(186, 202, 226, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =120
            Width: =440
            X: =(Parent.Width - Self.Width) / 2
            Y: =376
      - CF_RefLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: ="YOUR TICKET REFERENCE"
            Width: =440
            X: =(Parent.Width - 440) / 2
            Y: =396
      - CF_RefValue:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =32
            Text: =Coalesce(varTicketRef, "CD-PENDING")
            Width: =440
            X: =(Parent.Width - 440) / 2
            Y: =424
      - CF_EmailNote:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: ="A copy of this reference is kept against your request in My requests."
            Width: =Parent.Width
            Y: =516
      - CF_BtnHome:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =46
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: |-
              =Set(varProjectName, Blank());
              Set(varContact, Blank());
              Set(varFTPPath, Blank());
              Set(varContractCase, Blank());
              Set(varContractRef, Blank());
              Set(varModelRelease, false);
              Set(varMusicLicence, false);
              Set(varPreexisting, false);
              Set(varMediaType, "Photo");
              Navigate(HomeScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="Back to My requests"
            Width: =260
            X: =(Parent.Width - Self.Width) / 2
            Y: =560
