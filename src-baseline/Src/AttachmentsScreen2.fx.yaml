        Width: =1366
        Y: =52
        ZIndex: =4

    AT_Tab1 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(NewRequestScreen)
        Size: =13
        Text: ="✓  1.  Info"
        Width: =150
        X: =16
        Y: =52
        ZIndex: =5

    AT_Tab2 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(MediaInfoScreen)
        Size: =13
        Text: ="✓  2.  Metadata"
        Width: =170
        X: =176
        Y: =52
        ZIndex: =6

    AT_Tab3 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(DocumentationScreen)
        Size: =13
        Text: ="✓  3.  Legal docs"
        X: =356
        Y: =52
        ZIndex: =7

    AT_Tab4 As button:
        BorderThickness: =0
        Color: =RGBA(0, 18, 107, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(255, 255, 255, 1)
        Size: =13
        Text: ="4.  Attachments"
        Width: =170
        X: =526
        Y: =52
        ZIndex: =8

    AT_Tab4Line As rectangle:
        Height: =3
        Width: =170
        X: =526
        Y: =99
        ZIndex: =9

    AT_Title As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =18
        Text: ="Attachments & annexes"
        Width: =800
        X: =32
        Y: =122
        ZIndex: =10

    AT_Sub As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =24
        Text: ="Master media are delivered by FTP (recorded on the Metadata tab). Attach legal annexes and small documents here."
        Width: =1000
        X: =32
        Y: =152
        ZIndex: =11

    AT_AnnexLbl As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =22
        Text: ="Legal annexes & supporting documents"
        Width: =800
        X: =32
        Y: =190
        ZIndex: =12

    AT_Annex As attachments:
        BorderColor: =RGBA(220, 224, 230, 1)
        Height: =180
        MaxAttachments: =20
        Width: =1286
        X: =32
        Y: =216
        ZIndex: =13

    AT_ChecklistCard As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(250, 251, 252, 1)
        Height: =184
        Width: =1286
        X: =32
        Y: =410
        ZIndex: =14

    AT_ChecklistTitle As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =24
        Size: =12
        Text: ="SUBMISSION CHECKLIST"
        Width: =800
        X: =56
        Y: =422
        ZIndex: =15

    AT_Chk1 As label:
        Color: =If(Not(IsBlank(varProjectName)), RGBA(22,128,80,1), RGBA(193,40,40,1))
        Height: =26
        Text: =If(Not(IsBlank(varProjectName)), "✓  Project title provided", "✗  Project title missing (Info tab)")
        Width: =600
        X: =56
        Y: =450
        ZIndex: =16

    AT_Chk2 As label:
        Color: =If(Not(IsBlank(varContact)), RGBA(22,128,80,1), RGBA(193,40,40,1))
        Height: =26
        Text: =If(Not(IsBlank(varContact)), "✓  Point of contact provided", "✗  Point of contact missing (Info tab)")
        Width: =600
        X: =56
        Y: =478
        ZIndex: =17

    AT_Chk3 As label:
        Color: =If(Not(IsBlank(varFTPPath)), RGBA(22,128,80,1), RGBA(193,40,40,1))
        Height: =26
        Text: =If(Not(IsBlank(varFTPPath)), "✓  FTP delivery path provided", "✗  FTP delivery path missing (Metadata tab)")
        Width: =600
        X: =56
        Y: =506
        ZIndex: =18

    AT_Chk4 As label:
        Color: =If(Not(IsBlank(varContractCase)), RGBA(22,128,80,1), RGBA(193,40,40,1))
        Height: =26
        Text: =If(Not(IsBlank(varContractCase)), "✓  Contract case selected", "✗  Contract case not selected (Legal docs tab)")
        Width: =600
        X: =640
        Y: =450
        ZIndex: =19

    AT_Chk5 As label:
        Color: =If(Not(varModelRelease) Or CountRows(AT_Annex.Attachments) > 0, RGBA(22,128,80,1), RGBA(193,40,40,1))
        Height: =26
        Text: =If(Not(varModelRelease), "✓  Model release — not required", If(CountRows(AT_Annex.Attachments) > 0, "✓  Model release annex attached", "✗  Model release forms required (attach above)"))
        Width: =620
        X: =640
        Y: =478
        ZIndex: =20

    AT_WorkflowLbl As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =24
        Size: =12
        Text: |-
            ="On submit, a ticket is created and a unique reference is returned. Lifecycle: New → Pending Approval → Accepted / Rejected →  Published"
        Width: =1286
        X: =32
        Y: =608
        ZIndex: =21

    AT_BottomBar As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =56
        Width: =1366
        Y: =712
        ZIndex: =22

    AT_BtnPrev As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(60, 66, 80, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(DocumentationScreen)
        Size: =14
        Text: ="←  Previous"
        Width: =140
        X: =32
        Y: =720
        ZIndex: =23

    AT_MissingNote As label:
        Align: =Align.Right
        Color: =RGBA(193, 40, 40, 1)
        Size: =12
        Text: =If((Not(IsBlank(varProjectName)) And Not(IsBlank(varContact)) And Not(IsBlank(varFTPPath)) And Not(IsBlank(varContractCase))), "", "Complete the required fields to submit")
        Width: =360
        X: =770
        Y: =720
        ZIndex: =24

    AT_BtnSubmit As button:
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: =If((Not(IsBlank(varProjectName)) And Not(IsBlank(varContact)) And Not(IsBlank(varFTPPath)) And Not(IsBlank(varContractCase))), DisplayMode.Edit, DisplayMode.Disabled)
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =Set(varNewTicket,
                Patch(CentralDepositMainList,
                    Defaults(CentralDepositMainList)'),
                    { Project: If(IsBlank(varProjectName), "Untitled request", varProjectName) }
                )
            );
            // TODO: extend the Patch with the new columns once added to the SharePoint list:
            // PointOfContact: varContact, ContactEmail: varContactEmail, MediaType: {Value: varMediaType},
            // FTPPath: varFTPPath, ContractCase: {Value: varContractCase}, ContractRef: varContractRef,
            // AIVoiceover: varAIVoiceover, MusicLicence: varMusicLicence, PreexistingRights: varPreexisting
            Set(varTicketRef, "CD-" & Text(Year(Now())) & "-" & Text(varNewTicket.ID));
            Navigate(ConfirmationScreen)
        Size: =14
        Text: =If((Not(IsBlank(varProjectName)) And Not(IsBlank(varContact)) And Not(IsBlank(varFTPPath)) And Not(IsBlank(varContractCase))), "Submit request", "Submit request (incomplete)")
        Width: =240
        X: =1100
        Y: =720
        ZIndex: =25

    Label12_6 As label:
        Align: =Align.Center
        AutoHeight: =true
        Color: =RGBA(149, 149, 149, 1)
        FontWeight: =FontWeight.Semibold
        Size: =11
        Text: |-
            ="Audiovisual Service - DG COMM
            This site is managed by the Directorate-General for Communication"
        Width: =691
        X: =265
        Y: =717
        ZIndex: =26

