        Height: =52
        Width: =1366
        ZIndex: =1

    AT_Back As button:
        BorderThickness: =0
        Color: =RGBA(186, 202, 226, 1)
        Fill: =RGBA(0, 18, 107, 1)
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(HomeScreen)
        Size: =13
        Text: ="←  My requests"
        X: =16
        Y: =10
        ZIndex: =2

    AT_Breadcrumb As label:
        Color: =RGBA(186, 202, 226, 1)
        Height: =52
        Text: =" /  " & If(IsBlank(varProjectName), "New request", varProjectName)
        Width: =500
        X: =184
        ZIndex: =3

    AT_TabsBg As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
