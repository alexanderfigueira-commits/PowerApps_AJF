                  FontWeight: =FontWeight.Bold
                  Height: =43
                  Size: =16
                  Text: =If(ThisItem.Pass, "✓", "✗")
                  Width: =44
                  X: =16
            - CV_RowCheck:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =If(ThisItem.Pass, RGBA(22,128,80,1), RGBA(80,40,40,1))
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.Pass, FontWeight.Normal, FontWeight.Semibold)
                  Height: =43
