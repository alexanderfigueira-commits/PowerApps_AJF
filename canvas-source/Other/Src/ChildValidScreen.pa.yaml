      - CV_BtnRefresh:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(60, 66, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(247, 248, 250, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(230, 236, 245, 1)
            OnSelect: |-
              =ClearCollect(colValidations,
                  {Check: "Media type is set", Pass: Not(IsBlank(varChildMediaType)) And varChildMediaType <> "", Note: "Select a production type on the Info tab."},
                  {Check: "Archive title is provided", Pass: Not(IsBlank(varChildTitle)) And varChildTitle <> "" And varChildTitle <> "New archive", Note: "Enter a descriptive title on the Info tab."},
                  {Check: "Capture / production date is set", Pass: Not(IsBlank(varChildCaptureDate)), Note: "Set the production date on the Info tab."},
                  {Check: "Language version(s) selected", Pass: Not(IsBlank(varChildLanguageVersions)) And varChildLanguageVersions <> "", Note: "Select at least one language on the Metadata tab."},
                  {Check: "No AI-generated voice-over (not accepted)", Pass: Not(varChildAIVoiceover), Note: "⛔ AI voice-over detected. This archive cannot be submitted."},
                  {Check: "Contract case (1–6) is selected", Pass: Not(IsBlank(varChildContractCase)) And varChildContractCase <> "", Note: "Select a contract case on the Legal & Docs tab."},
                  {Check: "Case 1 sub-type selected (if Case 1)", Pass: Left(varChildContractCase, 6) <> "Case 1" Or (Not(IsBlank(varChildContractCase1Sub)) And varChildContractCase1Sub <> ""), Note: "Select the framework / specific / offer sub-type on the Legal & Docs tab."},
                  {Check: "Contract reference number provided", Pass: Not(IsBlank(varChildContractRef)) And varChildContractRef <> "", Note: "Enter the contract reference on the Legal & Docs tab."},
                  {Check: "Photographer / agency provided (Photo only)", Pass: varChildMediaType <> "Photo" Or (Not(IsBlank(varChildCredits)) And varChildCredits <> ""), Note: "Enter the photographer / agency on the Metadata tab."},
                  {Check: "Model release: if persons appear → forms provided", Pass: Not(varChildModelRelease) Or varChildModelReleaseProvided, Note: "Recognisable persons declared but model release not confirmed. Attach forms on Legal & Docs."},
                  {Check: "Music licence: if music used → documentation provided", Pass: Not(varChildMusicUsed) Or varChildMusicLicenceProvided, Note: "Music declared but licence/annex not confirmed. Attach on Legal & Docs."},
                  {Check: "Pre-existing rights: if declared → annex provided", Pass: Not(varChildPreexisting) Or varChildPreexistingProvided, Note: "Pre-existing rights declared but annex not confirmed. Attach on Legal & Docs."},
                  {Check: "FTP delivery path set on this archive", Pass: Not(IsBlank(varChildFTPPath)) And varChildFTPPath <> "", Note: "Enter the FTP path on the Info tab."},
                  {Check: "Owner / point of contact set on the request", Pass: Not(IsBlank(varRequestOwnerContact)) And varRequestOwnerContact <> "", Note: "Set the owner on the Request screen."}
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =12
            Text: ="↻  Re-check"
            Width: =120
