            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Text: =User().FullName
            Width: =204
            X: =1103
            Y: =18
      - Logo_EC_CM:
          Control: Image@2.2.3
          Group: Header_CM
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =57
            Image: ='logo--en'
            PaddingLeft: =15
            Width: =218
            X: =564
      - CD_Logo_CM:
          Control: Image@2.2.3
          Group: Header_CM
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =47
            Image: =cd_badge_play
            Width: =44
            X: =25
            Y: =6
      - HomeAppSubtitle_CM:
          Control: Label@2.5.1
          Group: Header_CM
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =25
            Size: =10
            Text: ="Ticket System"
            VerticalAlign: =VerticalAlign.Top
            Width: =149
            X: =111
            Y: =28
      - Image1_CM:
          Control: Image@2.2.3
          Group: Header_CM
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =56
            Image: =User().Image
            RadiusBottomLeft: =3
            RadiusBottomRight: =3
            RadiusTopLeft: =3
            RadiusTopRight: =3
            Tooltip: |-
              =Office365Users.MyProfile().JobTitle & " " & User().FullName & Char(13) &
              Office365Users.MyProfile().MailNickname & " | " &Office365Users.MyProfile().Department
            Width: =61
            X: =1299
