Screens:
  RequestScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(varCurrentChildId, "");
        Clear(colArchives);
        If(
            Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0,
            Refresh(CentralDepositMainList);
            ForAll(
                Sort(Filter(CentralDepositMainList, ParentProject.Id = varCurrentRequest.ID), Modified, SortOrder.Descending),
                Collect(colArchives, {
                    ArchiveId: Text(ID),
                    SPId: ID,
                    Title: Project,
                    MediaType: MediaType.Value,
                    Description: Coalesce(Description, ""),
                    CaptureDate: CaptureDate,
                    ProductionPlace: Coalesce(ProductionPlace, ""),
                    ProductType: Coalesce(ProductType, ""),
                    SeriesTitle: Coalesce(SeriesTitle, ""),
                    EpisodeTitle: Coalesce(EpisodeTitle, ""),
                    EpisodeSummary: Coalesce(EpisodeSummary, ""),
                    SeasonNumber: Coalesce(SeasonNumber, 0),
                    EpisodeNumber: Coalesce(EpisodeNumber, 0),
                    ProductionEndDate: PublicationEndDate,
                    PublicationStartDate: PublicationStartDate,
                    PublicationEndDate: ProductionEndDate,
                    ReferenceLinks: Coalesce(ReferenceLinks, ""),
                    Tags: Coalesce(Tags, ""),
                    FTPPath: Coalesce(FTPPath, ""),
                    LanguageVersions: Coalesce(LanguageVersions.Value, ""),
                    Credits: Coalesce(Photographer, Director, Producer, ""),
                    AIVoiceover: Coalesce(AIVoiceover, false),
                    ContractCase: Coalesce(ContractCase.Value, ""),
                    ContractCase1Sub: "",
                    ContractRef: Coalesce(ContractReference, ""),
                    ModelRelease: false,
                    ModelReleaseProvided: false,
                    MusicUsed: Coalesce(MusicUsed, false),
                    MusicLicenceProvided: Coalesce(MusicLicenseProvided, false),
                    Preexisting: false,
                    PreexistingProvided: Coalesce(PreexistingRightsProvided, false)
                })
            )
        )
    Children:
      - RS_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =52
            Width: =1366
      - RS_Back:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(186, 202, 226, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: =Navigate(HomeScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="←  My requests"
            X: =16
            Y: =10
      - RS_Breadcrumb:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(186, 202, 226, 1)
            Font: =Font.'Open Sans'
            Height: =52
            Text: =" /  " & If(IsBlank(varRequestTitle) Or varRequestTitle = "", "New request", varRequestTitle)
            Width: =600
            X: =184
      - RS_StatusBadge:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: |-
              =Switch(varCurrentRequest.Status.Value,
                  "Approved", RGBA(22, 128, 80, 1),
                  "Submitted", RGBA(56, 96, 178, 1),
                  "Rejected", RGBA(193, 40, 40, 1),
                  "Draft", RGBA(96, 104, 120, 1),
                  RGBA(96, 104, 120, 1))
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =DisplayMode.View
            Fill: |-
              =Switch(varCurrentRequest.Status.Value,
                  "Approved", RGBA(223, 245, 233, 1),
                  "Submitted", RGBA(230, 236, 245, 1),
                  "Rejected", RGBA(253, 235, 235, 1),
                  "Draft", RGBA(240, 242, 246, 1),
                  RGBA(240, 242, 246, 1))
            Font: =Font.'Open Sans'
            Height: =32
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =11
            Text: =If(IsBlank(varCurrentRequest) Or varCurrentRequest.ID = 0, "New", If(IsBlank(varCurrentRequest.Status.Value), "Draft", varCurrentRequest.Status.Value))
            Visible: =Not(IsBlank(varCurrentRequest)) And varCurrentRequest.ID > 0
            Width: =120
            X: =1200
            Y: =10
