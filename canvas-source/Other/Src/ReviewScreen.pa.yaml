Screens:
  ReviewScreen:
    Properties:
      Fill: =RGBA(247, 248, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varReviewProject, Blank());
        Set(varReviewComment, "")
    Children:
      - RV_TopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =52
            Width: =1366
      - RV_Back:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(186, 202, 226, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            OnSelect: =Navigate(HomeScreen)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =13
            Text: ="←  Back to home"
            X: =16
            Y: =10
      - RV_Title:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =52
            Size: =15
            Text: ="Review queue"
            Width: =300
            X: =200
      - RV_QueuePanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =840
            Width: =430
            Y: =52
      - RV_QueueTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =44
            Size: =14
            Text: ="Submitted requests  (" & Text(CountRows(RV_QueueGallery.AllItems)) & ")"
            Width: =400
            X: =16
            Y: =60
      - RV_QueueDivider:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =430
            Y: =104
      - RV_QueueGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =786
            Items: =Sort(Filter(AVCentralDepositProjects, Status.Value = "Submitted"), Modified, SortOrder.Descending)
            TemplateSize: =72
            Width: =430
            Y: =106
          Children:
            - RV_QRowBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
                  Height: =71
                  HoverFill: =RGBA(240, 242, 246, 1)
                  OnSelect: |-
                    =Set(varReviewProject, ThisItem);
                    Set(varReviewComment, "")
                  Width: =430
            - RV_QRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Width: =430
                  Y: =71
            - RV_QRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Title
                  Width: =390
                  X: =20
                  Y: =10
            - RV_QRowMeta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: =Coalesce(ThisItem.DG, "—") & "  ·  " & Coalesce(ThisItem.OwnerContact, "—")
                  Width: =390
                  X: =20
                  Y: =38
      - RV_DetailPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =840
            Width: =930
            X: =436
            Y: =52
      - RV_EmptyState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(140, 148, 160, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Select a request from the queue on the left to review it."
            Visible: =IsBlank(varReviewProject)
            Width: =880
            X: =461
            Y: =420
      - RV_DetailTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =18
            Text: =Coalesce(varReviewProject.Title, "")
            Visible: =Not(IsBlank(varReviewProject))
            Width: =820
            X: =460
            Y: =68
      - RV_DetailMeta:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Text: |-
              =Coalesce(varReviewProject.DG, "—") & "   ·   Owner: " & Coalesce(varReviewProject.OwnerContact, "—")
            Visible: =Not(IsBlank(varReviewProject))
            Width: =860
            X: =460
            Y: =104
      - RV_DetailDivider1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =136
      - RV_ChildrenTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =28
            Text: ="Archives in this request"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =400
            X: =460
            Y: =148
      - RV_ThTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =11
            Text: ="ARCHIVE TITLE"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =340
            X: =460
            Y: =180
      - RV_ThType:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =11
            Text: ="TYPE"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =140
            X: =820
            Y: =180
      - RV_ThValid:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =11
            Text: ="VALIDATION"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =160
            X: =976
            Y: =180
      - RV_ChildrenGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            Height: =168
            Items: |-
              =If(
                  IsBlank(varReviewProject),
                  Filter(CentralDepositMainList, 1 = 2),
                  Sort(
                      Filter(CentralDepositMainList, ParentProject.Id = varReviewProject.ID),
                      Modified, SortOrder.Descending
                  )
              )
            TemplateSize: =42
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =216
          Children:
            - RV_CRowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(220, 224, 230, 1)
                  Height: =1
                  Width: =900
                  Y: =41
            - RV_CRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  Font: =Font.'Open Sans'
                  Height: =42
                  Size: =12
                  Text: =If(IsBlank(ThisItem.Project) Or ThisItem.Project = "New archive", "— untitled —", ThisItem.Project)
                  Width: =340
                  X: =24
            - RV_CRowType:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(96, 104, 120, 1)
                  Font: =Font.'Open Sans'
                  Height: =42
                  Size: =12
                  Text: =If(IsBlank(ThisItem.MediaType.Value), "—", ThisItem.MediaType.Value)
                  Width: =140
                  X: =384
            - RV_CRowValid:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        Not(IsBlank(ThisItem.Project)) And ThisItem.Project <> "New archive"
                        And Not(IsBlank(ThisItem.MediaType.Value))
                        And Not(IsBlank(ThisItem.ContractCase.Value))
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        RGBA(22, 128, 80, 1),
                        RGBA(193, 40, 40, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =42
                  Size: =12
                  Text: |-
                    =If(
                        Not(IsBlank(ThisItem.Project)) And ThisItem.Project <> "New archive"
                        And Not(IsBlank(ThisItem.MediaType.Value))
                        And Not(IsBlank(ThisItem.ContractCase.Value))
                        And Not(Coalesce(ThisItem.AIVoiceover, false)),
                        "✓  Ready",
                        "⚠  Incomplete"
                    )
                  Width: =160
                  X: =540
      - RV_DetailDivider2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =392
      - RV_LblOwnerAssign:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: ="Owner / point of contact"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =400
            X: =460
            Y: =404
      - RV_OwnerName:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =Coalesce(varReviewProject.OwnerContact, "")
            Font: =Font.'Open Sans'
            HintText: ="Owner name"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            OnChange: |-
              =Set(varReviewProject, Patch(varReviewProject, {OwnerContact: Self.Value}))
            Visible: =Not(IsBlank(varReviewProject))
            Width: =380
            X: =460
            Y: =432
      - RV_OwnerEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =Coalesce(varReviewProject.OwnerEmail, "")
            Font: =Font.'Open Sans'
            HintText: ="owner@ec.europa.eu"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            OnChange: |-
              =Set(varReviewProject, Patch(varReviewProject, {OwnerEmail: Self.Value}))
            Visible: =Not(IsBlank(varReviewProject))
            Width: =380
            X: =860
            Y: =432
      - RV_DetailDivider3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =484
      - RV_LblComment:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(60, 66, 80, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: ="Reviewer comment  (required to reject)"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =600
            X: =460
            Y: =496
      - RV_Comment:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =varReviewComment
            Font: =Font.'Open Sans'
            Height: =100
            HintText: ="Explain what needs to be corrected before the project can be approved."
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Mode: =TextMode.MultiLine
            OnChange: =Set(varReviewComment, Self.Value)
            Visible: =Not(IsBlank(varReviewProject))
            Width: =880
            X: =460
            Y: =524
      - RV_ExistingComment:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 104, 120, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Size: =12
            Text: |-
              ="Previous reviewer comment: " & Coalesce(varReviewProject.ReviewerComments, "none")
            Visible: =Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewProject.ReviewerComments))
            Width: =880
            X: =460
            Y: =628
      - RV_DetailDivider4:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Visible: =Not(IsBlank(varReviewProject))
            Width: =900
            X: =436
            Y: =666
      - RV_BtnApprove:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(186, 196, 214, 1)
            DisplayMode: =If(Not(IsBlank(varReviewProject)), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(22, 128, 80, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(15, 90, 55, 1)
            OnSelect: |-
              =Patch(AVCentralDepositProjects,
                  LookUp(AVCentralDepositProjects, ID = varReviewProject.ID),
                  {
                      Status: {Value: "Approved"},
                      OwnerContact: varReviewProject.OwnerContact,
                      OwnerEmail: varReviewProject.OwnerEmail,
                      ReviewedByName: User().FullName,
                      ReviewedByEmail: User().Email,
                      ReviewedDate: Now()
                  }
              );
              Notify("Request approved.", NotificationType.Success);
              Set(varReviewProject, Blank());
              Set(varReviewComment, "")
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="✓  Approve"
            Visible: =Not(IsBlank(varReviewProject))
            Width: =200
            X: =460
            Y: =680
      - RV_BtnReject:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 224, 230, 1)
            BorderThickness: =1
            Color: =RGBA(193, 40, 40, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(186, 196, 214, 1)
            DisabledFill: =RGBA(240, 242, 246, 1)
            DisplayMode: |-
              =If(
                  Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewComment)) And varReviewComment <> "",
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(253, 235, 235, 1)
            OnSelect: |-
              =Patch(AVCentralDepositProjects,
                  LookUp(AVCentralDepositProjects, ID = varReviewProject.ID),
                  {
                      Status: {Value: "Rejected"},
                      OwnerContact: varReviewProject.OwnerContact,
                      OwnerEmail: varReviewProject.OwnerEmail,
                      ReviewerComments: varReviewComment,
                      ReviewedByName: User().FullName,
                      ReviewedByEmail: User().Email,
                      ReviewedDate: Now()
                  }
              );
              Notify("Request rejected. The owner will be notified on their next visit.", NotificationType.Warning);
              Set(varReviewProject, Blank());
              Set(varReviewComment, "")
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="✕  Reject"
            Visible: =Not(IsBlank(varReviewProject))
            X: =676
            Y: =680
      - RV_RejectHint:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(140, 148, 160, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =12
            Text: ="A reviewer comment is required before rejecting."
            Visible: |-
              =Not(IsBlank(varReviewProject))
              And (IsBlank(varReviewComment) Or varReviewComment = "")
            Width: =440
            X: =860
            Y: =692
