            OnSelect: =Select(Parent)
            Size: =11
            Text: ="Ref " & Text(ThisItem.ID) & If(IsBlank(ThisItem.ContractCase.Value), "", "   |   " & Left(ThisItem.ContractCase.Value, 30))
            VerticalAlign: =VerticalAlign.Middle
            Width: =560
            X: =12
            Y: =30
            ZIndex: =3

