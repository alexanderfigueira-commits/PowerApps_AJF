    CI_TplGallery As gallery.galleryVertical:
        DelayItemLoading: =true
        Fill: =RGBA(0, 0, 0, 0)
        Height: =356
        Items: |-
            =SortByColumns(
                Filter(
                    'Coverage Request (Belgium)',
                    MediaType.Value = varMediaType,
                    IsBlank(varTplSearch)
                        Or varTplSearch in 'Event Title'
                        Or varTplSearch in Text(ID)
                ),
                "ID", SortOrder.Descending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =56
        Visible: =varShowTemplatePicker
        Width: =712
        X: =327
        Y: =238
        ZIndex: =42

        CI_TplRowBg As rectangle:
            Fill: =RGBA(0, 0, 0, 0)
            Height: =55
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varTplCandidate, ThisItem);
                If(
                    Not(IsBlank(varChildTitle)) Or Not(IsBlank(varDescription)) Or Not(IsBlank(varChildLocation)) Or Not(IsBlank(varChildTags)) Or Not(IsBlank(varCredits)),
                    Set(varShowTplConfirm, true),
                    Set(varChildTitle, varTplCandidate.'Event Title');
                    Set(varDescription, varTplCandidate.Description);
                    Set(varCredits, Coalesce(varTplCandidate.Credits, ""));
                    Set(varLanguages, Coalesce(varTplCandidate.LanguageVersions, ""));
                    Set(varContractCase, varTplCandidate.ContractCase.Value);
                    Set(varContractRef, Coalesce(varTplCandidate.ContractRef, ""));
                    Set(varModelRelease, Coalesce(varTplCandidate.ModelRelease, false));
                    Set(varMusicLicence, Coalesce(varTplCandidate.MusicLicence, false));
                    Set(varPreexisting, Coalesce(varTplCandidate.PreexistingRights, false));
                    Set(varAIVoiceover, Coalesce(varTplCandidate.AIVoiceover, false));
                    Set(varShowTemplatePicker, false)
                )
            Width: =712
            X: =0
            Y: =0
            ZIndex: =1

        CI_TplRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =28
            OnSelect: =Select(Parent)
            Size: =13
            Text: =If(IsBlank(ThisItem.'Event Title'), "Untitled media", ThisItem.'Event Title')
            VerticalAlign: =VerticalAlign.Middle
            Width: =480
            X: =12
            Y: =4
            ZIndex: =2

        CI_TplRowMeta As label:
