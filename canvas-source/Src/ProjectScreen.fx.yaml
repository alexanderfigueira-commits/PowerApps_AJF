ProjectScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =If(
            IsBlank(varSelectedProject),
            Set(varProjectName, Blank()),
            Set(varProjectName, varSelectedProject.Title)
        )

    PS_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =52
        Width: =1366
        X: =0
        Y: =0
        ZIndex: =1

    PS_Back As button:
        BorderThickness: =0
        Color: =RGBA(186, 202, 226, 1)
        Fill: =RGBA(0, 18, 107, 1)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(HomeScreen)
        Size: =13
        Text: ="←  My requests"
        Width: =160
        X: =16
        Y: =10
        ZIndex: =2

    PS_Breadcrumb As label:
        Color: =RGBA(186, 202, 226, 1)
        Height: =52
        Size: =13
        Text: =" /  " & If(IsBlank(varProjectName), "New project", varProjectName)
        VerticalAlign: =VerticalAlign.Middle
        Width: =600
        X: =184
        Y: =0
        ZIndex: =3

    PS_AppTitle As label:
        Align: =Align.Right
        Color: =RGBA(186, 202, 226, 1)
        Height: =52
        Size: =13
        Text: ="AV Central Deposit"
        VerticalAlign: =VerticalAlign.Middle
        Width: =280
        X: =1070
        Y: =0
        ZIndex: =4

    PS_ProjectCard As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =204
        Width: =1302
        X: =32
        Y: =60
        ZIndex: =5

    PS_ProjectCardTitle As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =30
        Size: =16
        Text: =If(IsBlank(varSelectedProject), "New project", "Project details")
        Width: =500
        X: =56
        Y: =76
        ZIndex: =6

    PS_StatusBadge As button:
        BorderThickness: =0
        Color: |-
            =Switch(varProjectStatus,
                "Approved", RGBA(22, 101, 52, 1),
                "Submitted", RGBA(30, 64, 175, 1),
                "In review", RGBA(146, 64, 14, 1),
                "Returned", RGBA(185, 28, 28, 1),
                "Draft", RGBA(75, 85, 99, 1),
                RGBA(75, 85, 99, 1))
        DisabledBorderColor: =Self.BorderColor
        DisplayMode: =DisplayMode.View
        Fill: |-
            =Switch(varProjectStatus,
                "Approved", RGBA(220, 252, 231, 1),
                "Submitted", RGBA(219, 234, 254, 1),
                "In review", RGBA(254, 243, 199, 1),
                "Returned", RGBA(254, 226, 226, 1),
                "Draft", RGBA(243, 244, 246, 1),
                RGBA(243, 244, 246, 1))
        Height: =28
        Size: =11
        Text: =varProjectStatus
        Width: =120
        X: =1186
        Y: =80
        ZIndex: =7

    PS_LblTitle As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="Project / production title *"
        Width: =500
        X: =56
        Y: =116
        ZIndex: =8

    PS_Title As text:
        Default: =Coalesce(varProjectName, "")
        HintText: ="e.g. EU Climate Summit 2026 — AV package"
        Height: =36
        OnChange: =Set(varProjectName, Self.Value)
        Width: =500
        X: =56
        Y: =138
        ZIndex: =9

    PS_LblOwner As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="Owner (point of contact) *"
        Width: =300
        X: =580
        Y: =116
        ZIndex: =10

    PS_Owner As text:
        Default: =Coalesce(varContact, User().FullName)
        HintText: ="Name of person responsible"
        Height: =36
        OnChange: =Set(varContact, Self.Value)
        Width: =300
        X: =580
        Y: =138
        ZIndex: =11

    PS_LblFTP As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="FTP delivery path"
        Width: =380
        X: =904
        Y: =116
        ZIndex: =12

    PS_FTP As text:
        Default: =Coalesce(varFTPPath, "")
        HintText: ="ftp://avdeposit.ec.europa.eu/incoming/…"
        Height: =36
        OnChange: =Set(varFTPPath, Self.Value)
        Width: =380
        X: =904
        Y: =138
        ZIndex: =13

    PS_LblStartDate As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="Request start date"
        Width: =180
        X: =56
        Y: =188
        ZIndex: =14

    PS_StartDate As datepicker:
        Height: =36
        Width: =180
        X: =56
        Y: =208
        ZIndex: =15

    PS_LblEndDate As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="Request end date"
        Width: =180
        X: =248
        Y: =188
        ZIndex: =16

    PS_EndDate As datepicker:
        Height: =36
        Width: =180
        X: =248
        Y: =208
        ZIndex: =17

    PS_LblStatus As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="Status"
        Width: =200
        X: =448
        Y: =188
        ZIndex: =18

    PS_Status As dropdown:
        Height: =36
        Items: =["Draft", "Submitted", "In review", "Approved", "Returned"]
        OnChange: =Set(varProjectStatus, Self.Selected.Value)
        Width: =200
        X: =448
        Y: =208
        ZIndex: =19

    PS_BtnSaveProject As button:
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =36
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =If(
                IsBlank(varSelectedProject),
                Set(varSelectedProject,
                    Patch(
                        'AV Central Deposit Projects',
                        Defaults('AV Central Deposit Projects'),
                        {
                            Title: varProjectName,
                            FTPPath: varFTPPath,
                            Status: {Value: varProjectStatus}
                        }
                    )
                ),
                Patch(
                    'AV Central Deposit Projects',
                    varSelectedProject,
                    {
                        Title: varProjectName,
                        FTPPath: varFTPPath,
                        Status: {Value: varProjectStatus}
                    }
                )
            )
        Size: =13
        Text: =If(IsBlank(varSelectedProject), "Create project", "Save changes")
        Width: =180
        X: =1154
        Y: =208
        ZIndex: =20

    PS_ChildrenHeader As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(240, 242, 246, 1)
        Height: =44
        Width: =1302
        X: =32
        Y: =272
        ZIndex: =21

    PS_ChildrenLabel As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =44
        Size: =14
        Text: ="Media children"
        VerticalAlign: =VerticalAlign.Middle
        Width: =400
        X: =56
        Y: =272
        ZIndex: =22

    PS_ChildCount As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =44
        Size: =12
        Text: =Text(CountRows(PS_ChildGallery.AllItems)) & " item(s)"
        VerticalAlign: =VerticalAlign.Middle
        Width: =160
        X: =600
        Y: =272
        ZIndex: =23

    PS_BtnAddChild As button:
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =34
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =Set(varSelectedChild, Blank());
            Set(varMediaType, "Photo");
            Set(varChildTitle, Blank());
            Set(varCaptureDate, Blank());
            Set(varChildLocation, "");
            Set(varChildTags, "");
            Set(varChildStatus, "Draft");
            Set(varLanguages, "");
            Set(varDescription, Blank());
            Set(varCredits, "");
            Set(varContractCase, Blank());
            Set(varContractRef, Blank());
            Set(varModelRelease, false);
            Set(varMusicLicence, false);
            Set(varPreexisting, false);
            Set(varAIVoiceover, false);
            Set(varModelReleaseProvided, false);
            Set(varMusicProvided, false);
            Set(varPreexistingProvided, false);
            Set(varCase1SubType, Blank());
            Navigate(ChildInfoScreen)
        Size: =12
        Text: ="+  Add media child"
        Width: =180
        X: =1154
        Y: =277
        ZIndex: =24

    PS_ChildGalleryBg As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =448
        Width: =1302
        X: =32
        Y: =316
        ZIndex: =25

    "PS_ChildGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        DelayItemLoading: =true
        Fill: =RGBA(0, 0, 0, 0)
        Height: =444
        Items: |-
            =If(
                IsBlank(varSelectedProject),
                Filter('Coverage Request (Belgium)', 1 = 0),
                Filter(
                    'Coverage Request (Belgium)',
                    ParentProject.Id = varSelectedProject.ID
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =64
        Width: =1302
        X: =32
        Y: =320
        ZIndex: =26

        PS_ChildRowBg As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =63
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varSelectedChild, ThisItem);
                Set(varMediaType, Coalesce(ThisItem.MediaType.Value, "Photo"));
                Set(varChildTitle, ThisItem.'Event Title');
                Set(varDescription, ThisItem.Description);
                Set(varCredits, Coalesce(ThisItem.Credits, ""));
                Set(varLanguages, Coalesce(ThisItem.LanguageVersions, ""));
                Set(varContractCase, Coalesce(ThisItem.ContractCase.Value, ""));
                Set(varContractRef, Coalesce(ThisItem.ContractRef, ""));
                Set(varModelRelease, Coalesce(ThisItem.ModelRelease, false));
                Set(varMusicLicence, Coalesce(ThisItem.MusicLicence, false));
                Set(varPreexisting, Coalesce(ThisItem.PreexistingRights, false));
                Set(varAIVoiceover, Coalesce(ThisItem.AIVoiceover, false));
                Navigate(ChildInfoScreen)
            Width: =1302
            X: =0
            Y: =0
            ZIndex: =1

        PS_ChildRowDivider As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =1302
            X: =0
            Y: =63
            ZIndex: =2

        PS_ChildRowTypeBadge As button:
            BorderThickness: =0
            Color: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(230, 236, 245, 1)
            Height: =24
            Size: =10
            Text: =Coalesce(ThisItem.MediaType.Value, "—")
            Width: =90
            X: =8
            Y: =8
            ZIndex: =3

        PS_ChildRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =28
            OnSelect: =Select(Parent)
            Size: =13
            Text: =If(IsBlank(ThisItem.'Event Title'), "Untitled media", ThisItem.'Event Title')
            VerticalAlign: =VerticalAlign.Middle
            Width: =600
            X: =8
            Y: =30
            ZIndex: =4

        PS_ChildRowCaseLabel As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =28
            OnSelect: =Select(Parent)
            Size: =12
            Text: =If(IsBlank(ThisItem.ContractCase.Value), "No contract case", "Case: " & Left(ThisItem.ContractCase.Value, 6))
            VerticalAlign: =VerticalAlign.Middle
            Width: =300
            X: =620
            Y: =30
            ZIndex: =5

        PS_ChildRowStatusDot As label:
            Align: =Align.Right
            Color: |-
                =If(
                    CountRows(
                        Filter(
                            Table(
                                {check: Not(IsBlank(ThisItem.MediaType.Value))},
                                {check: Not(IsBlank(ThisItem.'Event Title'))},
                                {check: Not(Coalesce(ThisItem.AIVoiceover, false))},
                                {check: Not(IsBlank(ThisItem.ContractCase.Value))}
                            ),
                            Not(check)
                        )
                    ) = 0,
                    RGBA(22, 101, 52, 1),
                    RGBA(193, 40, 40, 1)
                )
            Height: =28
            Size: =14
            Text: |-
                =If(
                    CountRows(
                        Filter(
                            Table(
                                {check: Not(IsBlank(ThisItem.MediaType.Value))},
                                {check: Not(IsBlank(ThisItem.'Event Title'))},
                                {check: Not(Coalesce(ThisItem.AIVoiceover, false))},
                                {check: Not(IsBlank(ThisItem.ContractCase.Value))}
                            ),
                            Not(check)
                        )
                    ) = 0,
                    "●",
                    "●"
                )
            VerticalAlign: =VerticalAlign.Middle
            Width: =40
            X: =1258
            Y: =18
            ZIndex: =6

    PS_EmptyChildren As label:
        Align: =Align.Center
        Color: =RGBA(140, 148, 160, 1)
        Height: =40
        Size: =13
        Text: ="No media children yet. Click \"+ Add media child\" to add the first one."
        Visible: =Not(IsBlank(varSelectedProject)) And CountRows(PS_ChildGallery.AllItems) = 0
        Width: =1302
        X: =32
        Y: =510
        ZIndex: =27

    PS_NewProjectNote As label:
        Align: =Align.Center
        Color: =RGBA(140, 148, 160, 1)
        Height: =40
        Size: =13
        Text: ="Save the project above before adding media children."
        Visible: =IsBlank(varSelectedProject)
        Width: =1302
        X: =32
        Y: =510
        ZIndex: =28
