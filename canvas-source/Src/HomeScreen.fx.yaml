    "HomeChildGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        DelayItemLoading: =true
        Fill: =RGBA(0, 0, 0, 0)
        Height: =556
        Items: |-
            =// Delegable: Lookup ID filter against SharePoint.
            If(
                IsBlank(varSelectedProject),
                Filter('Coverage Request (Belgium)', 1 = 0),
                Filter(
                    'Coverage Request (Belgium)',
                    ParentProject.Id = varSelectedProject.ID
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =64
        Visible: =varIncludeChildren
        Width: =412
        X: =906
        Y: =208
        ZIndex: =30

        HomeChildRowBg As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =63
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varSelectedChild, ThisItem);
                Set(varMediaType, Coalesce(ThisItem.MediaType.Value, "Photo"));
                Set(varChildTitle, ThisItem.'Event Title');
                Set(varContractCase, ThisItem.ContractCase.Value);
                Set(varModelRelease, Coalesce(ThisItem.ModelRelease, false));
                Set(varMusicLicence, Coalesce(ThisItem.MusicLicence, false));
                Set(varPreexisting, Coalesce(ThisItem.PreexistingRights, false));
                Set(varAIVoiceover, Coalesce(ThisItem.AIVoiceover, false));
                Navigate(ChildInfoScreen)
            Width: =412
            X: =0
            Y: =0
            ZIndex: =1

        HomeChildRowDivider As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =412
            X: =0
            Y: =63
            ZIndex: =2

        HomeChildRowType As button:
            BorderThickness: =0
            Color: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(230, 236, 245, 1)
            Height: =22
            Size: =10
            Text: =Coalesce(ThisItem.MediaType.Value, "—")
            Width: =80
            X: =8
            Y: =8
            ZIndex: =3

        HomeChildRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =28
            OnSelect: =Select(Parent)
            Size: =12
            Text: =If(IsBlank(ThisItem.'Event Title'), "Untitled media", ThisItem.'Event Title')
            VerticalAlign: =VerticalAlign.Middle
            Width: =360
            X: =8
            Y: =28
            ZIndex: =4

        HomeChildRowStatus As label:
            Align: =Align.Right
            Color: |-
                =If(
                    CountRows(
                        Filter(
                            Table(
                                {check: Not(IsBlank(ThisItem.MediaType.Value))},
                                {check: Not(IsBlank(ThisItem.'Event Title'))},
                                {check: Not(Coalesce(ThisItem.AIVoiceover, false))},
                                {check: Not(IsBlank(ThisItem.ContractCase.Value))}
                            ),
                            Not(check)
                        )
                    ) = 0,
                    RGBA(22, 101, 52, 1),
                    RGBA(193, 40, 40, 1)
                )
            Height: =22
            Size: =11
            Text: |-
                =If(
                    CountRows(
                        Filter(
                            Table(
                                {check: Not(IsBlank(ThisItem.MediaType.Value))},
                                {check: Not(IsBlank(ThisItem.'Event Title'))},
                                {check: Not(Coalesce(ThisItem.AIVoiceover, false))},
                                {check: Not(IsBlank(ThisItem.ContractCase.Value))}
                            ),
                            Not(check)
                        )
                    ) = 0,
                    "✓ Ready",
                    "! Issues"
                )
            VerticalAlign: =VerticalAlign.Middle
            Width: =80
            X: =328
            Y: =6
            ZIndex: =5

