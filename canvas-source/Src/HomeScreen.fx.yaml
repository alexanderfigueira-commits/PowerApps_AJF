    "HomeGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Fill: =RGBA(0, 0, 0, 0)
        Height: =556
        Items: |-
            =// Date filters are delegable against SharePoint (requires indexed date columns).
            // Owner name filter (varFilterOwner) is NOT delegable — SharePoint does not
            // support text search on Person field DisplayName. Applied locally after
            // the delegable date filters. Limited to first 2000 parent records.
            Filter(
                Filter(
                    'AV Central Deposit Projects',
                    (IsBlank(varFilterStartDate) Or RequestStartDate >= varFilterStartDate),
                    (IsBlank(varFilterEndDate) Or RequestEndDate <= varFilterEndDate)
                ),
                IsBlank(varFilterOwner) Or StartsWith(Owner.DisplayName, varFilterOwner)
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =56
        Width: =If(varIncludeChildren, 846, 1270)
        X: =48
        Y: =208
        ZIndex: =25

        HomeRowSelect As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =55
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varSelectedProject, ThisItem);
                If(
                    varIncludeChildren,
                    false,
                    Navigate(ProjectScreen)
                )
            Width: =If(varIncludeChildren, 846, 1270)
            X: =0
            Y: =0
            ZIndex: =1

        HomeRowDivider As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =If(varIncludeChildren, 846, 1270)
            X: =0
            Y: =55
            ZIndex: =2

        HomeRowProject As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =55
            OnSelect: =Select(Parent)
            Size: =13
            Text: =If(IsBlank(ThisItem.Title), "Untitled project", ThisItem.Title)
            VerticalAlign: =VerticalAlign.Middle
            Width: =340
            X: =20
            Y: =0
            ZIndex: =3

        HomeRowOwner As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =55
            OnSelect: =Select(Parent)
            Size: =12
            Text: =Coalesce(ThisItem.Owner.DisplayName, "—")
            VerticalAlign: =VerticalAlign.Middle
            Width: =200
            X: =372
            Y: =0
            ZIndex: =4

        HomeRowDates As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =55
            OnSelect: =Select(Parent)
            Size: =12
            Text: |-
                =If(
                    IsBlank(ThisItem.RequestStartDate),
                    "—",
                    Text(ThisItem.RequestStartDate, "dd mmm") & " – " & If(IsBlank(ThisItem.RequestEndDate), "…", Text(ThisItem.RequestEndDate, "dd mmm yyyy"))
                )
            VerticalAlign: =VerticalAlign.Middle
            Width: =200
            X: =582
            Y: =0
            ZIndex: =5

        HomeRowBadge As button:
            BorderThickness: =0
            Color: |-
                =Switch(ThisItem.Status.Value,
                    "Approved", RGBA(22, 101, 52, 1),
                    "Submitted", RGBA(30, 64, 175, 1),
                    "In review", RGBA(146, 64, 14, 1),
                    "Returned", RGBA(185, 28, 28, 1),
                    "Draft", RGBA(75, 85, 99, 1),
                    RGBA(96, 104, 120, 1))
            DisabledBorderColor: =Self.BorderColor
            DisplayMode: =DisplayMode.View
            Fill: |-
                =Switch(ThisItem.Status.Value,
                    "Approved", RGBA(220, 252, 231, 1),
                    "Submitted", RGBA(219, 234, 254, 1),
                    "In review", RGBA(254, 243, 199, 1),
                    "Returned", RGBA(254, 226, 226, 1),
                    "Draft", RGBA(243, 244, 246, 1),
                    RGBA(240, 242, 246, 1))
            Height: =28
            Size: =11
            Text: =Coalesce(ThisItem.Status.Value, "Draft")
            Width: =120
            X: =793
            Y: =13
            ZIndex: =6

