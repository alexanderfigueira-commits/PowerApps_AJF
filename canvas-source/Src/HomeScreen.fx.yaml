        OnSelect: |-
            =// Export the current home screen view as PDF.
            // Requires pdffunction preview flag enabled in CanvasManifest.
            // ExpandContainers:true captures scrolling gallery rows fully.
            Download(
                PDF(
                    HomeScreen,
                    {
                        Size: PaperSize.A4,
                        Orientation: PaperOrientation.Landscape,
                        ExpandContainers: true
