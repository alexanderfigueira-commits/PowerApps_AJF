    "HomeGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Fill: =RGBA(0, 0, 0, 0)
        Height: =420
        Items: |-
            =If(
                varFilter = "All",
                Filter('Coverage Request (Belgium)', 'Created By'.Email = User().Email),
                Filter('Coverage Request (Belgium)', 'Created By'.Email = User().Email, Status.Value = varFilter)
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =60
        Width: =1270
        X: =48
        Y: =278
        ZIndex: =20

        HomeRowSelect As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =59
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: =Set(varSelectedRequest, ThisItem); Navigate(NewRequestScreen)
            Width: =1270
            X: =0
            Y: =0
            ZIndex: =1

        HomeRowDivider As rectangle:
            Fill: =RGBA(230, 232, 238, 1)
            Height: =1
            Width: =1270
            X: =0
            Y: =59
            ZIndex: =2

        HomeRowProject As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =59
            OnSelect: =Select(Parent)
            Size: =13
            Text: =If(IsBlank(ThisItem.'Event Title'), "Untitled request", ThisItem.'Event Title')
            VerticalAlign: =VerticalAlign.Middle
            Width: =510
            X: =20
            Y: =0
            ZIndex: =3

        HomeRowType As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =59
            OnSelect: =Select(Parent)
            Size: =13
            Text: =If(IsBlank(ThisItem.'Event Type'), "—", ThisItem.'Event Type'.Value)
            VerticalAlign: =VerticalAlign.Middle
            Width: =220
            X: =552
            Y: =0
            ZIndex: =4

        HomeRowSubmitted As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =59
            OnSelect: =Select(Parent)
            Size: =13
            Text: =If(IsBlank(ThisItem.Created), "—", Text(ThisItem.Created, "dd mmm yyyy"))
            VerticalAlign: =VerticalAlign.Middle
            Width: =200
            X: =792
            Y: =0
            ZIndex: =5

        HomeRowBadge As button:
            BorderThickness: =0
            Color: |-
                =Switch(ThisItem.Status.Value,
                    "Accepted", RGBA(22, 128, 80, 1),
                    "Pending Approval", RGBA(180, 95, 6, 1),
                    "New", RGBA(56, 96, 178, 1),
                    "Not Accepted", RGBA(193, 40, 40, 1),
                    RGBA(96, 104, 120, 1))
            DisabledBorderColor: =Self.BorderColor
            DisplayMode: =DisplayMode.View
            Fill: |-
                =Switch(ThisItem.Status.Value,
                    "Accepted", RGBA(223, 245, 233, 1),
                    "Pending Approval", RGBA(255, 247, 230, 1),
                    "New", RGBA(230, 236, 245, 1),
                    "Not Accepted", RGBA(253, 235, 235, 1),
                    RGBA(240, 242, 246, 1))
            Size: =11
            Text: =If(IsBlank(ThisItem.Status.Value), "—", ThisItem.Status.Value)
            Width: =150
            X: =1032
            Y: =16
            ZIndex: =6

    HomeEmptyState As label:
        Align: =Align.Center
        Color: =RGBA(140, 148, 160, 1)
        Height: =40
        Size: =14
        Text: ="No requests yet. Start one with “+ New request”."
        Visible: =CountRows(HomeGallery.AllItems) = 0
        Width: =1270
        X: =48
        Y: =440
        ZIndex: =21
