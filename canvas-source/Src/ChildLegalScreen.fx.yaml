ChildLegalScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)

    CL_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =52
        Width: =1366
        X: =0
        Y: =0
        ZIndex: =1

    CL_Back As button:
        BorderThickness: =0
        Color: =RGBA(186, 202, 226, 1)
        Fill: =RGBA(0, 18, 107, 1)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(ProjectScreen)
        Size: =13
        Text: ="←  Back to project"
        Width: =180
        X: =16
        Y: =10
        ZIndex: =2

    CL_Breadcrumb As label:
        Color: =RGBA(186, 202, 226, 1)
        Height: =52
        Size: =13
        Text: =" /  " & Coalesce(varChildTitle, "New child")
        VerticalAlign: =VerticalAlign.Middle
        Width: =600
        X: =204
        Y: =0
        ZIndex: =3

    CL_TabsBg As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =44
        Width: =1366
        X: =0
        Y: =52
        ZIndex: =4

    CL_Tab1 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildInfoScreen)
        Size: =13
        Text: ="✓  1.  Info"
        Width: =150
        X: =16
        Y: =52
        ZIndex: =5

    CL_Tab2 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildMetaScreen)
        Size: =13
        Text: ="✓  2.  Metadata"
        Width: =170
        X: =176
        Y: =52
        ZIndex: =6

    CL_Tab3 As button:
        BorderThickness: =0
        Color: =RGBA(0, 18, 107, 1)
        Fill: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        HoverFill: =RGBA(255, 255, 255, 1)
        Size: =13
        Text: ="3.  Legal & Attachments"
        Width: =220
        X: =356
        Y: =52
        ZIndex: =7

    CL_Tab3Line As rectangle:
        Fill: =RGBA(56, 96, 178, 1)
        Height: =3
        Width: =220
        X: =356
        Y: =93
        ZIndex: =8

    CL_Tab4 As button:
        BorderThickness: =0
        Color: =RGBA(96, 104, 120, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildValidScreen)
        Size: =13
        Text: ="4.  Validations"
        Width: =170
        X: =586
        Y: =52
        ZIndex: =9

    CL_Card As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =608
        Width: =1302
        X: =32
        Y: =96
        ZIndex: =10

    CL_Banner As rectangle:
        BorderColor: =RGBA(147, 197, 253, 1)
        BorderThickness: =1
        Fill: =RGBA(239, 246, 255, 1)
        Height: =44
        Width: =1246
        X: =56
        Y: =108
        ZIndex: =11

    CL_BannerText As label:
        Color: =RGBA(30, 64, 175, 1)
        Height: =44
        Size: =12
        Text: ="Select the contract case, complete the rights checklist, confirm documents are provided, then attach the relevant files below."
        VerticalAlign: =VerticalAlign.Middle
        Width: =1210
        X: =72
        Y: =108
        ZIndex: =12

    CL_LblCase As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =26
        Size: =15
        Text: ="Contract case *"
        Width: =400
        X: =56
        Y: =162
        ZIndex: =13

    CL_Case As dropdown:
        Height: =40
        Items: |-
            =[
                "Case 1 — framework / direct / specific contract",
                "Case 2 — direct service contract (single)",
                "Case 3 — co-production agreement",
                "Case 4 — acquisition of existing material",
                "Case 5 — internal EU production",
                "Case 6 — donation / free licence"
            ]
        OnChange: =Set(varContractCase, Self.Selected.Value)
        Width: =1246
        X: =56
        Y: =190
        ZIndex: =14

    CL_LblCase1Sub As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="Case 1 sub-type *"
        Visible: =StartsWith(varContractCase, "Case 1")
        Width: =300
        X: =56
        Y: =240
        ZIndex: =15

    CL_Case1Sub As dropdown:
        Height: =36
        Items: =["Framework contract", "Specific contract", "Offer / quote"]
        OnChange: =Set(varCase1SubType, Self.Selected.Value)
        Visible: =StartsWith(varContractCase, "Case 1")
        Width: =380
        X: =56
        Y: =262
        ZIndex: =16

    CL_LblRef As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =20
        Size: =12
        Text: ="Contract reference number"
        Visible: =Not(IsBlank(varContractCase))
        Width: =400
        X: =If(StartsWith(varContractCase, "Case 1"), 456, 56)
        Y: =240
        ZIndex: =17

    CL_Ref As text:
        Default: =varContractRef
        HintText: ="e.g. COMM-2026-PHOTO-0142"
        Height: =36
        OnChange: =Set(varContractRef, Self.Value)
        Visible: =Not(IsBlank(varContractCase))
        Width: =500
        X: =If(StartsWith(varContractCase, "Case 1"), 456, 56)
        Y: =262
        ZIndex: =18

    CL_Divider1 As rectangle:
        Fill: =RGBA(230, 232, 238, 1)
        Height: =1
        Width: =1246
        X: =56
        Y: =310
        ZIndex: =19

    CL_LblRights As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =26
        Size: =15
        Text: ="Rights & mandatory documents"
        Width: =600
        X: =56
        Y: =320
        ZIndex: =20

    CL_ChkModel As checkbox.'Checkbox':
        Height: =32
        OnCheck: =Set(varModelRelease, true)
        OnUncheck: |-
            =Set(varModelRelease, false);
            Set(varModelReleaseProvided, false)
        Text: ="Recognisable private persons appear — model release forms required"
        Width: =860
        X: =52
        Y: =354
        ZIndex: =21

    CL_ChkModelProvided As checkbox.'Checkbox':
        Height: =28
        OnCheck: =Set(varModelReleaseProvided, true)
        OnUncheck: =Set(varModelReleaseProvided, false)
        Text: ="Model release forms uploaded / confirmed ✓"
        Visible: =varModelRelease
        Width: =500
        X: =80
        Y: =386
        ZIndex: =22

    CL_ChkMusic As checkbox.'Checkbox':
        Height: =32
        OnCheck: =Set(varMusicLicence, true)
        OnUncheck: |-
            =Set(varMusicLicence, false);
            Set(varMusicProvided, false)
        Text: ="Production contains music — licensing documentation required"
        Width: =860
        X: =52
        Y: =420
        ZIndex: =23

    CL_ChkMusicProvided As checkbox.'Checkbox':
        Height: =28
        OnCheck: =Set(varMusicProvided, true)
        OnUncheck: =Set(varMusicProvided, false)
        Text: ="Music licence / annex uploaded / confirmed ✓"
        Visible: =varMusicLicence
        Width: =500
        X: =80
        Y: =452
        ZIndex: =24

    CL_ChkPreexisting As checkbox.'Checkbox':
        Height: =32
        OnCheck: =Set(varPreexisting, true)
        OnUncheck: |-
            =Set(varPreexisting, false);
            Set(varPreexistingProvided, false)
        Text: ="Contains pre-existing rights material — annex(es) required"
        Width: =860
        X: =52
        Y: =486
        ZIndex: =25

    CL_ChkPreexistingProvided As checkbox.'Checkbox':
        Height: =28
        OnCheck: =Set(varPreexistingProvided, true)
        OnUncheck: =Set(varPreexistingProvided, false)
        Text: ="Pre-existing rights annex uploaded / confirmed ✓"
        Visible: =varPreexisting
        Width: =500
        X: =80
        Y: =518
        ZIndex: =26

    CL_Divider2 As rectangle:
        Fill: =RGBA(230, 232, 238, 1)
        Height: =1
        Width: =1246
        X: =56
        Y: =556
        ZIndex: =27

    CL_LblAttach As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =26
        Size: =15
        Text: ="Attachments for this media child"
        Width: =600
        X: =56
        Y: =566
        ZIndex: =28

    CL_AttachHint As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =20
        Size: =12
        Text: ="Attach contract scans, model releases, music annex, pre-existing rights annex, SRT/VTT, scripts. Master media → FTP path on project."
        Width: =1246
        X: =56
        Y: =590
        ZIndex: =29

    CL_Annex As attachments:
        BorderColor: =RGBA(220, 224, 230, 1)
        Height: =160
        MaxAttachments: =20
        Width: =1246
        X: =56
        Y: =614
        ZIndex: =30

    CL_BottomBar As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =56
        Width: =1366
        X: =0
        Y: =712
        ZIndex: =31

    CL_BtnPrev As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(60, 66, 80, 1)
        Fill: =RGBA(255, 255, 255, 1)
        Height: =40
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(ChildMetaScreen)
        Size: =13
        Text: ="←  Previous"
        Width: =140
        X: =32
        Y: =720
        ZIndex: =32

    CL_BtnNext As button:
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =40
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(ChildValidScreen)
        Size: =13
        Text: ="Next: Validations  →"
        Width: =220
        X: =1114
        Y: =720
        ZIndex: =33
