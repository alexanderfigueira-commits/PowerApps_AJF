ChildValidScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =// Re-evaluate all validation checks on every visit.
        // varChecksPassed is the count of failing checks.
        // Each check: true = passes, false = fails.
        ClearCollect(
            colValidationChecks,
            {
                Label: "Media type is set",
                Pass: Not(IsBlank(varMediaType)),
                Message: "Select a media type on the Info tab"
            },
            {
                Label: "Media title / identifier filled",
                Pass: Not(IsBlank(varChildTitle)),
                Message: "Enter a media title on the Info tab"
            },
            {
                Label: "Capture / production date set",
                Pass: Not(IsBlank(varCaptureDate)),
                Message: "Set the capture date on the Info tab"
            },
            {
                Label: "Language version(s) selected",
                Pass: Not(IsBlank(varLanguages)) And varLanguages <> "",
                Message: "Select at least one language on the Metadata tab"
            },
            {
                Label: "AI voice-over: not used",
                Pass: Not(varAIVoiceover),
                Message: "AI-generated voice-overs are NOT accepted — uncheck on Metadata tab"
            },
            {
                Label: "Contract case selected",
                Pass: Not(IsBlank(varContractCase)),
                Message: "Select a contract case on the Legal & Attachments tab"
            },
            {
                Label: "Case 1 sub-type selected (if Case 1)",
                Pass: If(StartsWith(varContractCase, "Case 1"), Not(IsBlank(varCase1SubType)), true),
                Message: "Select the Case 1 sub-type (Framework / Specific / Offer)"
            },
            {
                Label: "Model release docs provided (if required)",
                Pass: Not(varModelRelease) Or varModelReleaseProvided,
                Message: "Confirm model release forms uploaded on Legal & Attachments tab"
            },
            {
                Label: "Music licence docs provided (if required)",
                Pass: Not(varMusicLicence) Or varMusicProvided,
                Message: "Confirm music licence / annex uploaded on Legal & Attachments tab"
            },
            {
                Label: "Pre-existing rights docs provided (if required)",
                Pass: Not(varPreexisting) Or varPreexistingProvided,
                Message: "Confirm pre-existing rights annex uploaded on Legal & Attachments tab"
            },
            {
                Label: "Photographer / credits set (Photo)",
                Pass: Not(varMediaType = "Photo") Or (Not(IsBlank(varCredits)) And varCredits <> ""),
                Message: "Enter photographer / agency credits on the Metadata tab"
            },
            {
                Label: "FTP delivery path set (parent project)",
                Pass: Not(IsBlank(varFTPPath)) And varFTPPath <> "",
                Message: "Set the FTP delivery path on the parent project"
            },
            {
                Label: "Owner / point of contact set (parent project)",
                Pass: Not(IsBlank(varContact)) And varContact <> "",
                Message: "Set the owner / point of contact on the parent project"
            }
        );
        Set(varFailCount, CountRows(Filter(colValidationChecks, Not(Pass))))

