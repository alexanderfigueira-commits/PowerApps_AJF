    CV_BtnSubmit As button:
        Color: =RGBA(255, 255, 255, 1)
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: =If(varFailCount = 0, DisplayMode.Edit, DisplayMode.Disabled)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =40
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =Set(varNewTicket,
                Patch(
                    'Coverage Request (Belgium)',
                    If(IsBlank(varSelectedChild), Defaults('Coverage Request (Belgium)'), varSelectedChild),
                    {
                        'Event Title': varChildTitle,
                        MediaType: {Value: varMediaType},
                        Description: varDescription,
                        Credits: varCredits,
                        LanguageVersions: varLanguages,
                        ContractCase: {Value: varContractCase},
                        ContractRef: varContractRef,
                        AIVoiceover: varAIVoiceover,
                        ModelRelease: varModelRelease,
                        MusicLicence: varMusicLicence,
                        PreexistingRights: varPreexisting,
                        ParentProject: {Id: varSelectedProject.ID}
                    }
                )
            );
            Set(varSelectedChild, varNewTicket);
            Set(varTicketRef, "CD-" & Text(Year(Now())) & "-" & Text(varNewTicket.ID));
            Navigate(ConfirmationScreen)
        Size: =13
        Text: =If(varFailCount = 0, "Save & submit child  →", "Cannot submit (" & Text(varFailCount) & " missing)")
        Width: =280
        X: =1054
        Y: =720
        ZIndex: =20
