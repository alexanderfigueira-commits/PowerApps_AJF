HomePrintScreen As screen:
    Fill: =RGBA(255, 255, 255, 1)

    HP_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =52
        Width: =1366
        ZIndex: =1

    HP_AppTitle As label:
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        Height: =52
        Size: =15
        Text: ="AV Central Deposit - Requests Export"
        Width: =600
        X: =32
        ZIndex: =2

    HP_BtnBack As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(60, 66, 80, 1)
        Fill: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: =Navigate(MyRequestScreen)
        Size: =13
        Text: ="←  Back"
        Width: =100
        X: =32
        Y: =68
        ZIndex: =3

    HP_SubTitle As label:
        Color: =RGBA(96, 104, 120, 1)
        Size: =12
        Text: |-
            =Text(CountRows(colPrintData)) & If(CountRows(colPrintData) = 1, " request", " requests") & "   ·   exported " & Text(Now(), "dd/mm/yyyy hh:mm")
        Width: =700
        X: =148
        Y: =68
        ZIndex: =4

    HP_BtnDownload As button:
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |
            =Set(varPDF, PDF(HomePrintScreen));
            Download(varPDF, "MyDocument.pdf")
        Size: =13
        Text: ="⬇  Download PDF"
        Width: =180
        X: =1154
        Y: =68
        ZIndex: =5

    HP_TableHeader As rectangle:
        Fill: =RGBA(240, 242, 246, 1)
        Height: =40
        Width: =1302
        X: =32
        Y: =118
        ZIndex: =6

    HP_ThRequest As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Size: =11
        Text: ="REQUEST"
        Width: =380
        X: =48
        Y: =118
        ZIndex: =7

    HP_ThDG As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Size: =11
        Text: ="DG"
        Width: =160
        X: =448
        Y: =118
        ZIndex: =8

    HP_ThArchives As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Size: =11
        Text: ="ARCHIVES"
        Width: =120
        X: =628
        Y: =118
        ZIndex: =9

    HP_ThStatus As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Size: =11
        Text: ="STATUS"
        Width: =160
        X: =768
        Y: =118
        ZIndex: =10

    HP_ThSubmitted As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Size: =11
        Text: ="SUBMITTED"
        Width: =160
        X: =948
        Y: =118
        ZIndex: =11

    HP_ThDescription As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Size: =11
        Text: ="DESCRIPTION"
        Width: =206
        X: =1128
        Y: =118
        ZIndex: =12

    HP_Gallery As gallery:
        Height: =Max(52, 52 * CountRows(colPrintData))
        Items: =colPrintData
        Layout: =Layout.Vertical
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =52
        Width: =1302
        X: =32
        Y: =158
        ZIndex: =13

        HP_RowDivider As rectangle:
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =1302
            Y: =51
            ZIndex: =1

        HP_RowRequest As label:
            Color: =RGBA(32, 31, 30, 1)
            FontWeight: =FontWeight.Semibold
            Height: =52
            Size: =12
            Text: =If(IsBlank(ThisItem.Title), "Untitled request", ThisItem.Title)
            Width: =380
            X: =16
            ZIndex: =2

        HP_RowDG As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =52
            Size: =12
            Text: =If(IsBlank(ThisItem.DG), "—", ThisItem.DG)
            Width: =160
            X: =416
            ZIndex: =3

        HP_RowArchives As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =52
            Size: =12
            Text: =Text(CountRows(Filter(CentralDepositMainList, ParentProject.Id = ThisItem.ID)))
            Width: =120
            X: =596
            ZIndex: =4

        HP_RowStatus As label:
            Color: |-
                =Switch(ThisItem.Status.Value,
                    "Approved", RGBA(22, 128, 80, 1),
                    "Submitted", RGBA(56, 96, 178, 1),
                    "Rejected", RGBA(193, 40, 40, 1),
                    RGBA(96, 104, 120, 1))
            FontWeight: =FontWeight.Semibold
            Height: =52
            Size: =12
            Text: =If(IsBlank(ThisItem.Status.Value), "Draft", ThisItem.Status.Value)
            Width: =160
            X: =736
            ZIndex: =5

        HP_RowDate As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =52
            Size: =12
            Text: =If(IsBlank(ThisItem.StartRequestDate), "—", Text(ThisItem.StartRequestDate, "dd/mm/yyyy"))
            Width: =160
            X: =916
            ZIndex: =6

        HP_RowDescription As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =52
            Size: =11
            Text: =If(IsBlank(ThisItem.Description), "—", ThisItem.Description)
            Width: =206
            X: =1096
            ZIndex: =7

    HP_EmptyState As label:
        Align: =Align.Center
        Color: =RGBA(140, 148, 160, 1)
        Size: =14
        Text: ="No requests to export."
        Visible: =CountRows(colPrintData) = 0
        Width: =1302
        X: =32
        Y: =220
        ZIndex: =14

    HP_Footer As label:
        Align: =Align.Center
        Color: =RGBA(140, 148, 160, 1)
        Height: =28
        Size: =10
        Text: ="AV Central Deposit Ticket System  ·  Audiovisual Service, DG COMM  ·  " & Text(Today(), "dd/mm/yyyy")
        Width: =1302
        X: =32
        Y: =158 + Max(52, 52 * CountRows(colPrintData)) + 12
        ZIndex: =15

