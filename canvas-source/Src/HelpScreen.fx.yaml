    HL_Star1 As button:
        BorderThickness: =0
        Color: =If(varRating >= 1, RGBA(245, 158, 11, 1), RGBA(186, 196, 214, 1))
        Fill: =RGBA(255, 255, 255, 1)
        Height: =52
        HoverFill: =RGBA(247, 248, 250, 1)
        OnSelect: |-
            =Set(varRating, 1);
            Set(varFeedbackSent, false)
        Size: =28
        Text: =If(varRating >= 1, "★", "☆")
        Width: =52
        X: =1024
        Y: =170
        ZIndex: =23

    HL_Star2 As button:
