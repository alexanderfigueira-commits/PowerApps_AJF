    HL_RatingHint As label:
        Color: =If(varRating > 0, RGBA(22, 128, 80, 1), RGBA(96, 104, 120, 1))
        Height: =24
        Size: =12
        Text: |-
            =Switch(varRating,
                0, "Select a rating (required)",
                1, "1/5 — Very dissatisfied",
                2, "2/5 — Dissatisfied",
                3, "3/5 — Neutral",
                4, "4/5 — Satisfied",
                5, "5/5 — Very satisfied")
        Width: =360
        X: =1024
        Y: =228
        ZIndex: =28

    HL_FeedbackLbl As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =22
        Size: =12
        Text: ="Written feedback (optional)"
        Width: =360
        X: =1024
        Y: =262
        ZIndex: =29

    HL_Feedback As text:
        Default: =varFeedbackText
        HintText: ="Tell us what works well and what could be improved..."
        Height: =100
        Mode: =TextMode.MultiLine
        OnChange: =Set(varFeedbackText, Self.Value)
        Width: =360
        X: =1024
        Y: =288
        ZIndex: =30

    HL_BtnSubmitRating As button:
        Color: =RGBA(255, 255, 255, 1)
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: =If(varRating > 0, DisplayMode.Edit, DisplayMode.Disabled)
        Fill: =RGBA(56, 96, 178, 1)
        FontWeight: =FontWeight.Semibold
        Height: =40
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: |-
            =Patch(AVCentralDepositProjects,
                Defaults(AVCentralDepositProjects),
                {
                    Title: "Feedback — " & User().FullName,
                    Rating: varRating,
                    Description: varFeedbackText
                }
            );
            Set(varFeedbackSent, true);
            Set(varRating, 0);
            Set(varFeedbackText, "")
        Size: =13
        Text: ="Submit feedback"
        Width: =180
        X: =1024
        Y: =404
        ZIndex: =31

    HL_ThanksMsg As label:
        Color: =RGBA(22, 128, 80, 1)
        FontWeight: =FontWeight.Semibold
