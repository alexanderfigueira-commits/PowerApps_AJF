ReviewScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =Set(varReviewProject, Blank());
        Set(varReviewComment, "")

    RV_TopBar As rectangle:
        Fill: =RGBA(0, 18, 107, 1)
        Height: =52
        Width: =1366
        ZIndex: =1

    RV_Back As button:
        BorderThickness: =0
        Color: =RGBA(186, 202, 226, 1)
        Fill: =RGBA(0, 18, 107, 1)
        HoverFill: =RGBA(0, 18, 107, 1)
        OnSelect: =Navigate(HomeScreen)
        Size: =13
        Text: ="←  Back to home"
        X: =16
        Y: =10
        ZIndex: =2

    RV_Title As label:
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Semibold
        Height: =52
        Size: =15
        Text: ="Review queue"
        Width: =300
        X: =200
        ZIndex: =3

    RV_QueuePanel As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =840
        Width: =430
        Y: =52
        ZIndex: =4

    RV_QueueTitle As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =44
        Size: =14
        Text: ="Submitted requests  (" & Text(CountRows(RV_QueueGallery.AllItems)) & ")"
        Width: =400
        X: =16
        Y: =60
        ZIndex: =5

    RV_QueueDivider As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Width: =430
        Y: =104
        ZIndex: =6

    "RV_QueueGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(0, 0, 0, 0)
        DelayItemLoading: =true
        Height: =786
        Items: =Sort(Filter(AVCentralDepositProjects, Status.Value = "Submitted"), Modified, SortOrder.Descending)
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =72
        Width: =430
        Y: =106
        ZIndex: =7

        RV_QRowBg As rectangle:
            Fill: =If(ThisItem.IsSelected, RGBA(230, 236, 245, 1), RGBA(0, 0, 0, 0))
            Height: =71
            HoverFill: =RGBA(240, 242, 246, 1)
            OnSelect: |-
                =Set(varReviewProject, ThisItem);
                Set(varReviewComment, "")
            Width: =430
            ZIndex: =1

        RV_QRowDivider As rectangle:
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =430
            Y: =71
            ZIndex: =2

        RV_QRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            OnSelect: =Select(Parent)
            Text: =ThisItem.Title
            Width: =390
            X: =20
            Y: =10
            ZIndex: =3

        RV_QRowMeta As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =24
            OnSelect: =Select(Parent)
            Size: =12
            Text: =Coalesce(ThisItem.DG, "—") & "  ·  " & Coalesce(ThisItem.OwnerContact, "—")
            Width: =390
            X: =20
            Y: =38
            ZIndex: =4

    RV_DetailPanel As rectangle:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =840
        Width: =930
        X: =436
        Y: =52
        ZIndex: =8

    RV_EmptyState As label:
        Align: =Align.Center
        Color: =RGBA(140, 148, 160, 1)
        Size: =14
        Text: ="Select a request from the queue on the left to review it."
        Visible: =IsBlank(varReviewProject)
        Width: =880
        X: =461
        Y: =420
        ZIndex: =9

    RV_DetailTitle As label:
        Color: =RGBA(0, 18, 107, 1)
        FontWeight: =FontWeight.Bold
        Height: =36
        Size: =18
        Text: =Coalesce(varReviewProject.Title, "")
        Visible: =Not(IsBlank(varReviewProject))
        Width: =820
        X: =460
        Y: =68
        ZIndex: =10

    RV_DetailMeta As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =24
        Text: |-
            =Coalesce(varReviewProject.DG, "—") & "   ·   Owner: " & Coalesce(varReviewProject.OwnerContact, "—")
        Visible: =Not(IsBlank(varReviewProject))
        Width: =860
        X: =460
        Y: =104
        ZIndex: =11

    RV_DetailDivider1 As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =136
        ZIndex: =12

    RV_ChildrenTitle As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =28
        Text: ="Archives in this request"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =400
        X: =460
        Y: =148
        ZIndex: =13

    RV_ThTitle As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Height: =32
        Size: =11
        Text: ="ARCHIVE TITLE"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =340
        X: =460
        Y: =180
        ZIndex: =14

    RV_ThType As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Height: =32
        Size: =11
        Text: ="TYPE"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =140
        X: =820
        Y: =180
        ZIndex: =15

    RV_ThValid As label:
        Color: =RGBA(96, 104, 120, 1)
        FontWeight: =FontWeight.Semibold
        Height: =32
        Size: =11
        Text: ="VALIDATION"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =160
        X: =976
        Y: =180
        ZIndex: =16

    "RV_ChildrenGallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        BorderColor: =RGBA(220, 224, 230, 1)
        DelayItemLoading: =true
        Height: =168
        Items: |-
            =If(
                IsBlank(varReviewProject),
                Filter(CentralDepositMainList, 1 = 2),
                Sort(
                    Filter(CentralDepositMainList, ParentProject.Id = varReviewProject.ID),
                    Modified, SortOrder.Descending
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =42
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =216
        ZIndex: =17

        RV_CRowDivider As rectangle:
            Fill: =RGBA(220, 224, 230, 1)
            Height: =1
            Width: =900
            Y: =41
            ZIndex: =1

        RV_CRowTitle As label:
            Color: =RGBA(32, 31, 30, 1)
            Height: =42
            Size: =12
            Text: =If(IsBlank(ThisItem.Project) Or ThisItem.Project = "New archive", "— untitled —", ThisItem.Project)
            Width: =340
            X: =24
            ZIndex: =2

        RV_CRowType As label:
            Color: =RGBA(96, 104, 120, 1)
            Height: =42
            Size: =12
            Text: =If(IsBlank(ThisItem.MediaType.Value), "—", If(ThisItem.MediaType.Value = "Photo", "Photo/Reportage", ThisItem.MediaType.Value))
            Width: =140
            X: =384
            ZIndex: =3

        RV_CRowValid As label:
            Color: |-
                =If(
                    Not(IsBlank(ThisItem.Project)) And ThisItem.Project <> "New archive"
                    And Not(IsBlank(ThisItem.MediaType.Value))
                    And Not(IsBlank(ThisItem.ContractCase.Value))
                    And Not(Coalesce(ThisItem.AIVoiceover, false)),
                    RGBA(22, 128, 80, 1),
                    RGBA(193, 40, 40, 1)
                )
            Height: =42
            Size: =12
            Text: |-
                =If(
                    Not(IsBlank(ThisItem.Project)) And ThisItem.Project <> "New archive"
                    And Not(IsBlank(ThisItem.MediaType.Value))
                    And Not(IsBlank(ThisItem.ContractCase.Value))
                    And Not(Coalesce(ThisItem.AIVoiceover, false)),
                    "✓  Ready",
                    "⚠  Incomplete"
                )
            Width: =160
            X: =540
            ZIndex: =4

    RV_DetailDivider2 As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =392
        ZIndex: =18

    RV_LblOwnerAssign As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =24
        Text: ="Owner / point of contact"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =400
        X: =460
        Y: =404
        ZIndex: =19

    RV_OwnerName As text:
        Default: =Coalesce(varReviewProject.OwnerContact, "")
        HintText: ="Owner name"
        OnChange: |-
            =Set(varReviewProject, Patch(varReviewProject, {OwnerContact: Self.Value}))
        Visible: =Not(IsBlank(varReviewProject))
        Width: =380
        X: =460
        Y: =432
        ZIndex: =20

    RV_OwnerEmail As text:
        Default: =Coalesce(varReviewProject.OwnerEmail, "")
        HintText: ="owner@ec.europa.eu"
        OnChange: |-
            =Set(varReviewProject, Patch(varReviewProject, {OwnerEmail: Self.Value}))
        Visible: =Not(IsBlank(varReviewProject))
        Width: =380
        X: =860
        Y: =432
        ZIndex: =21

    RV_DetailDivider3 As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =484
        ZIndex: =22

    RV_LblComment As label:
        Color: =RGBA(60, 66, 80, 1)
        FontWeight: =FontWeight.Semibold
        Height: =24
        Text: ="Reviewer comment  (required to reject)"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =600
        X: =460
        Y: =496
        ZIndex: =23

    RV_Comment As text:
        Default: =varReviewComment
        Height: =100
        HintText: ="Explain what needs to be corrected before the project can be approved."
        Mode: =TextMode.MultiLine
        OnChange: =Set(varReviewComment, Self.Value)
        Visible: =Not(IsBlank(varReviewProject))
        Width: =880
        X: =460
        Y: =524
        ZIndex: =24

    RV_ExistingComment As label:
        Color: =RGBA(96, 104, 120, 1)
        Height: =28
        Size: =12
        Text: |-
            ="Previous reviewer comment: " & Coalesce(varReviewProject.ReviewerComments, "none")
        Visible: =Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewProject.ReviewerComments))
        Width: =880
        X: =460
        Y: =628
        ZIndex: =25

    RV_DetailDivider4 As rectangle:
        Fill: =RGBA(220, 224, 230, 1)
        Height: =1
        Visible: =Not(IsBlank(varReviewProject))
        Width: =900
        X: =436
        Y: =666
        ZIndex: =26

    RV_BtnApprove As button:
        DisabledColor: =RGBA(255, 255, 255, 1)
        DisabledFill: =RGBA(186, 196, 214, 1)
        DisplayMode: =If(Not(IsBlank(varReviewProject)), DisplayMode.Edit, DisplayMode.Disabled)
        Fill: =RGBA(22, 128, 80, 1)
        Height: =44
        HoverFill: =RGBA(15, 90, 55, 1)
        OnSelect: |-
            =Patch(AVCentralDepositProjects,
                LookUp(AVCentralDepositProjects, ID = varReviewProject.ID),
                {
                    Status: {Value: "Approved"},
                    OwnerContact: varReviewProject.OwnerContact,
                    OwnerEmail: varReviewProject.OwnerEmail,
                    ReviewedByName: User().FullName,
                    ReviewedByEmail: User().Email,
                    ReviewedDate: Now()
                }
            );
            Notify("Request approved.", NotificationType.Success);
            Set(varReviewProject, Blank());
            Set(varReviewComment, "")
        Size: =14
        Text: ="✓  Approve"
        Visible: =Not(IsBlank(varReviewProject))
        Width: =200
        X: =460
        Y: =680
        ZIndex: =27

    RV_BtnReject As button:
        BorderColor: =RGBA(220, 224, 230, 1)
        BorderThickness: =1
        Color: =RGBA(193, 40, 40, 1)
        DisabledColor: =RGBA(186, 196, 214, 1)
        DisabledFill: =RGBA(240, 242, 246, 1)
        DisplayMode: |-
            =If(
                Not(IsBlank(varReviewProject)) And Not(IsBlank(varReviewComment)) And varReviewComment <> "",
                DisplayMode.Edit,
                DisplayMode.Disabled
            )
        Fill: =RGBA(255, 255, 255, 1)
        Height: =44
        HoverFill: =RGBA(253, 235, 235, 1)
        OnSelect: |-
            =Patch(AVCentralDepositProjects,
                LookUp(AVCentralDepositProjects, ID = varReviewProject.ID),
                {
                    Status: {Value: "Rejected"},
                    OwnerContact: varReviewProject.OwnerContact,
                    OwnerEmail: varReviewProject.OwnerEmail,
                    ReviewerComments: varReviewComment,
                    ReviewedByName: User().FullName,
                    ReviewedByEmail: User().Email,
                    ReviewedDate: Now()
                }
            );
            Notify("Request rejected. The owner will be notified on their next visit.", NotificationType.Warning);
            Set(varReviewProject, Blank());
            Set(varReviewComment, "")
        Size: =14
        Text: ="✕  Reject"
        Visible: =Not(IsBlank(varReviewProject))
        X: =676
        Y: =680
        ZIndex: =28

    RV_RejectHint As label:
        Color: =RGBA(140, 148, 160, 1)
        Height: =24
        Size: =12
        Text: ="A reviewer comment is required before rejecting."
        Visible: |-
            =Not(IsBlank(varReviewProject))
            And (IsBlank(varReviewComment) Or varReviewComment = "")
        Width: =440
        X: =860
        Y: =692
        ZIndex: =29

