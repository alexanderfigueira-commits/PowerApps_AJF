"'Success Screen' As screen.'tabletLayout_Success_ver3.0'":
    OnVisible: =

    CircleIcon As circle.Circle:
        X: =(Parent.Width - Self.Width) / 2
        Y: =184
        ZIndex: =1

    SuccessIcon As icon.Check:
        Height: =CircleIcon.Height
        Icon: =Icon.Check
        PaddingBottom: =Self.PaddingTop
        PaddingLeft: =Self.PaddingTop
        PaddingRight: =Self.PaddingTop
        PaddingTop: =24
        Width: =CircleIcon.Width
        X: =(Parent.Width - Self.Width) / 2
        Y: =184
        ZIndex: =2

    SuccessMessage As label:
        Align: =Align.Center
        AutoHeight: =true
        Height: =CircleIcon.Height
        Size: =20
        Text: ="Your request for a coverage was successfully submitted."
        Width: =Parent.Width * 0.75
        X: =(Parent.Width - Self.Width) / 2
        Y: =309
        ZIndex: =3

    ReturnFormButton As button:
        FontWeight: =FontWeight.Bold
        Height: =46
        OnSelect: |-
            =ResetForm(CoverageFormRequest); 
            NewForm(CoverageFormRequest);
            Navigate(FormScreen);
        Text: ="Return to a New Form"
        Width: =270
        X: =(Parent.Width - Self.Width) / 2
        Y: =627
        ZIndex: =4

    RequestNumberValue As label:
        Align: =Align.Center
        Size: =32
        Text: =CoverageFormRequest.LastSubmit.ID
        X: =(Parent.Width - Self.Width) / 2
        Y: =515
        ZIndex: =5

    RequestNumberTitle As label:
        Align: =Align.Center
        BorderColor: =RGBA(102, 102, 102, 1)
        BorderStyle: =BorderStyle.Dashed
        BorderThickness: =1
        Height: =137
        Overflow: =Overflow.Scroll
        PaddingTop: =20
        Size: =20
        Text: |-
            ="Your request number is: "
        Width: =406
        X: =(Parent.Width - Self.Width) / 2
        Y: =441
        ZIndex: =6

    ContactMessage As label:
        Align: =Align.Center
        AutoHeight: =true
        FontWeight: =FontWeight.Lighter
        Height: =CircleIcon.Height
        Text: ="Your request number was sent to your email address. Our team will contact you soon."
        Width: =Parent.Width * 0.75
        X: =(Parent.Width - Self.Width) / 2
        Y: =364
        ZIndex: =7

    HeaderContainer1_2 As groupContainer.horizontalAutoLayoutContainer:
        Height: =125
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =1366
        ZIndex: =8

        Logo_EC_Form_2 As image:
            Height: =125
            Image: ='logo--en'
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            PaddingLeft: =15
            Width: =310
            ZIndex: =1

        Home_Header_3 As text:
            AccessibleLabel: ="This is the header of the application containing the EC Logo and the Title of the Page"
            Align: =Align.Center
            AlignInContainer: =AlignInContainer.Center
            Color: =RGBA(255, 255, 255, 1)
            Default: ="Coverage Request    ⬛🟨🟥"
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(0, 18, 107, 1)
            Font: =Font.Verdana
            Height: =63
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 18, 107, 1)
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            Size: =24
            Width: =900
            X: =320
            Y: =40
            ZIndex: =2

        Icon19_1 As icon.CalendarBlank:
            AlignInContainer: =AlignInContainer.Center
            Height: =40
            HoverColor: =ColorFade(Self.Color, 50%)
            Icon: =Icon.AddToCalendar
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            OnSelect: |-
                =ResetForm(CoverageFormRequest); 
                NewForm(CoverageFormRequest);
                Navigate('Future Coverages');
            Tooltip: ="Future Coverages"
            Width: =75
            X: =41
            Y: =704
            ZIndex: =3

        Image1_1 As image:
            AlignInContainer: =AlignInContainer.Center
            Height: =60
            Image: =User().Image
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            RadiusBottomLeft: =3
            RadiusBottomRight: =3
            RadiusTopLeft: =3
            RadiusTopRight: =3
            Tooltip: |-
                =Office365Users.MyProfile().JobTitle & " " & User().FullName & Char(13) &
                Office365Users.MyProfile().MailNickname & " | " &Office365Users.MyProfile().Department
            Width: =60
            ZIndex: =4

