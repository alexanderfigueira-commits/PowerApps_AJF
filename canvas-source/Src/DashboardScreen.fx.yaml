DashboardScreen As screen:
    Fill: =RGBA(247, 248, 250, 1)
    OnVisible: |-
        =Set(varMonthStart, Date(Year(Now()), Month(Now()), 1));
        Set(varKpiRejectedAll,
            CountRows(Filter('Coverage Request (Belgium)', Status.Value = "Not Accepted")));
        Set(varKpiRejectedMonth,
            CountRows(Filter('Coverage Request (Belgium)', Status.Value = "Not Accepted", Created >= varMonthStart)));
        Set(varKpiMyMonthTotal,
            CountRows(Filter('Coverage Request (Belgium)', 'Created By'.Email = User().Email, Created >= varMonthStart)));
        Set(varKpiMyMonthSuccess,
            CountRows(Filter('Coverage Request (Belgium)', 'Created By'.Email = User().Email, Created >= varMonthStart, Status.Value = "Accepted")));
        Set(varKpiAllMonthTotal,
            CountRows(Filter('Coverage Request (Belgium)', Created >= varMonthStart)));
        Set(varKpiAllMonthSuccess,
            CountRows(Filter('Coverage Request (Belgium)', Created >= varMonthStart, Status.Value = "Accepted")));
        Set(varKpiAvgPublishDays,
            With({accepted: Filter('Coverage Request (Belgium)', Status.Value = "Accepted")},
                If(CountRows(accepted) = 0,
                    Blank(),
                    Round(Average(AddColumns(accepted, "durHours", DateDiff(Created, Modified, TimeUnit.Hours)), durHours) / 24, 1))))

