App:
  Properties:
    BackEnabled: =false
    OnStart: |-
      =Set(varUserRole, Coalesce(LookUp(RolesPermissionsList, UserEmail.Email = User().Email, Role.Value), "REQUESTOR"));
      Set(MyProfile, IfError(Office365Users.MyProfile(), Blank()));
      Set(varCurrentRequest, Defaults(AVCentralDepositRequests));
      Set(varFilter, "All");
      Set(varFilterDG, "");
      Set(varFilterStartDate, Blank());
      Set(varFilterEndDate, Blank());
      Set(varRequestTitle, "");
      Set(varRequestDG, "");
      Set(varRequestDescription, "");
      Set(varRequestOwnerContact, "");
      Set(varRequestOwnerEmail, User().Email);
      Set(varRequestMediaType, "");
      Set(varRequestAIDeclared, false);
      Set(varCurrentChildId, "");
      Set(varChildTitle, "");
      Set(varChildMediaType, "Photo");
      Set(varChildDescription, "");
      Set(varChildCaptureDate, Blank());
      Set(varChildProductionPlace, "");
      Set(varChildCredits, "");
      Set(varChildLanguageVersions, "");
      Set(varChildEpisodeTitle, "");
      Set(varChildEpisodeSummary, "");
      Set(varChildSeasonNumber, 0);
      Set(varChildEpisodeNumber, 0);
      Set(varChildSeriesTitle, "");
      Set(varChildProductType, "");
      Set(varChildProductionEndDate, Blank());
      Set(varChildPublicationStartDate, Blank());
      Set(varChildPublicationEndDate, Blank());
      Set(varChildLinks, "");
      Set(varChildTags, "");
      Set(varChildFTPPath, "");
      Set(varChildAIVoiceover, false);
      Set(varChildContractCase, "");
      Set(varChildContractCase1Sub, "");
      Set(varChildContractRef, "");
      Set(varChildModelRelease, false);
      Set(varChildModelReleaseProvided, false);
      Set(varChildMusicUsed, false);
      Set(varChildMusicLicenceProvided, false);
      Set(varChildPreexisting, false);
      Set(varChildPreexistingProvided, false);
      Set(varReviewComment, "");
      Set(varReviewProject, Blank());
      Set(varShowTemplatePicker, false);
      Set(varShowTplConfirm, false);
      Set(varTplSearch, "");
      Set(varTplCandidate, Blank());
      Set(varShowTypeConfirm, false);
      Set(varPendingMediaType, "");
      Set(varConfirmed, false);
      Set(varRating, 0);
      Set(varFeedbackText, "");
      Set(varFeedbackSent, false);
      Set(varMonthStart, Blank());
      Set(varKpiRejectedAll, 0);
      Set(varKpiRejectedMonth, 0);
      Set(varKpiMyMonthTotal, 0);
      Set(varKpiMyMonthSuccess, 0);
      Set(varKpiAllMonthTotal, 0);
      Set(varKpiAllMonthSuccess, 0);
      Set(varKpiAvgPublishDays, Blank())
    Theme: =PowerAppsTheme
